schema_version: 1
description: "Pre-registered, paired governed-catalog versus legacy direct-index validation of generation guards."
decision_rule:
  primary_safety:
    governed_critical_failures_max: 0
    governed_guard_compliance_required: true
  comparative_quality:
    governed_mean_score_must_be_at_least_legacy_minus: 0.5
    governed_pairwise_losses_max: 3
  interpretation: "All primary-safety conditions and both comparative-quality conditions must hold to call the R3 revision provisionally acceptable."
tasks:
  - id: RG01
    architecture: E
    mode: hypotheses
    story_state: complete
    guard_focus: bilateral_sign_reversal
    prompt: "Derive an opposing signed contingency in which high and low values of one boundary condition activate genuinely different mechanisms; do not add an unconditional main-effect hypothesis."
  - id: RG02
    architecture: E
    mode: hypotheses
    story_state: complete
    guard_focus: bilateral_nonabsence
    prompt: "Explain why the low-condition mechanism is not merely the absence of the high-condition mechanism, and state two directional conditional predictions."
  - id: RG03
    architecture: E
    mode: hypotheses
    story_state: complete
    guard_focus: cross_level_transmission
    prompt: "Develop a cross-level boundary argument that states focal unit, nesting, high- and low-context transmission pathways, and an interaction prediction."
  - id: RG04
    architecture: D
    mode: propositions
    story_state: complete
    guard_focus: transition_conditions
    prompt: "Develop a three-stage process theory in which each transition names an actor, a condition, and an observable next state; use propositions, not a net-effect hypothesis."
  - id: RG05
    architecture: D
    mode: no_numbered_hypotheses
    story_state: complete
    guard_focus: feedback_recipient_branch
    prompt: "Diagnose a process in which feedback reaches a specified actor and can reinforce, redirect, or terminate action; retain an open empirical agenda and use no numbered claims."
  - id: RG06
    architecture: D
    mode: propositions
    story_state: complete
    guard_focus: temporal_rivals
    prompt: "Reconcile two apparent rival explanations by assigning them different temporal stages and specifying the observable transition that separates their domains."
  - id: RG07
    architecture: B
    mode: no_numbered_hypotheses
    story_state: local_only
    guard_focus: local_only_suppression
    prompt: "Provide a local-only diagnostic for two mechanisms with unresolved construct boundaries; identify what must be locked before routing, with no numbered claims or paper-level conclusion."
  - id: RG08
    architecture: E
    mode: no_numbered_hypotheses
    story_state: local_only
    guard_focus: local_only_conditional_map
    prompt: "Map a possible conditional boundary relationship under an incomplete story contract; distinguish the rival mechanisms and evidence needed without writing hypotheses, propositions, or paper-state updates."
