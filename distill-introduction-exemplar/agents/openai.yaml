interface:
  display_name: "Distill Introduction Exemplar"
  short_description: "Distill intros and improve writing-skill design"
  default_prompt: "Use $distill-introduction-exemplar to distill this Introduction, preserve evidence provenance, and flag reusable patterns or write-introduction design defects. When dispatched from the paper pipeline (PDM): write sections/introduction.json and the feedback file to the PDM, and return only a <=20-line compact summary (identity, band, writeback candidates, paths, flags) — never full phase reports."
policy:
  allow_implicit_invocation: true
