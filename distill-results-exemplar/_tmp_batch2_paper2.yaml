corpus_enrichment:
  batch_id: batch_2026-05-22_paper2
  estimator_family: IV_2SLS
  source_paper: Singh_Grewal_2023_JMR
  source_subfield: marketing
  slot_updates:
  - slot: R2
    action: create_new
    skeleton_id: r2_iv_first_stage_pre_reporting
    skeleton: '[R2-IV] 在报告第二阶段主效应之前，先以独立段落报告第一阶段结果：列出工具变量对内生变量的估计系数、F统计量以拒绝弱工具变量原假设，并报告Wu-Hausman内生性检验和Sargan-Hansen过度识别检验结果。该段落同时承担table
      navigation功能，明确说明Table X的Panel A/B分别对应voluntary/mandatory recalls的第一阶段与第二阶段。'
  - slot: R3
    action: create_new
    skeleton_id: r3_iv_main_effect_dual_outcome
    skeleton: '[R3-IV] 主假设检验采用双结果并行报告结构：对voluntary和mandatory recalls分别报告第二阶段系数。每结果遵循四拍节奏——(1)方向：与H1一致，系数为负；(2)显著性：报告β值与p值（如β_lobbying
      = −2.473, p < .05）；(3)幅度：在Discussion中以经济显著性补充（如每增加04,367 lobbying减少一次voluntary recall）；(4)支持判断：Thus, Hypothesis X is
      supported。控制变量中显著项（如deaths、complaints）附带一句话实质解释。'
  - slot: R4
    action: create_new
    skeleton_id: r4_indirect_moderation_full_vs_partial
    skeleton: '[R4-间接调节] 报告交互效应时，区分full indirect moderation与partial indirect moderation：先报告简单交互项（Lobbying × Deaths, Lobbying
      × Media）的系数与显著性；再报告加入中介交互项（Lobbying × Media）后原交互项（Lobbying × Deaths）是否变得不显著（β=0, n.s.）。若原交互项不显著且新交互项显著，则判定为full indirect
      moderation，支持H4。若原交互项仍显著但幅度下降，则支持partial indirect moderation（Model A）。需在正文中明确引用Equation编号以引导读者。'
  - slot: R5
    action: create_new
    skeleton_id: r5_economic_significance_back_of_envelope
    skeleton: '[R5-经济显著性] 经济显著性不嵌入R3主效应段落，而是在Discussion中以back-of-the-envelope calculation独立呈现：将系数转化为具体金额（如04,367 lobbying
      → 1 fewer voluntary recall），并结合平均recall规模（235,638 vehicles）与单位成本假设（0/vehicle）估算总节省金额（~2 million）。适用于IV/计数模型中系数为计数单位、需要额外换算为市场/政策含义的场景。'
  - slot: R6
    action: create_new
    skeleton_id: r6_nonsignificant_indirect_moderation_acknowledgment
    skeleton: '[R6-非显著处理] 对非显著结果（如mandatory recalls中indirect moderation不显著）不回避，而是在交互效应段落末尾直接陈述：We do not find a statistically
      significant indirect moderation effect in [outcome]. All models account for unobserved heterogeneity with [fixed effects].
      该句式将非显著发现嵌入同一表格报告段落，避免独立R6槽位，保持叙事连贯性。'
  - slot: R7
    action: create_new
    skeleton_id: r7_iv_robustness_threat_based_four_block
    skeleton: '[R7-IV稳健性] 按四大威胁组织稳健性检验，每威胁对应独立子节：(1) Long-Term Effects——以Koyck stock变量检验carryover效应；(2) Simultaneous Equation
      System——以GMM同时估计firm与regulator方程，允许误差相关并修正异方差/自相关；(3) Exogenous Event——以外生冲击（如Flint水危机）作为自然实验，用DiD验证GM相对其他企业的lobbying与recall双重差异；(4)
      Nonlinear Specification——以ordered probit + conditional mixed process处理离散有序因变量。每子节遵循[威胁定位]→[检验动作]→[结果unchanged]→[结论降低担忧]四拍。'
  - slot: R8
    action: create_new
    skeleton_id: r8_exogenous_event_natural_experiment
    skeleton: '[R8-外生事件] 将外生事件（如Flint水危机）作为补充分析而非主识别策略：描述事件如何影响处理企业（GM）的lobbying但不影响recall，构建pre/post相对其他企业的双重差分，报告mean values变化与DiD结果，并明确标注该分析为relative
      assessment，结果consistent with previous results。适用于IV设计中寻求外部效度增强的场景。'
  novel_patterns:
  - slot: R4
    observation: 首次在marketing顶刊中观察到indirect moderation（Van Kollenburg & Croon 2021）的完整实证报告范式：通过Equation 2→5的嵌套模型序列，区分Model
      A（partial indirect moderation）与Model B（full indirect moderation），并以β43是否显著为判定标准。该模式将统计检验与理论模型图（Figure 4）严格对应。
    note: 建议纳入write-results R4模板，作为间接调节效应的标准报告范式。
  - slot: R5
    observation: 经济显著性完全后置到Discussion，而非嵌入Results。作者在Results中只报告统计系数，在Discussion中通过back-of-the-envelope calculation将系数转化为具体政策/市场含义（04,367
      → 1 fewer recall → 2M savings）。
    note: 这是一种R5后置策略，适用于系数单位为计数、需要额外假设才能转化为经济含义的设计（IV/计数模型）。
  - slot: R7
    observation: IV论文的稳健性检验采用了罕见的exogenous event + DiD组合：以Flint水危机作为外生冲击，验证GM的lobbying增加与recall下降的双重差异。这不是主识别策略，而是作为external
      validity的增强检验。
    note: 为IV设计提供了除GMM/非线性之外的外部效度检验新范式，可作为R8或R7的补充块。
  - slot: R2-R3
    observation: Results部分以Table 4（IV 2SLS主效应）和Table 5（Moderation）两张表完成全部假设检验，无模型序列递增（Model 1→2→3）。导航语句极简：[Table X contains
      the results for IV 2SLS model]。这种极简导航适用于假设数量少（4个）、且每假设有独立表格的场景。
    note: 与OLS/FE论文的Model 1→2→3递增序列形成对比，可作为IV/特殊设计论文的R2变体。
