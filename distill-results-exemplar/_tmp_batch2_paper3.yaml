  - slot: R2
    action: create_new
    skeleton_id: r2_heckman_first_stage_navigation
    skeleton: Since not all firms in our sample [experienced the event] in a given year, we used Heckman selection models
      to control for selection bias by estimating a firm’s likelihood of [event] using a selection instrument, which should
      be related to selection (i.e., [selection likelihood]) but not outcomes (i.e., [dependent variable]; [citation]). We
      used [policy_shock] as our selection instrument ([citation]). Table 2 presents the first-stage results, where the [instrument]
      exhibits a robust positive coefficient (b = [value], p < [threshold]), confirming that [instrument] is highly relevant
      for predicting [event]. Therefore, the instrument is both conceptually valid and statistically significant for isolating
      the selection effect.
  - slot: R3
    action: create_new
    skeleton_id: r3_probit_marginal_effect_four_beat
    skeleton: Model [X] (Table [Y]) reports the second-stage results of the Heckman selection probit model. The analysis shows
      a [positive/negative] and significant coefficient for [predictor] (b = [value], p = [threshold]). Due to the difficulty
      in directly interpreting regression coefficients and significance levels in probability models ([citation]), and as
      hypotheses should not be tested solely by examining p-values ([citation]), the average marginal effect is visualized
      in Figure [Z]. The confidence intervals (CIs) of the marginal effects do not cross zero, thus supporting Hypothesis
      [H]. A one-standard-deviation increase in [predictor] from the mean value ([from] to [to]) [increased/decreased] the
      probability of [outcome] from [base]% to [new]%.
  - slot: R4
    action: create_new
    skeleton_id: r4_interaction_marginal_effect_region_plot
    skeleton: Model [X] (Table [Y]) adds the interaction term between [moderator] and [predictor], yielding a [positive/negative]
      coefficient for [outcome] (b = [value], p [relation] [threshold]). Although this interaction term is not statistically
      significant at the conventional p = 0.05 threshold, Figure [Z] indicates that the marginal effect of [predictor] is
      significant for [moderator] levels below [value]. Thus, Hypothesis [H] is partially supported.
  - slot: R5
