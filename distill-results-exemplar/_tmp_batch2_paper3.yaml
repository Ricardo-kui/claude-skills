  - slot: R7
    action: create_new
    skeleton_id: r7_iv_threat_based_robustness
    skeleton: '[Threat sentence]. A common approach to this problem is using two-stage least squares modeling ([citation]).
      Regarding [predictor_A], we used two instruments: [Instrument_1] and [Instrument_2]. [Instrument_1] ([citation]) exploits
      the heterogeneous effect of a nationwide regulatory change or exogenous shock ([citation]; [citation]). Known also as
      a shift-share instrument, it acts as a difference-in-difference analysis, with the shock affecting the independent variable
      ([citation]). [Rationale for instrument validity]. Regarding [Instrument_2], our rationale is that it primarily determines
      [predictor] ([citation]). However, any effect on [outcome], if present, operates solely through [predictor]. With respect
      to [predictor_B], we used another two instruments: [Instrument_3] and [Instrument_4]. Both variables can largely influence
      [predictor_B]; however, their effects on [outcome], if present, are likely to operate exclusively through [predictor_B].
      As reported in [Appendix Table], we used the Sargan-Hansen test to examine the validity of these instruments ([citation]).
      The test results suggest that our instruments are exogenous (Hansen’s J chi2([df]) = [value], p = [threshold]). Furthermore,
      the second-stage regression models produced results consistent with those of the main models.'
  - slot: R8
    action: create_new
    skeleton_id: r8_post_hoc_tactic_differences
    skeleton: We also assessed whether the two [tactics] indeed differ in meaningful ways as we discussed previously. Our
      results suggest that [group_A] are significantly [more/less] likely to [outcome1] (Models [X]–[Y]), but do not exhibit
      a notable preference for [outcome2] (Models [X]–[Y]). [Theoretical interpretation]. [Group_B] are [more/less] likely
      to [outcome1] but [more/less] likely to [outcome2]. [Theoretical interpretation]. Overall, these additional analyses
      suggest that, while [tactic1] and [tactic2] are both relevant, [tactic1] is likely to be primary and more active than
      [tactic2].
  novel_patterns:
  - slot: R2
    observation: Heckman selection model中，第一阶段结果单独成表（Table 2），并在Results正文中详细报告第一阶段系数和显著性，而非仅在Appendix呈现。
    note: 这为write-results中Heckman/选择模型提供了第一阶段前置导航的新范式。
  - slot: R3
    observation: Probit模型结果报告采用四拍变体：方向→系数显著性→边际效应可视化（Figure）→概率幅度解释→支持判断。特别强调了'不应仅凭p值检验假设'的元科学声明。
    note: 这是MVP30语料库中首次出现的Probit结果四拍+元科学声明的混合节奏，建议作为Logit/Probit骨架的推荐变体。
  - slot: R4
    observation: 交互效应报告采用'系数不显著但边际效应图显示区域显著'的策略，并据此给出'partially supported'的判断。
    note: 这为处理边界显著交互提供了新的R4骨架变体，但需在skill中增加警告：仅当图形显示清晰阈值边界时才可使用。
  - slot: R7
    observation: IV稳健性检验为两种核心自变量分别配备两组工具变量（共4个IV），并使用Sargan-Hansen overidentification test统一检验，而非逐变量报告。
    note: 这是一种高度结构化的IV稳健性组织方式，适用于多核心自变量的IV设计。
  - slot: R8
    observation: 事后分析比较两种因变量（战略时机 vs 战略沉默）在控制变量上的差异反应，并赋予理论解释，将其包装为'differences in IM tactics'而非纯粹的robustness。
    note: 这是一种将post hoc检验转化为理论贡献的修辞策略，可作为R8的新范式。
