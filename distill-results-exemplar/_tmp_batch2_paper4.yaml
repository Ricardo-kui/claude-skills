  - slot: R2
    action: create_new
    skeleton_id: r2_iv_first_stage_navigation
    skeleton: In the first stage, we regress [endogenous_variable] on [instrument_vector], along with all other control variables
      (i.e., [firm_characteristics], [peer_group_characteristics], and [fixed_effects]). The first-stage output is in [Table
      X]. [Instrument 1], [Instrument 2], and [Instrument 3] have significant effects on [endogenous_variable]. The R-square
      of the first-stage regression is [value]; the joint significance test for the instrumental variables is significant
      (F([df]) = [value], p < [threshold]). These statistics indicate that we do not have a problem of weak instruments, and
      instrument relevance is satisfied.
  - slot: R3
    action: create_new
    skeleton_id: r3_iv_second_stage_four_beat
    skeleton: As we report in [Model X] of [Table Y], the [effect_name] is statistically significant (beta = [value], p <
      [threshold]). Because we have multiple instruments, we conducted overidentification tests too, and the [Test Name] of
      [value] (p > [threshold]) indicates that our study does not suffer from overidentification issues. Thus, [Hypothesis/Research
      Question] is supported.
  - slot: R7
    action: create_new
    skeleton_id: r7_falsification_placebo_network
    skeleton: As falsification, we test the assertion that [focal_unit] should not [outcome_verb] from [units] that are outside
      its [group_type]. To construct a 'false' [group_type], we randomly assign [units] to [groups]. We then run a regression
      with [fixed_effects] where all [group_type]-related variables are constructed based on the 'false' [groups]. We find
      no [effect_name] (beta = [value], p > [threshold]), lending credibility to our argument that [units] are not [outcome_verb]
      from all [units] whose [behavior] are observable.
  - slot: R7
    action: create_new
    skeleton_id: r7_robustness_threat_catalog_table
    skeleton: 'We conducted additional analyses to exclude alternative explanations (summarized in [Table X]). [Threat 1]:
      [Description of threat]. [Test and result sentence]. [Threat 2]: [Description of threat]. [Test and result sentence].
      [Threat 3]: [Description of threat]. [Test and result sentence].'
  - slot: R7
    action: create_new
    skeleton_id: r7_robustness_analyst_scrutiny
    skeleton: '[External_actor] serve as the external governance mechanism for [stakeholders] through monitoring [focal_behavior].
      When more [peers] [behavior], [focal_units] that do not [behavior] face higher pressure from [external_actor] and may
      eventually choose to [behavior]. To test the plausibility of this explanation, we collected [data_source] and created
      a set of variables describing how likely [external_actor] are to [action]. We find robust [effect_name] after controlling
      for [external_actor] variables ([Model X] of [Table Y]).'
  - slot: R7
    action: create_new
    skeleton_id: r7_robustness_endogenous_reference_group
    skeleton: We construct a [unit]'s [group_type] based on [membership_criterion]. It is likely that a [unit]'s [membership_decision]
      is correlated to its [outcome_decision], which may bias the [effect_name] estimates. We first examine whether the binary
      [outcome_decision] is correlated to the binary [membership_decision]. We cross-tabulate the two decisions and conduct
      the chi-square test. The analysis shows that the two decisions are not correlated (chi-square = [value], p > [threshold]).
      We then add the binary [membership_decision] variable as an additional covariate and run the [estimation_method] regression.
      We still find robust [effect_name] ([Model X] of [Table Y]).
  - slot: R7
    action: create_new
    skeleton_id: r7_robustness_habitual_behavior
    skeleton: We conduct two robust tests to alleviate the concern that a [unit]'s habitual [behavior] causes the issues of
      autocorrelation and state dependence and thus biases the estimation of [effect_name]. First, we run a [estimation_method]
      with [unit] fixed effects. [Unit] fixed effects remove [units]' time-invariant characteristics, including their inherent
      predisposition of [behavior_A] or [behavior_B]. We obtain robust [effect_name] even after adding [unit] fixed effects
      (beta = [value], p < [threshold], [Model X]). Second, we examine whether the effects of [mechanism] exist when [units]
      [behavior] for the first time. First-time [actors] are not influenced by habitual behaviors, as past behaviors are nonexistent,
      but they may still be influenced by [peer_behavior]. Therefore, the existence of [mechanism] effects for first-time
      [actors] can confirm [effect_name] without the issue of habitual [behavior]. We obtain a positive and significant [effect_name]
      (beta = [value], p < [threshold], [Model X]).
  - slot: R4
    action: create_new
    skeleton_id: r4_peer_subgroup_decomposition
    skeleton: 'We estimate [Equation X] to determine how a [unit] resolves the uncertainty in [decision]—whether it infers
      information from the behavior of [benchmark_type_A] or [benchmark_type_B]. We rank-order [units] within their [group_type]
      on the basis of [characteristic], and we keep the [units] with [characteristic] in the middle range (deciles [a] to
      [b]) as focal [units]. We then categorize each focal [unit]''s [peers] into four groups based on [characteristic]: [Group
      1], [Group 2], [Group 3], and [Group 4]. We then construct corresponding [peer_behavior_variables]. The effect of the
      [Group 2] is highest (beta = [value], p < [threshold]), followed by [Group 3] (beta = [value], p < [threshold]), [Group
      1] (beta = [value], p < [threshold]), and [Group 4] (beta = n.s.). The [test_type] for the difference between the [Group
      2] and [Group 3] is statistically significant (F-statistic = [value], p < [threshold]).'
  - slot: R8
    action: create_new
    skeleton_id: r8_similarity_dimension_decomposition
    skeleton: '[Previous_result] shows that [units] are more likely to be influenced by [peer_type]. We next investigate how
      the [peer_type] influence varies, depending on those [peers]'' [dimension_A] and [dimension_B]. [Theoretical rationale
      for dimension_A]. Alternatively, [theoretical rationale for dimension_B]. We test in turn for the relative importance
      of [dimension_A] and [dimension_B] in driving [peer_type] influence. [Measurement of dimension_A]. [Measurement of dimension_B].
      In turn, we divide the [peer_type] of [unit] into four groups, using median splits of the two similarity dimensions,
      such that we obtain the following subgroups: [Subgroup 1], [Subgroup 2], [Subgroup 3], and [Subgroup 4]. [Result sentence
      showing which dimension drives differentiation]. [Follow-up analysis collapsing into two groups per dimension]. In summary,
      we find evidence that, on average, [units] mimic [peers] that are similar in [dominant_dimension] more so than [peers]
      that are similar in [nondominant_dimension].'
  - slot: R5
    action: create_new
    skeleton_id: r5_marginal_probability_interpretation_lpm
    skeleton: Our results indicate a robust [effect_name]; if [peer_behavior] increases by [X%], a [unit]'s [outcome_probability]
      increases by [Y%]-[Z%].
  novel_patterns:
  - slot: R7
    observation: 稳健性检验采用'目录式表格+段落展开'的混合组织：Table 6 用两列（Alternative Explanation / Tests and Results）高密度罗列5种威胁，正文再对关键威胁（analyst
      scrutiny, advertising spending, industry entry, habitual reporting）逐段展开。
    note: 这是 IV/同伴效应类论文处理大量稳健性检验的高效组织方式，既满足扫描型读者（看表格），也满足深度读者（读段落）。
  - slot: R2
    observation: IV 论文将第一阶段结果（First-Stage 2SLS）独立成表（Table 5），但在 Results 正文中将第一阶段导航段落嵌入 R3 主效应之后、稳健性之前，形成'主效应→第一阶段细节→稳健性'的非标准顺序。
    note: 这与标准 IV 顺序（第一阶段前置）不同，体现了 LPM+IV 在营销期刊中的叙事灵活性。
  - slot: R4
    observation: 同伴效应论文的交互/分解检验采用'四组分解→控制函数内生性修正→逐组2SLS'的三层递进结构，而非标准简单斜率分析。
    note: 这是网络效应/同伴效应类设计特有的 R4 变体，与标准交互效应报告逻辑不同。
  - slot: R3
    observation: 主假设检验采用'相关性证据→加入外生同伴特征→2SLS→安慰剂'的四列递进表格（Table 4），但正文叙事只聚焦第3列（2SLS），对第1-2列的叙述极为精简。
    note: 体现了 IV 论文'识别优先'的叙事策略：快速掠过相关性证据，将读者注意力导向因果估计。
