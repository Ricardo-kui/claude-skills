corpus_enrichment:
  batch_id: batch_2026-05-22_paper5
  estimator_family: Logit_Probit_Ordered_Probit
  source_paper: 'Pfarrer, Pollock, & Rindova (2010), A Tale of Two Assets: The Effects of Firm Reputation and Celebrity on
    Earnings Surprises and Investors'' Reactions, Academy of Management Journal'
  source_subfield: strategy
  slot_updates:
  - slot: R1
    action: create_new
    skeleton_id: r1_descriptive_vif_relogit
    skeleton: '[Descriptive statistics + correlation matrix presented first, with explicit note that VIFs are below threshold
      and multicollinearity is not a concern]. Then, [estimation approach declared upfront: random-effects logistic regression
      for binary outcome panels, with rationale for between-firm focus and convergence advantages]. [Odds-ratio reporting
      convention stated explicitly to aid interpretation].

      '
  - slot: R2
    action: create_new
    skeleton_id: r2_binary_outcome_hypothesis_pair_table
    skeleton: '[Hypotheses tested in matched pairs (H1a/H1b, H2a/H2b) across two separate tables for positive vs negative
      surprise dummies]. [Column 1 = controls only; Column 2 = full model with focal dummies]. [Each hypothesis evaluated
      by referencing odds ratio and significance, with explicit directional language: "were less/more likely"]. [Mixed support
      acknowledged in-line: one hypothesis in pair supported, the other not, without deferring to Discussion].

      '
  - slot: R3
    action: create_new
    skeleton_id: r3_eventstudy_nonparametric_validation
    skeleton: '[Before presenting CAR comparisons, a brief nonparametric validation sentence confirms that the market indeed
      views positive surprises favorably and negative surprises as bad news (Patell Z and generalized sign tests)]. [This
      establishes that the event-study metric is behaving as expected before subgroup t-tests are interpreted].

      '
  - slot: R4
    action: create_new
    skeleton_id: r4_subgroup_mean_comparison_ttest
    skeleton: '[Results organized by subgroup category (high reputation / celebrity / none) with mean CARs, pairwise differences,
      and significance from paired t-tests of unequal variances]. [Directional predictions tested by comparing each treatment
      group to baseline and to each other]. [Support language is precise: "significantly larger than," "significantly different
      from," "not significantly different from"]. [Mixed support again handled in-line: H4c not supported because the two
      treatment groups do not differ significantly from each other].

      '
  - slot: R5
    action: create_new
    skeleton_id: r5_robustness_gee_heckman_endogeneity
    skeleton: '[Robustness section opens by stating the limitation of the primary test (lack of controls for CAR size) and
      introduces GEE regression as a supplemental check]. [Explicit caveat that the regression does not directly test the
      relative hypotheses but examines direct relationships with magnitude]. [Endogeneity addressed via Heckman correction,
      with first-stage significance reported and selection instrument insignificance interpreted as evidence that endogeneity
      is not a significant problem]. [All robustness results summarized narratively rather than in full tables, with key coefficients
      and significance levels noted].

      '
  novel_patterns:
  - slot: R2
    observation: Binary-outcome hypotheses are tested using random-effects logit with matched-sample panel data, and results
      are reported as odds ratios rather than coefficients. The narrative explicitly translates odds ratios into likelihood
      language for reader accessibility.
    note: Useful for strategy papers using dichotomous event outcomes with repeated measures.
  - slot: R3
    observation: A brief nonparametric validation (Patell Z + generalized sign) is inserted between the estimation-method
      description and the subgroup comparison tables. This acts as a sanity check before interpreting heterogeneous treatment
      effects.
    note: Can be adapted to other event-study papers where the primary test is subgroup comparison rather than regression.
  - slot: R4
    observation: Subgroup mean comparisons (high reputation vs celebrity vs none) are presented in dedicated tables with paired
      t-tests, rather than embedding interaction terms in a single regression. This is a non-regression approach to testing
      moderation-like predictions.
    note: Applicable when the theory predicts ordinal differences across discrete categories rather than continuous interactions.
  - slot: R5
    observation: Robustness checks include both an alternative estimator (GEE) and an endogeneity correction (Heckman), but
      the authors explicitly note that the GEE regressions do NOT directly test the relative hypotheses. This is an unusual
      and commendable honesty move.
    note: 'Worth emulating: clearly delineate what a robustness check can and cannot speak to.'
  - slot: R5
    observation: Heckman correction is justified by referencing Bascle (2008) criteria for estimator selection, and the narrative
      explicitly reports that the selection instrument was insignificant in the second stage, concluding endogeneity is not
      a significant problem.
    note: Provides a template for how to report and interpret a failed/favorable Heckman correction without overclaiming.
  batch_metadata:
    total_papers_processed: 1
    estimator_family: RE_Logit_EventStudy_ttest
    novel_skeletons_found: 5
    rejected_skeletons: 0
