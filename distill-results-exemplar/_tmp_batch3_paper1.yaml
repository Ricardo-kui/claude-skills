corpus_enrichment:
  batch_id: "batch_2026-05-22_paper1_v2"
  estimator_family: "生存分析"
  source_paper: "Mayo_Ball_Mills_2022_POMS"
  source_subfield: "om"
  slot_updates:
    # --- R1: 描述性统计与诊断 ---
    - slot: "R1"
      action: "append_skeleton_or_increment"
      skeleton_id: "r1_paragraph_descriptive_vif"
      skeleton_level: "paragraph"
      skeleton: "[Descriptive statistics table reference]. [Correlation matrix reference]. [VIF diagnostic report]. [Multicollinearity conclusion]."
    - slot: "R1"
      action: "create_new"
      skeleton_id: "r1_sentence_vif_check"
      skeleton_level: "sentence"
      skeleton: "To alleviate multicollinearity concerns, we measure the variance inflation factors (VIFs) and find no VIFs greater than [threshold], indicating a low likelihood that multicollinearity is leading to inefficient estimates in our regressions."

    # --- R2: 模型序列 / 表格导航 ---
    - slot: "R2"
      action: "append_skeleton_or_increment"
      skeleton_id: "r2_paragraph_model_sequence_controls_first"
      skeleton_level: "paragraph"
      skeleton: "[Table navigation]. [Controls-only model observation]. [Key control variable directional notes]. [Full model introduction]."
    - slot: "R2"
      action: "create_new"
      skeleton_id: "r2_sentence_controls_direction"
      skeleton_level: "sentence"
      skeleton: "We first include all control variables and observe that [control_i] and [control_j] are positively associated with the hazard of [DV], while [control_k] and [control_l] are negatively associated with the hazard of [DV]."

    # --- R3: 主假设检验 ---
    - slot: "R3"
      action: "append_skeleton_or_increment"
      skeleton_id: "r3_paragraph_hazard_four_beat"
      skeleton_level: "paragraph"
      skeleton: "[Hypothesis restatement]. [Table navigation + model reference]. [Coefficient direction and significance]. [Exponential transformation / magnitude interpretation]. [Support judgment]."
    - slot: "R3"
      action: "create_new"
      skeleton_id: "r3_sentence_coefficient_significance_hazard"
      skeleton_level: "sentence"
      skeleton: "Model [Y] of [Table X] shows that the coefficient for [IV] is [positive/negative] and statistically significant (β = [value], p < [threshold]) in comparison to [reference category]."
    - slot: "R3"
      action: "create_new"
      skeleton_id: "r3_sentence_exponential_magnitude"
      skeleton_level: "sentence"
      skeleton: "In this model, a positive β coefficient indicates a higher hazard of [DV]. Specifically, the relationship between the hazard rate and the β coefficient is given by exp(β) – 1 as hazard model coefficients need to be interpreted exponentially. Thus, the hazard of [DV] during [IV condition] is [value]% [greater/lower] than in the [reference category]."
    - slot: "R3"
      action: "create_new"
      skeleton_id: "r3_sentence_support_judgment"
      skeleton_level: "sentence"
      skeleton: "This provides support for Hypothesis [N]. The hazard of [DV] is [high/low] [early/late] in [IV] and [decreases/increases] afterward."

    # --- R4: 交互效应 / 条件效应 ---
    - slot: "R4"
      action: "append_skeleton_or_increment"
      skeleton_id: "r4_paragraph_interaction_replication"
      skeleton_level: "paragraph"
      skeleton: "[Hypothesis introduction]. [Replication column reference for model comparison]. [Interaction term coefficient + significance]. [Directional interpretation of moderation]. [Additional observation on unexpected term]."
    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_sentence_interaction_significance"
      skeleton_level: "sentence"
      skeleton: "The coefficient for [moderator] * [IV] (β = [value], p < [threshold]) is [positive/negative] and significant, indicating that the [high/low] hazard of [DV] [early/late] in [IV] is [stronger/weaker] when [moderator condition], lending support to Hypothesis [N]."

    # --- R4 variant: 子群分析 (Wald test) ---
    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_paragraph_subgroup_wald"
      skeleton_level: "paragraph"
      skeleton: "[Subgroup delineation]. [Replication column reference]. [Test objective statement]. [Low-mod subgroup null result]. [High-mod subgroup significant result]. [Wald chi-square test for coefficient difference]. [Mechanism conclusion: effect fully explained by subgroup]."
    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_sentence_subgroup_null"
      skeleton_level: "sentence"
      skeleton: "When [DV] is [low/high] [moderator], we find no significant relationship between [IV] and the hazard of [DV] (column [N], β = [value], p > [threshold])."
    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_sentence_subgroup_significant"
      skeleton_level: "sentence"
      skeleton: "However, when [DV] is [low/high] [moderator], we find a significant effect of [IV] (column [N], β = [value], p < [threshold]) on the hazard of [DV]."
    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_sentence_wald_comparison"
      skeleton_level: "sentence"
      skeleton: "The coefficient for [IV] in column [N] of [Table X] is also statistically different from and greater in magnitude than the [IV] coefficient in column [M] of [Table X] (Wald chi-square test p < [threshold])."
    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_sentence_full_explanation_mechanism"
      skeleton_level: "sentence"
      skeleton: "In fact, column [N] of [Table X] indicates that [low/high] [moderator] [DV] are statistically independent of [IV], which implies that [high/low] [moderator] [DV] fully explain the [low/high] hazard of [DV] [early/late] in [IV], lending support to Hypothesis [N]."

    # --- R5: 图形化呈现 ---
    - slot: "R5"
      action: "append_skeleton_or_increment"
      skeleton_id: "r5_paragraph_figure_coefficient_plot"
      skeleton_level: "paragraph"
      skeleton: "[Figure navigation]. [Panel-by-panel coefficient pattern description]. [Cross-condition comparison]."
    - slot: "R5"
      action: "create_new"
      skeleton_id: "r5_sentence_figure_panel_description"
      skeleton_level: "sentence"
      skeleton: "In Figure [X][panel], we observe a [high/low] hazard for [IV condition 1] and a [high/low] hazard for [IV condition 2]."

    # --- R7: 稳健性检验 ---
    - slot: "R7"
      action: "append_skeleton_or_increment"
      skeleton_id: "r7_paragraph_threat_based_robustness"
      skeleton_level: "paragraph"
      skeleton: "[Threat positioning sentence]. [Test action: alternative model/method]. [Result: consistent support with coefficient reference]. [Conclusion: confidence building]."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_threat_positioning"
      skeleton_level: "sentence"
      skeleton: "One concern is that our findings depend on [specific threat]."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_test_action"
      skeleton_level: "sentence"
      skeleton: "To address this concern, we re-estimate our models using [alternative method]."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_consistent_support"
      skeleton_level: "sentence"
      skeleton: "Column [N] of [Table X] indicates consistent support in comparison to [Table Y] as the [IV] β = [value] (p < [threshold]) and the [IV] β = [value] (p < [threshold])."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_aggregate_confidence"
      skeleton_level: "sentence"
      skeleton: "In aggregate, the results of these alternative specifications help build confidence that our [estimator] modeling strategy is robust to alternative methodological choices."

    # --- R7 variant: 测量敏感性 ---
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_paragraph_measure_sensitivity"
      skeleton_level: "paragraph"
      skeleton: "[Central measure importance statement]. [Original categorization rationale]. [Alternative measure 1: linear/log]. [Alternative measure 2: different categorization]. [Cross-specification comparison with figure reference]. [Conclusion: artifact exclusion]."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_measure_sensitivity_conclusion"
      skeleton_level: "sentence"
      skeleton: "These results shown in Figure [X] provide overall support for Hypothesis [N] and indicate that our finding that the hazard of [DV] is [high/low] [early/late] in [IV] and [decreases/increases] afterward is unlikely to be an artifact of using [original measure] to measure [IV]."

    # --- R7 variant: CEM 匹配 ---
    - slot: "R7"
      action: "append_skeleton_or_increment"
      skeleton_id: "r7_paragraph_cem_matching"
      skeleton_level: "paragraph"
      skeleton: "[Sample selection bias concern]. [CEM method introduction with theoretical covariates]. [Matching procedure details]. [ATE results for treatment conditions]. [Conclusion: selection bias control confirmation]."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_cem_ate"
      skeleton_level: "sentence"
      skeleton: "In row [N] of [Table X], we observe a [positive/negative] and significant treatment effect of [IV] (Average Treatment Effect (ATE) = [value], p < [threshold]) on the likelihood of [DV]."

    # --- R7 variant: 反向因果 ---
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_paragraph_reverse_causality"
      skeleton_level: "paragraph"
      skeleton: "[Reverse causality threat definition]. [Test design: IV→DV direction flip]. [Control model observations]. [Key IV coefficient null result]. [Conclusion: reverse causality unlikely]."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_reverse_causality_conclusion"
      skeleton_level: "sentence"
      skeleton: "These results indicate that reverse causality is unlikely to be creating significant bias in our study."

    # --- R7 variant: 替代解释排除 ---
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_paragraph_alternative_exclusion"
      skeleton_level: "paragraph"
      skeleton: "[Alternative theory introduction]. [Multiple operational measures description]. [Interaction design rationale]. [Results: main effects persist, interactions null]. [Reasonable confirmation statement with hedging]."
    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_alternative_exclusion"
      skeleton_level: "sentence"
      skeleton: "This provides reasonable confirmation that the observed effects are more likely explained by [primary theory] not by changes in [alternative mechanism], though the alternative explanation cannot be completely ruled out in a study such as ours."

  novel_patterns:
    - slot: "R4"
      observation: "子群分析中不仅报告分样本系数，还使用 Wald chi-square 检验直接比较系数差异，并进一步指出低 discretion 组中主效应完全消失（β≈0, p>0.10），从而将机制验证从‘差异显著’推进到‘效应由某子群完全解释’。"
      note: "这是一种比常规交互项更强的机制验证策略，值得在 om / ob_hr 领域推广。"
    - slot: "R8"
      observation: "在生存分析/hazard模型中引入CEM匹配作为稳健性检验，而非PSM。作者明确对比了CEM与PSM的区别（King & Nielsen 2019），并基于四个理论驱动的协变量进行粗化匹配，报告ATE而非 hazard ratio。"
      note: "为 hazard / 事件历史类论文提供了样本选择稳健性的可迁移范式，尤其是当处理变量为 tenure 分段时。"
    - slot: "R9"
      observation: "针对‘产品质量随 tenure 提升’这一替代解释，作者设计了三种 operational performance 测量（COGS变化、10-K文本运营改善词频、CEO运营背景），并以交互项形式逐一检验。所有交互项均不显著，从而保留原解释。"
      note: "这是处理‘潜在混淆机制’的系统性方法，适用于任何以 tenure / experience 为核心自变量的研究。"
    - slot: "R2-R5"
      observation: "全文结果部分采用‘假设驱动’的叙事结构：每个假设对应一个表格（Table 6/7/8），并在表格之间插入系数图（Figure 1a/b/c），形成‘表格+图形’的交替节奏，而非一次性堆砌所有回归结果。"
      note: "这种节奏适合假设数量较少（3个）且每个假设有明确机制的故事线，可作为 3-hypothesis 论文的参考模板。"

  batch_metadata:
    total_papers_processed: 1
    estimator_family: "复发事件生存分析 / Recurrent-Event Hazard (Exponential)"
    novel_skeletons_found: 4
    rejected_skeletons: 0
