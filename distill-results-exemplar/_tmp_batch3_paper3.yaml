## Phase 2 — 深度提炼

### 2.1 段落节奏提炼

#### R3 主假设检验四拍节奏（Probit + AME 版）

```text
[拍1-方向]: Hypothesis [x] predicted that [predictor] would be [positive/negative] associated with [outcome].
[拍2-显著性]: As Model [y] reports, the coefficient for [predictor] was [positive/negative] and significant ([coefficient], [p-value]).
[拍3-幅度]: [Figure X] plots the marginal effect. A one-standard-deviation increase in [predictor] from the mean ([from] to [to]) [increased/decreased] the probability of [DV] from [base]% to [new]%.
[拍4-判断]: Thus, Hypothesis [x] is supported.
```

**变体观察**：
- 拍2 与拍3 之间插入 "Due to the difficulty in directly interpreting regression coefficients... the average marginal effect is visualized"，作为非线性模型的标准过渡。
- 拍3 使用概率变化（%）而非线性单位变化，符合 Logit/Probit 范式。
- H3a 不显著时，节奏变为：方向→系数不显著→区域显著性图说明→partial support（非标准四拍，属弹性处理）。

#### R7 稳健性检验节奏

```text
[威胁定位]: Unobservable [unit]-level factors could affect [IV] and [DV]. Some of these factors may introduce reverse causality, omitted variable bias, or both, leading to potential endogeneity.
[检验动作]: To address this concern, we re-estimate our models using [method].
[结果]: The second-stage regression models produced results consistent with those of Models [Y] and [Z].
[结论]: reducing concerns that [threat] drives the findings.
```

**变体观察**：
- 该论文 R7 按 threat 组织（endogeneity → selection → construct differences → unobserved heterogeneity）。
- 每个 threat 均有明确方法对应，结果表述为 "consistent with" / "substantively unchanged"。

