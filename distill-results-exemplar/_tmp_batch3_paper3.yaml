## Phase 5 — QC

- [x] **Completeness**: 强制槽位（R1, R2, R3, R5, R7）全部覆盖
- [x] **Clarity**: 每个骨架均有明确 [占位符] 和插入位置
- [x] **Placeholder Purity**: sentence-level 骨架中已替换所有论文特有名词为标准占位符
- [x] **Level Separation**: paragraph-level 只描述组织逻辑；sentence-level 填入占位符后可生成完整句子
- [x] **Credibility**: 未将单篇论文的特殊统计发现泛化为通用规则
- [x] **Replicability**: 骨架填入具体信息后，能生成类似顶刊风格的 Results 段落
- [x] **No Verbatim Copy**: 输出中未出现可直接追溯到原文的连续 8+ 词短语
- [x] **Fact Boundary**: 所有不可迁移统计事实（系数、N、p 值）已被明确标记
- [x] **Causal Language Audit**: 骨架中因果语言强度与 Probit 估计器匹配（"increased/decreased probability"）
- [x] **Nonsignificant Audit**: H3a 不显著结果已记录，并提取了弹性处理句式
- [x] **Robustness Audit**: 稳健性按 threat 组织（endogeneity, selection, construct differences, unobserved heterogeneity）

**Overall Status**: PASS

