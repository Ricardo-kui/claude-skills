### 2.3 Validity Logic 提炼

| 可信性问题 | 处理模式 |
|-----------|---------|
| 统计结论效度 | 报告系数显著性 + AME 概率变化 + 图示置信区间（但未报告 CI 数值） |
| 内部效度 | Heckman 控制选择偏差；IV/2SLS（Bartik + lagged options）处理内生性；CEO FE 控制未观察异质性 |
| 构造效度 | 通过两种 IM  tactics（strategic timing vs. strategic silence）的差异分析验证构造区分性 |

