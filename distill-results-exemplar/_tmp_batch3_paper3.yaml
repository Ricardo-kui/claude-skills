## Phase 3 — Results DNA

| 指标 | 数值/模式 |
|------|----------|
| 段落平均句数 | ~6–8 句/段 |
| 每段先定位 table/model | 100%（段首均提及 Model/Table） |
| Hypothesis restatement 位置 | 段首或表格导航后（表格密集时有效） |
| 四拍完整性 | 主效应 4/4；交互 3–4/4；非显著 2/4（区域显著性替代） |
| Hedging 强度 | "suggests" (低), "indicates" (中), "supporting" (高) — 以 "supporting" 为主 |
| Causal language 强度 | 使用 "increased/decreased the probability"（Probit 允许），未越级至 "caused" |
| 稳健性 transition 句式 | "One concern is that..." / "To address this concern..." / "We also assessed whether..." |
| 非显著处理句式 | "Although... not statistically significant... [Figure] indicates... partially supported" |
| 交互效应引入方式 | "Model [Y] adds the interaction..." → 系数 → "[Figure X] illustrates..." |
| 经济显著性基准 | one-SD from the mean, probability percentage change |

