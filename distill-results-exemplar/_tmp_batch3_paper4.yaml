## Validity Logic Map

| 可信性问题 | 处理方式 |
|------------|----------|
| 统计结论效度 | 同时报告统计显著性和经济显著性（概率变化）；报告 95% 置信区间（通过标准误）；报告 R² 和 pseudo R² |
| 内部效度 | 稳健性按 threat 组织（Table 6 + Table 7），每个检验对应明确 threat；falsification test（随机分配 peer group）排除虚假效应；控制函数法和 2SLS 子群回归分别验证 |
| 构造效度 | 通过 partially overlapping peer groups 构造解决识别问题；industry entry 与 disclosure decision 不相关 (χ² test) 排除 reference group endogeneity |

## Novel Patterns（与现有 28 篇语料库对比后的新发现）

- **新骨架**: `r3_2sls_instrument_diagnostics_embedded` — 2SLS 结果段落中嵌入第一阶段 F-statistic 和 Hansen J-statistic，而非独立段落。现有语料库中 IV 论文多将第一阶段独立成段或放附录，本文嵌入主效应段落后仍保持清晰。
- **新节奏变体**: `r4_subgroup_wald_sequence` — 子群系数对比后直接接 Wald 检验，形成"系数排序→差异检验→机制结论"的三拍节奏，而非传统的简单斜率分解。
- **新稳健性组织方式**: `r7_threat_table_matrix` — Table 6 以"Alternative Explanation | Tests and Results"矩阵形式组织稳健性，而非传统的回归表格。这是 JMR/营销领域常见的叙事型稳健性表格，与纯回归型稳健性表格（Table 7）形成互补。
- **新句式**: `r7_heterogeneity_at_multiple_sd` — 在稳健性中计算 mean, +1SD, +1.5SD, +2SD 四个点的条件效应并分别报告显著性，用于证明异质性存在但主效应在大部分范围内仍显著。

## Non-Transferable Facts

- 具体系数: β = .483 (main herding effect, Column 3 Table 4); β = .193 (similar peers, Column 1 Table 8)
- 具体样本量: N = 48,509 (firm-year observations); 6,298 firms
- 具体表格编号: Table 4 (main), Table 5 (first-stage), Table 6 (alternative explanations), Table 7 (robustness), Table 8 (subgroup mechanisms), Table 9 (business scope vs. financial standing)
- 具体统计量: Hansen J = 4.54 (p > .10); F(4, 44,027) = 29.23 (p < .01)
- 特有理论术语: "partially overlapping peer groups", "second-degree peers", "information cascading", "FRR44"
- 特有测量: Jaccard similarity coefficient (business scope), Euclidean distance of sales-to-asset ratio / ROA / debt-to-asset ratio (financial standing)

## Skill Update Recommendations

1. **新增 IV/2SLS 专用骨架**: 在 `write-results` 的 IV/2SLS 模板中增加 `r3_2sls_instrument_diagnostics_embedded` 骨架，说明第一阶段统计量可以嵌入主效应段落而非独立成段（适用于 JMR/营销领域风格）。
2. **新增同伴效应/网络效应 R4 模板**: 现有语料库中同伴效应论文较少，建议新增 `r4_subgroup_wald_sequence` 骨架，用于"高影响/相似/低影响/不相似"子群分解。
3. **新增稳健性矩阵表格模板**: `r7_threat_table_matrix` 可作为叙事型稳健性报告的替代格式，适用于需要向非技术读者（如政策制定者）解释稳健性的场景。
4. **新增异质性条件效应计算句式**: `r7_heterogeneity_at_multiple_sd` 句式可纳入 R7 模板，用于处理"主效应在大部分范围内显著但存在衰减"的稳健性表述。
5. **反模式提醒**: 本文在 R9（Results→Discussion 过渡）缺失，建议在 `write-results` 模板中增加提醒：IV/2SLS 论文若 Results 后直接接 Discussion，需在 Discussion 首段回顾核心识别策略和主要发现，以弥补过渡缺失。

