## Rhythm Map

### R3 四拍节奏
**H1 (Main herding effect):**
1. 方向: Peer disclosure predicted to increase focal firm disclosure probability.
2. 显著性: Column 3 of Table 4 shows coefficient positive and statistically significant (β = [value], p < [threshold]).
3. 幅度: A [value]% increase in peer disclosure is associated with a [value]%–[value]% increase in disclosure probability.
4. 支持判断: Thus, the herding effect is supported.

**H2 (Uncertainty resolution mechanism — similar peers vs. benchmark leaders):**
1. 方向: Firms predicted to rely more on similar peers than benchmark leaders.
2. 显著ity: Column 1 of Table 8 shows similar-peer coefficient highest (β = [value], p < [threshold]), followed by low-influence (β = [value], p < [threshold]), high-influence (β = [value], p < [threshold]), dissimilar peers n.s.
3. 幅度: Wald test confirms difference between similar and low-influence peers (F = [value], p < [threshold]).
4. 支持判断: Firms resolve uncertainty from similar peers rather than benchmark leaders.

**变体:**
- 四拍完整，但幅度解释有时嵌入拍2（系数报告句中直接带概率变化）。
- 非线性模型（LPM）四拍调整：系数直接解释为概率变化，未使用边际效应语言。

### R7 稳健性节奏
**标准威胁-检验-结论四拍：**
1. 威胁定位: "One concern is that [threat]."
2. 检验动作: "To address this concern, we [method]."
3. 结果: "The herding effect remains robust ([coefficient], p < [threshold])."
4. 结论: "reducing concerns that [threat] drives the findings."

**具体威胁组织（Table 6 + Table 7）：**
- Analyst scrutiny / expectation
- Advertising spending amount & changes
- Endogenous industry entry
- Habitual reporting behavior (firm FE + first-time reporter)
- Market position confounds (leader × year FE)
- Alternative model specification (Probit IV)
- Un-Winsorized variables
- Dropping SG&A variables

