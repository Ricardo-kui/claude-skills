      observation: "非参数验证（Patell Z + generalized sign）嵌入在Logit结果和CAR分组比较之间，作为事件研究指标的行为 sanity check"
      note: "目前 corpus 中尚无此变体，建议审阅后入库。适用于事件研究论文中主检验为分组比较而非回归的场景。"
