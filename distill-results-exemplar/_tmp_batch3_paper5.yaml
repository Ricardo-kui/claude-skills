corpus_enrichment:
  batch_id: "batch_2026-05-22_paper5"
  estimator_family: "Logit_Probit_Ordered_Probit"
  source_paper: "Pfarrer_Pollock_Rindova_2010_AMJ"
  source_subfield: "strategy"

  slot_updates:
    # --- 骨架级（paragraph level）---
    - slot: "R1"
      action: "append_skeleton_or_increment"
      skeleton_id: "r1_descriptive_vif_relogit"
      skeleton_level: "paragraph"
      skeleton: "[Descriptive statistics + correlation matrix presented first, with explicit note that VIFs are below threshold and multicollinearity is not a concern]. Then, [estimation approach declared upfront: random-effects logistic regression for binary outcome panels, with rationale for between-firm focus and convergence advantages]. [Odds-ratio reporting convention stated explicitly to aid interpretation]."

    - slot: "R2"
      action: "append_skeleton_or_increment"
      skeleton_id: "r2_binary_outcome_hypothesis_pair_table"
      skeleton_level: "paragraph"
      skeleton: "[Hypotheses tested in matched pairs (H1a/H1b, H2a/H2b) across two separate tables for positive vs negative surprise dummies]. [Column 1 = controls only; Column 2 = full model with focal dummies]. [Each hypothesis evaluated by referencing odds ratio and significance, with explicit directional language: 'were less/more likely']. [Mixed support acknowledged in-line: one hypothesis in pair supported, the other not, without deferring to Discussion]."

    - slot: "R3"
      action: "append_skeleton_or_increment"
      skeleton_id: "r3_logit_four_beat"
      skeleton_level: "paragraph"
      skeleton: "Hypothesis [x] predicted... Model [y] shows that the coefficient for [predictor] is [positive/negative] and statistically significant (β = [value], p < [threshold]). Because logit coefficients are not directly interpretable, we calculate the average marginal effect (AME). The AME indicates that a [one-unit/one-SD] increase in [predictor] is associated with a [percentage_point] [increase/decrease] in the probability of [outcome]. Thus, Hypothesis [x] is supported."

    - slot: "R3"
      action: "create_new"
      skeleton_id: "r3_eventstudy_nonparametric_validation"
      skeleton_level: "paragraph"
      skeleton: "[Before presenting CAR comparisons, a brief nonparametric validation sentence confirms that the market indeed views positive surprises favorably and negative surprises as bad news (Patell Z and generalized sign tests)]. [This establishes that the event-study metric is behaving as expected before subgroup t-tests are interpreted]."

    - slot: "R4"
      action: "append_skeleton_or_increment"
      skeleton_id: "r4_subgroup_mean_comparison_ttest"
      skeleton_level: "paragraph"
      skeleton: "[Results organized by subgroup category (high reputation / celebrity / none) with mean CARs, pairwise differences, and significance from paired t-tests of unequal variances]. [Directional predictions tested by comparing each treatment group to baseline and to each other]. [Support language is precise: 'significantly larger than,' 'significantly different from,' 'not significantly different from']. [Mixed support again handled in-line: H4c not supported because the two treatment groups do not differ significantly from each other]."

    - slot: "R5"
      action: "create_new"
      skeleton_id: "r5_robustness_gee_heckman_endogeneity"
      skeleton_level: "paragraph"
      skeleton: "[Robustness section opens by stating the limitation of the primary test (lack of controls for CAR size) and introduces GEE regression as a supplemental check]. [Explicit caveat that the regression does not directly test the relative hypotheses but examines direct relationships with magnitude]. [Endogeneity addressed via Heckman correction, with first-stage significance reported and selection instrument insignificance interpreted as evidence that endogeneity is not a significant problem]. [All robustness results summarized narratively rather than in full tables, with key coefficients and significance levels noted]."

    # --- 句式级（sentence level）---
    - slot: "R3"
      action: "create_new"
      skeleton_id: "r3_sentence_logit_odds_likelihood"
      skeleton_level: "sentence"
      skeleton: "[Table X] shows that [IV] had an odds ratio of [value] (p [threshold]), which means [IV] firms were [less/more] likely to [DV] than [reference group]."

    - slot: "R3"
