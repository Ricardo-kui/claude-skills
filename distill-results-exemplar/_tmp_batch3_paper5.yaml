      skeleton_id: "r3_sentence_nonsignificant_inline"
      skeleton_level: "sentence"
      skeleton: "However, [Table X] shows that [IV] did not have a significant effect on the likelihood of [DV]. Thus, Hypothesis [x] was not supported."

    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_sentence_subgroup_comparison_significance"
      skeleton_level: "sentence"
      skeleton: "The [outcome]s for the [condition A] ([value] [unit]) and [condition B] ([value] [unit]) categories were significantly [larger/smaller] than the [outcome] for the [reference] category ([value] [unit]), and the [outcome] for [condition B] was significantly [larger/smaller] than the [outcome] for [condition A] (p [threshold])."

    - slot: "R4"
      action: "create_new"
      skeleton_id: "r4_sentence_mixed_support_inline"
      skeleton_level: "sentence"
      skeleton: "The nonparametric tests indicated that the [outcome]s for [condition A] and [condition B] were not significantly different from their predicted values, but the [outcome]s for the [reference] category were significantly different. The t-tests showed that the mean [outcome]s for [condition A] and [condition B] were significantly different from the [reference] category's mean [outcome] and that the [outcome]s for [condition A] and [condition B] were not significantly different from one another. Thus, Hypotheses [x] and [y] were supported, and Hypothesis [z] was not."

    - slot: "R7"
      action: "create_new"
      skeleton_id: "r7_sentence_heckman_two_stage"
      skeleton_level: "sentence"
      skeleton: "Using [author_year]'s criteria to select the appropriate estimation approach, we employed a Heckman correction model. We included predictor variables in the first-stage models that were significantly associated with [DV], but not with [outcome]. The first-stage models were highly significant in predicting [DV], but the selection correction instrument was not significant when entered into the second-stage models. Thus, endogeneity did not appear to be a significant problem in our study."

    - slot: "R7"
