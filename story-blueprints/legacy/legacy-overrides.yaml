# Optional human-verified enrichment for the generated legacy manifest.
# Do not edit legacy blueprints. A candidate must name the v0.4 seed and the
# concrete comparison question that justified re-reading it.
cards:
  bendig2024:
    migration_status: migrated
    seed_relations:
      - seed_id: zhou2017
        relation_hypothesis: >-
          Both papers may derive a nonlinear relation from mechanisms whose
          relative dominance changes, but Zhou concerns competing facets of one
          innovation process while Bendig may concern an adverse recall outcome
          where external-venturing costs precede accumulated learning benefits.
        comparison_question: >-
          Does full-text re-reading establish a genuine cost-before-learning-
          benefit schedule for CVC and alliances, distinguish their unilateral
          versus bilateral governance logic, and test curve shape inside the
          observed range? Which theoretical mechanisms are story explanations
          rather than empirically observed intermediate processes?
        status: confirmed
  wowak2015:
    migration_status: migrated
    seed_relations:
      - seed_id: wowak2025
        relation_hypothesis: >-
          Both papers use serious product recalls to represent product-safety
          outcomes, but Wowak 2015 may concern an upstream safety-production
          incidence process shaped by CEO option incentives whereas Wowak 2025
          separates pre-market recall incidence from post-awareness response time.
        comparison_question: >-
          Does full-text re-reading keep recall occurrence and count as two
          operationalizations of one upstream incidence construct, distinguish it
          from later recall timing, and identify which proposed option-to-quality
          transmission links are observed rather than inferred? How do tenure and
          founder status qualify an incentive association without demonstrating the
          underlying cognitive route?
        status: confirmed
  pupovac2025:
    migration_status: migrated
    seed_relations:
      - seed_id: darby2025
        relation_hypothesis: >-
          Both papers study firms indirectly exposed to an event at another
          organization. Pupovac may examine a realized buyer recall that changes
          supplier value through customer-portfolio information, whereas Darby
          examines an anticipated activist threat that may change a non-target
          firm's recall timing.
        comparison_question: >-
          Does full-text re-reading distinguish realized vertical exposure from a
          prospective monitoring threat, and does it observe supply-chain demand,
          stakeholder screening, or only their valuation-consistent traces? How
          does general disclosure differ from disclosed dependence as an exposure cue?
        status: confirmed
  liu2016:
    migration_status: migrated
    seed_relations:
      - seed_id: darby2024
        relation_hypothesis: >-
          Both papers treat a recall as a post-awareness decision shaped by
          executive incentives. Liu may concern remedy completeness and a cost–harm
          weighting problem, whereas Darby concerns initiation delay and a later
          self-defeating market consequence.
        comparison_question: >-
          Does full-text re-reading keep remedy choice distinct from timing and
          demonstrate that CEO incentives reweight the two decision criteria rather
          than simply predict a response? Compared with Darby, is the market outcome
          a consequence of a prior decision or an audience interpretation of visible
          remedy?
        status: confirmed
  chen2009:
    migration_status: migrated
    seed_relations:
      - seed_id: darby2024
        relation_hypothesis: >-
          Both papers use a market consequence to change the meaning of recall
          behavior. Chen may treat proactive response as an externally decoded
          signal of hidden severity, whereas Darby traces a prior delay to a later
          penalty that makes the decision itself self-defeating.
        comparison_question: >-
          Does full-text re-reading distinguish a market reaction to a response
          signal from a market reaction caused by a documented decision-consequence
          chain? Which audience beliefs or severity indicators are observed, and
          which remain explanatory inference?
        status: confirmed
  lun2026:
    migration_status: migrated
    seed_relations:
      - seed_id: wowak2025
        relation_hypothesis: >-
          Both papers connect a top-management condition to recall-related safety
