          recall incidence and COO power an attentional governance boundary.
        comparison_question: >-
          Does full-text re-reading separate product recall incidence from product
          quality itself, and does it provide process evidence for EO-induced
          quality-control strain and COO attention rather than only proxy-consistent
          associations? Compared with Wowak, are outcome dimensions distinct stages
          or a single upstream failure process with nested governance conditions?
        status: confirmed
  hoffmann2024:
    migration_status: migrated
    seed_relations:
      - seed_id: darby2026
        relation_hypothesis: >-
          Both papers examine how shareholder-side governance can influence product
          recall decisions. Hoffmann may treat institutional ownership as a
          substitute monitor when shareholder litigation discipline is relaxed,
          whereas Darby examines large institutional ownership as a direct influence
