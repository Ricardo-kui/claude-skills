# Template health check thresholds
# Only CAUTION is actionable — HEALTHY and INSUFFICIENT_DATA are handled silently.
# DEGRADED with auto-replacement was removed (v3.3.0): the cold-start problem (validation data
# accumulates slowly) and signal ambiguity (reject_rate conflates template quality with user skill)
# made the cascade unworkable in practice.
health_check:
  insufficient_data:
    condition: "total_runs < 2"
    action: "静默跳过，不做任何健康相关操作"
  healthy:
    condition: "total_runs >= 2 AND reject_rate < 0.50"
    action: "静默跳过，不显示健康信息（模板表现正常，无需提醒）"
  caution:
    condition: "total_runs >= 2 AND reject_rate >= 0.50"
    action: "在提醒中输出 ⚠️ 警告，列出 common_revise_reasons。建议用户在使用后运行 --validate 检查"
  reject_rate_formula: "reject / total_runs"
  design_note: "reject_rate 仅作参考——高 reject 可能反映模板被新手频繁使用而非模板本身有问题。警告的语言应强调'建议验证'而非'模板有问题'。"

# Evidence confidence labels (from registry status)
evidence_confidence:
  ROBUST: "≥5 papers, ≥2 journals — 此模板经 5+ 篇顶刊论文验证"
  VERIFIED: "≥3 papers — 此模板经 3+ 篇论文验证"
  EMERGING: "1-2 papers — 此模板来自单篇范文，建议谨慎使用"

# Transitions — sentence-level glue between modules.
# Read during rendering phase as supplementary templates.
# "Universal" means potentially useful across all Gap types, but still read selectively:
# only load a transition file when the corresponding paragraph pair is actually being
# written. (E.g., skip 11-roadmap for compact 5¶ Introductions; skip gap-to-contribution
# when Contribution is compressed into Theory Lens.)
# Situational transitions are triggered by contribution dimension or research context.
transitions:
  universal:
    - canonical_id: "01-hook-to-literature"
      position: "P1(Hook) → P2(Literature Turn)"
      trigger: "当 Introduction 有独立的 Literature Turn 段时读取"
    - canonical_id: "10-literature-to-gap"
      position: "P2(Literature Turn) → P3(Gap)"
      trigger: "当 Literature Turn 和 Gap 为独立段落时读取"
    - canonical_id: "gap-to-contribution"
      position: "P6(Preview) → P7-P8(Contribution)"
      trigger: "当 Contribution 为独立段时读取（期刊为 ASQ/AMJ/ASR 时；JOM/MS/POM 可跳过）"
    - canonical_id: "11-roadmap"
      position: "Introduction 结尾"
      trigger: "当期刊偏好 roadmap 段落时读取（AMJ/ASQ 常见；JM/JMR 通常省略）"
  situational:
    - canonical_id: "02-actor-funnel"
      triggers: "研究聚焦特定 actor 群体（如 CEO、board、activist investors）"
    - canonical_id: "13-multi-actor-upper-echelons-funnel"
      triggers: "upper echelons 多层级互动研究（CEO → CMO/TMT → Board）"
    - canonical_id: "14-nested-moderation-preview"
      triggers: "研究包含三向交互或序列嵌套调节，需在 Introduction 末尾预览结构"
    - canonical_id: "03-unified-moderator-framework"
      triggers: "Boundary 贡献——引入统一调节变量框架"
    - canonical_id: "04-field-migration"
      triggers: "跨学科研究——将领域A的概念/方法移植到领域B"
    - canonical_id: "05-extend-key-study"
      triggers: "研究直接延伸/挑战一篇关键文献的发现"
    - canonical_id: "06-data-barrier-justification"
      triggers: "Incompleteness Gap——缺口因数据获取困难而长期存在"
    - canonical_id: "07-construct-migration"
      triggers: "Constructs 贡献——从其他领域引入/重定义构念"
    - canonical_id: "08-case-to-field-generalization"
      triggers: "Phenomenon 贡献——从极端案例推广到一般领域"
    - canonical_id: "09-micro-macro-complement"
      triggers: "Level 贡献——微观视角补充宏观理论"
    - canonical_id: "12-setting-justification"
      triggers: "实证情境需要特别论证（如选择特定行业/国家/时期的理由）"

# §13 — Phrasebank routing (auxiliary 措辞层，Phase 4 润色调用)
# NOTE: phrasebank 是 Morley 收割的 auxiliary 层，非 MVP30 顶刊蒸馏，不计入 paper_count。
# 退役规则：某功能一旦被顶刊蒸馏覆盖，对应条目删除。
phrasebank:
  layer: auxiliary
  index: "phrasebank/_index.md"
  discipline: "骨架优先；phrasebank 只提供措辞变体不替代结构；每句位 ≤2-3 候选；specificity gate 强制具体化"
  files:
    hedging-strength:
      function: "hedging 5 档强度阶梯（may→might→could→likely→almost certain）+ Discussion 解释非显著场景"
      triggers: "校准 gap 声明/stakes/假设推导/非显著解释的认识论强度——避免越级或过度弱化"
      slots: ["Tension", "Stakes", "Preview（假设推导）", "Discussion（非显著/意外）"]
    critique-phrases:
      function: "单研究/单理论方法学批判 + 建设性批判"
      triggers: "Literature Turn 的 problematize 句；Theory 处理竞争机制；Discussion 评估他人识别策略"
      slots: ["Literature Turn", "Theory（竞争机制）", "Differentiation"]
    methods-process:
      function: "过程描述变化（sequence words / using+instrument / 统计程序动词）"
      triggers: "Methods M2-M7 过程描述防同质化"
      slots: ["M2", "M3", "M4", "M7"]
    quantities-trends:
      function: "数值与趋势描述（描述统计转述 / 事件研究趋势）"
      triggers: "Results R1 描述统计 / R5 经济显著性 / R7 趋势描述"
      slots: ["R1", "R5", "R7"]
