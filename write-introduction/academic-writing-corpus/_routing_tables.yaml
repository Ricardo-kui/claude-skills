# Template health check thresholds
# Only CAUTION is actionable — HEALTHY and INSUFFICIENT_DATA are handled silently.
# DEGRADED with auto-replacement was removed (v3.3.0): the cold-start problem (validation data
# accumulates slowly) and signal ambiguity (reject_rate conflates template quality with user skill)
# made the cascade unworkable in practice.
health_check:
  insufficient_data:
    condition: "total_runs < 2"
    action: "静默跳过，不做任何健康相关操作"
  healthy:
    condition: "total_runs >= 2 AND reject_rate < 0.50"
    action: "静默跳过，不显示健康信息（模板表现正常，无需提醒）"
  caution:
    condition: "total_runs >= 2 AND reject_rate >= 0.50"
    action: "在提醒中输出 ⚠️ 警告，列出 common_revise_reasons。建议用户在使用后运行 --validate 检查"
  reject_rate_formula: "reject / total_runs"
  design_note: "reject_rate 仅作参考——高 reject 可能反映模板被新手频繁使用而非模板本身有问题。警告的语言应强调'建议验证'而非'模板有问题'。"

# Evidence confidence labels (from registry status)
evidence_confidence:
  ROBUST: "≥5 papers, ≥2 journals — 此模板经 5+ 篇顶刊论文验证"
  VERIFIED: "≥3 papers — 此模板经 3+ 篇论文验证"
  EMERGING: "1-2 papers — 此模板来自单篇范文，建议谨慎使用"

# Transitions — sentence-level glue between modules.
# Read during rendering phase as supplementary templates.
# "Universal" means potentially useful across all Gap types, but still read selectively:
# only load a transition file when the corresponding paragraph pair is actually being
# written. (E.g., skip 11-roadmap for compact 5¶ Introductions; skip gap-to-contribution
# when Contribution is compressed into Theory Lens.)
# Situational transitions are triggered by contribution dimension or research context.
transitions:
  universal:
    - canonical_id: "01-hook-to-literature"
      position: "P1(Hook) → P2(Literature Turn)"
      trigger: "当 Introduction 有独立的 Literature Turn 段时读取"
    - canonical_id: "10-literature-to-gap"
      position: "P2(Literature Turn) → P3(Gap)"
