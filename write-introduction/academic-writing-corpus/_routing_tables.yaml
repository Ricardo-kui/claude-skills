# _routing_tables.yaml
# Extracted from SKILL.md §1-§10 (v3.2.0).
# Consumed by write-introduction during the "选择阶段" of the two-step read protocol.
# This file replaces the inlined decision tables in SKILL.md — it is read on-demand,
# not loaded into the skill's base context window.

# §1 — Gap types
gap_types:
  Incompleteness:
    energy: low
    core_logic: "已有进展，但遗漏了某个维度/机制/时点"
    attitude: "你们做得好，但漏了一块"
    conversation_strategy: "Progressive Coherence"
    paragraph_structure: "紧凑型: Hook+Lit → Gap+Stakes → Theory → Preview+Findings → Contribution"
    paragraph_count: 5
    exemplar: "eilert2017 (JM)"
  Inadequacy:
    energy: medium
    core_logic: "现有视角抓住了现象，但误置了构念/层次/边界"
    attitude: "你们看到了现象，但理解偏了"
    conversation_strategy: "Synthesized Coherence"
    paragraph_structure: "标准型: Hook → Lit → Gap → Stakes/Theory → Preview → Contribution"
    paragraph_count: "6-7"
    exemplar: "gamache2020 (SMJ)"
  Incommensurability:
    energy: high
    core_logic: "不同理论/证据推出不兼容解释，需要新框架"
    attitude: "你们说得都对，但互相矛盾"
    conversation_strategy: "Non-Coherence"
    paragraph_structure: "扩展型: Hook → Lit → Gap → Stakes → Theory → Preview → Findings → Contribution"
    paragraph_count: "8-9"
    exemplar: "zhou2017 (ASQ)"

# §2 — Hook selector (Pollock 2025 taxonomy)
# NOTE: canonical_id "10" is shared by two hooks (immersive-narrative + practical-puzzle).
# This is a legacy numbering artifact — the YAML keys are the full canonical_id strings
# ("10-immersive-narrative" vs "10-practical-puzzle"), so routing is unambiguous.
# If renumbering in the future, rename the corpus files and update all references here.
hooks:
  by_gap_strength:
    low:
      - canonical_id: "03-data-shock"
        pollock_type: "Trend"
        syntactic_signature: "具体数字 → scale → 'yet little is known'"
        exemplar: "eilert2017 (JM)"
      - canonical_id: "08-consequence-cascade"
        pollock_type: "Trend"
        syntactic_signature: "负面事件递进式后果清单"
        exemplar: "mayo2021 (POM)"
      - canonical_id: "10-practical-puzzle"
        pollock_type: "Anecdote"
        syntactic_signature: "从业者面临的具体困境"
        exemplar: null
      - canonical_id: "09-psychological-construct-hook"
        pollock_type: "Anecdote"
        syntactic_signature: "压力共识→案例落地→因果链→学术空白"
        exemplar: "mannor2016 (SMJ)"
      - canonical_id: "13-rhetorical-question"
        pollock_type: "Rhetorical question"
        syntactic_signature: "日常选择三联→读者自我确认→概念转译"
      - canonical_id: "16-evolving-social-issue"
        pollock_type: "Trend"
        syntactic_signature: "社会议题广泛关注→收窄到具体DV→负面后果→文献定位为外部/结构解释"
        exemplar: "weng_yang (JMS)"
    medium:
      - canonical_id: "05-literature-consensus-blindspot"
        pollock_type: "Trend"
        syntactic_signature: "\"While important... considers... broadly\""
        exemplar: "gamache2020 (SMJ)"
      - canonical_id: "24-positive-trait-dark-side"
        pollock_type: "Trend / Anecdote"
        syntactic_signature: "正向特质 → 边界条件下的阴暗面后果"
        exemplar: "chung_low_rust_2022_jams (JAMS)"
      - canonical_id: "01-cross-disciplinary-analogy"
        pollock_type: "Trend"
        syntactic_signature: "领域A的概念 → 领域B的类似问题"
        exemplar: "pollock2015 (ASQ)"
      - canonical_id: "12-contrary-to-belief"
        pollock_type: "Trend"
        syntactic_signature: "\"Contrary to popular belief...\""
        exemplar: "eilert2017 (JM)"
      - canonical_id: "04-puzzle-paradox"
        pollock_type: "Anecdote"
        syntactic_signature: "反直觉现象 → 制造悬念"
        exemplar: "paruchuri2020 (SMJ)"
      - canonical_id: "07-cost-benefit-tension"
        pollock_type: "Anecdote"
        syntactic_signature: "决策两难：行动成本 vs 延迟成本"
        exemplar: "eilert2017 (JM)"
      - canonical_id: "11-institutional-anecdote"
        pollock_type: "Anecdote"
        syntactic_signature: "客观制度叙事→\"unremarkable\"理论常态化"
        exemplar: "lehman2014 (MS)"
      - canonical_id: "10-immersive-narrative"
        pollock_type: "Anecdote"
        syntactic_signature: "五幕结构叙事（时间精确、人物有名）"
        exemplar: "desai2012 (AMJ)"
      - canonical_id: "21-dual-industry-trend"
        pollock_type: "Trend"
        syntactic_signature: "宏观变革(数字化) → 双行业平行分化案例 → 收束到研究框架"
        exemplar: "zhao_ding2022 (OS)"
      - canonical_id: "23-popular-debate"
        pollock_type: "Anecdote"
        syntactic_signature: "TED talk vs 畅销书对立观点 → 'This debate illustrates...' pivot → 学术 gap"
        exemplar: "falchetti2022 (SMJ)"
    high:
      - canonical_id: "06-paradigm-challenge"
        pollock_type: "Trend"
        syntactic_signature: "\"According to conventional view... In reality, however...\""
        exemplar: "zhou2017, hahl2017, gamache2023"
      - canonical_id: "02-epigraph-quote-pivot"
        pollock_type: "Quote"
        syntactic_signature: "权威引语/新闻个案/内部文件"
        exemplar: "darby2026 (JOM)"
      - canonical_id: "14-paired-disasters"
        pollock_type: "Anecdote"
        syntactic_signature: "两个时间跨度大的相似灾难，建立\"历史重演\"谜题"
        exemplar: "haunschild2015 (OS)"

  # Contribution-dimension micro-adjustments
  contribution_micro:
    Constructs:
      preferred: ["04-puzzle-paradox"]
      note: "让读者\"意识到混淆\""
    Mechanism:
      preferred: ["05-literature-consensus-blindspot"]
      note: "展示\"现有解释不足\""
    Boundary:
      preferred: ["04-puzzle-paradox", "23-popular-debate"]
      note: "呈现\"何时有效/失效\"; popular debate 自然导向 contingency resolution"
    Phenomenon:
      preferred: ["03-data-shock", "14-paired-disasters"]
      note: "用数据建立新现象域，或用极端案例叙事建立现象存在性"

# §3 — Conversation strategies
conversation_strategies:
  Incompleteness:
    strategy: "Progressive Coherence"
    core_logic: "承认已有进展，逐步聚焦到缺口"
  Inadequacy:
    strategy: "Synthesized Coherence"
    core_logic: "连接多个文献流，展示共同盲区"
  Incommensurability:
    strategy: "Non-Coherence"
    core_logic: "呈现两个理论的不兼容预测"

# §4 — Tension selector
tensions:
  Incompleteness:
    - canonical_id: "01-despite-progress-unaddressed"
      core_syntax: "\"Although research has... little attention has been paid to...\""
      registry_status: "ROBUST (23p)"
      exclusivity: "仅 Incompleteness — Inadequacy/Incommensurability 中为 0"
    - canonical_id: "12-forward-vs-backward-looking"
      core_syntax: "\"Research has examined post-hoc consequences, yet what predicts timing...\""
      registry_status: "EMERGING (1p)"
      exclusivity: "Incompleteness 专用"
    - canonical_id: "08-cost-vs-benefit"
      core_syntax: "\"Firms face a dilemma: [action] is costly, yet delaying is costlier...\""
      registry_status: "EMERGING (1p)"
      exclusivity: "Incompleteness 专用"
    - canonical_id: "13-sequential-phenomenon-gap"
      core_syntax: "\"We have good theory about A and good theory about B, but know little about A→B→A sequential cycling...\""
      registry_status: "EMERGING (1p)"
      exclusivity: "Incompleteness 专用。Phenomenon 贡献首选——为循环现象奠基"
  Inadequacy:
    - canonical_id: "02-implicit-assumption-wrong"
      core_syntax: "\"The implicit assumption that... may be incorrect because...\""
      registry_status: "ROBUST (14p)"
      exclusivity: "仅 Inadequacy — Incompleteness/Incommensurability 中为 0"
    - canonical_id: "03-structural-blindspot"
      core_syntax: "\"This focus on [X] has systematically overlooked [Y]...\""
      registry_status: "ROBUST (8p)"
      exclusivity: "仅 Inadequacy"
    - canonical_id: "05-construct-confusion"
      core_syntax: "\"Different labels have been used for the same phenomenon...\""
      registry_status: "ROBUST (6p)"
      exclusivity: "仅 Inadequacy — Incommensurability 中为 0。Constructs 贡献首选，但不能用于 Incommensurability"
    - canonical_id: "11-overlooked-alternative"
      core_syntax: "\"The dominant approach has focused on [X], overlooking [Y]...\""
      registry_status: "EMERGING (1p)"
      exclusivity: "Inadequacy 专用"
    - canonical_id: "20-opposite-predictions-positive-trait"
      core_syntax: "\"The most closely related literature comprises studies showing that [positive trait] leads to [A] and [B], leading to opposite predictions for [target DV].\""
      registry_status: "EMERGING (1p)"
      exclusivity: "Inadequacy 专用。当同一正向特质的两个文献流对目标 DV 做出相反预测时使用"
    - canonical_id: "09-resource-acquisition-vs-utilization"
      core_syntax: "\"Although [strategy] benefits acquisition, it constrains utilization...\""
      registry_status: "EMERGING (1p)"
      exclusivity: "Inadequacy 专用。概念上完美匹配\"资源获取 vs 资源利用\"场景，证据待积累"
  Incommensurability:
    - canonical_id: "04-reality-contradicts-consensus"
      core_syntax: "\"Whereas prior studies show X, empirical evidence is mixed... To resolve, we theorize...\""
      registry_status: "ROBUST (7p)"
      exclusivity: "仅 Incommensurability — Incompleteness/Inadequacy 中接近 0"
    - canonical_id: "06-theoretical-imbalance"
      core_syntax: "\"Two theoretical perspectives offer incompatible predictions...\""
      registry_status: "ROBUST (5p)"
      exclusivity: "Incommensurability 为主 (40%)，Inadequacy 次之 (60%)"
    - canonical_id: "07-same-policy-opposite-effects"
      core_syntax: "\"The same practice increases [outcome] for Group A but decreases it for Group B...\""
      registry_status: "EMERGING (2p)"
      exclusivity: "Incommensurability 专用"
    - canonical_id: "10-constraint-vs-freedom"
      core_syntax: "\"Technology expands freedom, yet market structure imposes constraints...\""
      registry_status: "EMERGING (0p — 模板占位，待范文入库)"
      exclusivity: "Incommensurability 专用"

# Incommensurability resolution strategies
# Incommensurability Introductions need to HINT at the resolution, not just identify the paradox.
# These three strategies map to preferred Introduction architectures and Theory Lens patterns.
incommensurability_resolution:
  facet_decomposition:
    description: "Two competing logics are reframed as different facets of the same phenomenon"
    intro_structure: "Hook (paradox) → Lit (two theories) → Gap (mixed evidence) → Theory Lens (facet naming) → Preview → Contribution"
    theory_lens_pattern: "We theorize that [logic A] and [logic B] pertain to different facets of [phenomenon]: [facet A] and [facet B], so they are intertwined in explaining [outcome]."
    exemplar: "zhou2017 (ASQ): institutional logic → resource allocation, efficiency logic → resource utilization"
    requires: "Clear conceptual distinction between facets; each facet must map to one side of the paradox"
    variant_in_corpus: "04-reality-contradicts-consensus 变体 A"
  audience_heterogeneity:
    description: "The paradox resolves when you consider that different audiences evaluate differently"
    intro_structure: "Hook (consensus→anomaly) → Lit (market-takers known, market-makers unknown) → Gap → Theory Lens (audience typology) → Preview → Contribution"
    theory_lens_pattern: "There are at least two roles for audiences: [audience A], who [evaluation logic A], and [audience B], who [evaluation logic B]. Previous literature has only investigated [audience A]."
    exemplar: "pontikes2012 (ASQ): market-takers (consumers) devalue ambiguity, market-makers (VCs) prefer it"
    requires: "Two audiences with genuinely different evaluation criteria; empirical access to both audiences"
    variant_in_corpus: "04-reality-contradicts-consensus 变体 E"
  contingency_revelation:
    description: "The paradox exists because prior work ignored a key boundary condition"
    intro_structure: "Hook (paradox) → Lit → Gap (contradictory findings) → Stakes → Theory Lens (moderator) → Preview → Contribution"
    theory_lens_pattern: "We propose that [relationship] depends on [moderator], which determines whether [mechanism A] or [mechanism B] dominates."
    exemplar: "gamache2023 (SMJ): female CEO risk aversion → depends on board composition and acquisition context"
    requires: "Genuine moderator with theoretical basis; empirical variation in moderator"
    variant_in_corpus: "04-reality-contradicts-consensus 变体 B"

  # Auto-match resolution strategy from Gap×Contribution combo
  combo_to_resolution:
    "Incommensurability × Constructs":
      strategy: "audience_heterogeneity"
      rationale: "Constructs 贡献的 Incommensurability 通常通过区分不同受众/评估者的视角来实现——新构念不是组织的属性而是受众的角色"
      exemplar: "pontikes2012 (ASQ): market-taker vs market-maker"
    "Incommensurability × Mechanism":
      strategy: "facet_decomposition"
      rationale: "Mechanism 贡献的 Incommensurability 通常通过将对立逻辑重构为同一现象的不同面向（facet）来实现"
      exemplar: "zhou2017 (ASQ): institutional logic→resource allocation, efficiency logic→resource utilization"
    "Incommensurability × Boundary":
      strategy: "contingency_revelation"
      rationale: "Boundary 贡献的 Incommensurability 通常通过识别被忽略的边界条件——矛盾在什么条件下向哪方倾斜"
      exemplar: "gamache2023 (SMJ): female CEO risk aversion depends on board composition"

# Tension wording intensity
tension_wording_intensity:
  mild: "has received relatively little attention"
  medium: "remains poorly understood"
  strong: "is theoretically underspecified / rests on an untested assumption"
  surprising: "surprisingly understudied given its importance"

# §5 — Stakes selector
stakes:
  selection:
    - feature: "含市场/财务结果"
      stakes: "02-quantified-economic-loss"
    - feature: "含股价/资本市场"
      stakes: "05-firm-value-stock-market"
    - feature: "含声誉/丑闻/合法性"
      stakes: "07-reputation-legitimacy-crisis"
    - feature: "含产品安全/公共卫生/消费者伤害"
      stakes: "04-public-health-safety"
    - feature: "核心贡献为跨学科/外部因素引入"
      stakes: "03-disciplinary-gap-stakes"
    - feature: "含短视管理/长期投资削减/短期主义"
      stakes: "09-myopic-management-long-term-loss"
    - feature: "其他"
      stakes: "01-general-theory-practice"
      note: "理论重要性 + 实践后果"
  insertion:
    compact: "在 Gap 段末尾（1-2句）"
    standard: "独立 P4（2-3句）"
    extended: "独立 P4 + 数据支撑"

# §6 — Paragraph structures
paragraph_structures:
  Incompleteness:
    structure: "紧凑型: Hook+Lit → Gap+Stakes → Theory → Preview+Findings → Contribution"
    paragraphs: 5
    exemplar: "eilert2017 (JM)"
  Inadequacy:
    structure: "标准型: Hook → Lit → Gap → Stakes/Theory → Preview → Contribution"
    paragraphs: "6-7"
    exemplar: "gamache2020 (SMJ)"
  Incommensurability:
    structure: "扩展型: Hook → Lit → Gap → Stakes → Theory → Preview → Findings → Contribution"
    paragraphs: "8-9"
    exemplar: "zhou2017 (ASQ)"

# §7 — Module pairing constraints
pairing_constraints:
  mandatory:
    - hook: "06-paradigm-challenge"
      tension: "04-reality-contradicts-consensus"
      applies_to: "Incommensurability"
    - hook: "04-puzzle-paradox"
      tension: "02-implicit-assumption-wrong"
      applies_to: "Inadequacy"
    - hook: "04-puzzle-paradox"
      tension: "04-reality-contradicts-consensus"
      applies_to: "Incommensurability"
      note: "Constructs 贡献时，puzzle → 对立理论整合"
    - hook: "05-literature-consensus-blindspot"
      tension: "02-implicit-assumption-wrong 或 03-structural-blindspot"
      applies_to: "Inadequacy"
    - hook: "03-data-shock"
      tension: "01-despite-progress-unaddressed"
      applies_to: "Incompleteness"
    - hook: "12-contrary-to-belief"
      tension: "02-implicit-assumption-wrong"
      applies_to: "Inadequacy"
    - hook: "07-cost-benefit-tension"
      tension: "08-cost-vs-benefit（首选）或 01-despite-progress-unaddressed"
      applies_to: "Incompleteness / Inadequacy"
    - hook: "01-cross-disciplinary-analogy"
      tension: "11-overlooked-alternative"
      applies_to: "Inadequacy"
      note: "当引入被忽视视角时"
    - hook: "05-literature-consensus-blindspot"
      tension: "09-resource-acquisition-vs-utilization"
      applies_to: "Inadequacy"
    - hook: "25-empirical-puzzle-after-consensus"
      tension: "01-despite-progress-unaddressed（首选）或 16-threefold-gap"
      applies_to: "Incompleteness"
      note: "共识后的经验悖论需递进式缺口解释文献遗漏原因；缺口可从多独立维度展开时用 16-threefold-gap"
    - hook: "14-paired-disasters"
      tension: "13-sequential-phenomenon-gap"
      applies_to: "Incompleteness"
      note: "双灾难叙事建立的\"修正-复发\"谜题需要 sequential cycling 缺口来解释"
    - hook: "21-dual-industry-trend"
      tension: "02-implicit-assumption-wrong"
      applies_to: "Inadequacy"
      note: "双行业案例建立的定位异质性现象，需挑战\"低壁垒机械地转化为多样性\"的隐含前提（变体 D）才能转化为学术问题"
    - hook: "23-popular-debate"
      tension: "01-despite-progress-unaddressed"
      applies_to: "Incompleteness / Inadequacy"
    - hook: "24-positive-trait-dark-side"
      tension: "20-opposite-predictions-positive-trait（首选）或 02-implicit-assumption-wrong"
      applies_to: "Inadequacy"
      note: "正向特质阴暗面需要解释文献为何忽略其负面边界；若两流文献直接矛盾，用 20；若只是挑战'正向特质总是好'的隐性假设，用 02"
    - hook: "16-evolving-social-issue"
      tension: "02-implicit-assumption-wrong 或 11-overlooked-alternative"
      applies_to: "Inadequacy"
      note: "流行争论揭示的不是谁对谁错，而是双方都忽略的 contingency factor——最适合 Boundary 或 Constructs 贡献"

  puzzle_paradox_note: "04-puzzle-paradox 有两个配对规则。Inadequacy 场景（\"你们把构念搞混了\"）→ 配 02-implicit-assumption-wrong；Incommensurability 场景（\"两个理论都对但互相矛盾，需要新构念整合\"）→ 配 04-reality-contradicts-consensus。判断依据：用户的 Gap 描述是\"文献理解偏了\"还是\"文献互相矛盾\"。"

  conflicts:
    - pair: "03-data-shock + 02-quantified-economic-loss"
      reason: "功能冗余，数字疲劳"
    - pair: "03-data-shock + 08-consequence-cascade"
      reason: "两者都依赖数字，造成数字疲劳"
    - pair: "06-paradigm-challenge + 01-despite-progress-unaddressed"
      reason: "能量不匹配（高+低）"
    - pair: "02-epigraph-quote-pivot + 13-rhetorical-question"
      reason: "外部声音 vs 读者声音，叙事机制冲突"
    - pair: "Incommensurability + 01-despite-progress-unaddressed"
      reason: "逻辑矛盾（颠覆 ≠ 渐进）"
    - pair: "02-quantified-economic-loss + 09-myopic-management-long-term-loss"
      reason: "两者都量化经济损失/价值侵蚀，重复使用造成 stakes 冗余"

# §8 — Makadok contribution dimension statements
makadok_statements:
  Constructs: "We clarify [construct] by distinguishing [A] from [B], resolving confusion in the literature."
  Mechanism: "We explain why [X] affects [Y] by identifying [mechanism] that translates [cause] into [outcome]."
  Boundary: "We show that [relationship] depends on [moderator], reconciling conflicting findings."
  Phenomenon: "We document a novel phenomenon: [phenomenon], and demonstrate its importance for [outcome]."
  Level: "We bridge [level A] and [level B] by showing how [micro] aggregates to [macro]."
  Mode: "We reveal how [process] unfolds over time, showing that [pattern] rather than [alternative]."
  Question: "We ask a new question: [question]? And answer it by [approach]."
  Output: "We provide a [tool/typology/framework] that enables [actors] to [action]."

# §9 — Journal style quick reference
journal_styles:
  ASQ:
    hook_preference: "Quote (经典理论引语) / Trend (理论颠覆)"
    contribution_style: "理论整合，facet 分解，反讽对仗"
    taboos:
      - "不要数据开场"
      - "不要无充分文献支持就声称矛盾"
  SMJ:
    hook_preference: "Trend (反例+数据) / Anecdote (叙事案例)"
    contribution_style: "多层次贡献，理论精细化"
    taboos:
      - "反例必须有具体数字和案例"
  AMJ:
    hook_preference: "Anecdote (沉浸式叙事) / Rhetorical question (读者共鸣)"
    contribution_style: "机制链清晰，三维度贡献"
    taboos:
      - "不要缺 Why Chain"
  OS:
    hook_preference: "Anecdote (实践张力→理论 puzzle)"
    contribution_style: "系统性/结构性论证"
    taboos:
      - "贡献需有 broader implications"
  ASR:
    hook_preference: "Quote (经典文本) / Trend (理论颠覆)"
    contribution_style: "理论深度优先，实验设计概述在后"
    taboos:
      - "经典理论对话是必备"
  JM_JMR:
    hook_preference: "Trend (数据冲击) / Anecdote (成本困境)"
    contribution_style: "管理相关性+理论机制"
    taboos:
      - "营销后果必须有实证支撑"

# §10 — Gap×Contribution exemplar anchoring
exemplar_anchoring:
