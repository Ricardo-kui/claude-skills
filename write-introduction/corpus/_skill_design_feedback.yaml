  incompleteness-embedded-opposing-claims-vs-incommensurability:
    classification: routing_defect
    status: EMERGING
    risk: medium
    current_rule: Gap 路由将文献内部矛盾/两阵营对立默认映射为 Incommensurability，未区分 Intro 内嵌对立主张仅服务于 empirical adjudication 的 Incompleteness
      子结构。
    rule_excerpt: '| **Incommensurability** | "你们不能都对——现有理解是 wrong/misleading"（直接倡导替代命题，seek to reformulate/redirect） | 最强贡献声明，但
      **strident/polemical 激发 backlash** → 须证据充分、措辞精确（用 "challenge" 而非人身攻击） | 文献内部矛盾/两阵营对立，你的研究裁决或超越 |'
    rule_locator: gap-deepening-reference.md — Gap 类型与修辞强度表
    target: write-introduction/references/gap-deepening-reference.md
    diagnosis: liu_shankar2015 在 Incompleteness 主框架下用 On one hand/On the other hand 嵌入媒体与声誉对立主张，但以 highlight the need for
      empirical research 收束，无 paradigm reformulation；若路由表仅见对立语言即推 Incommensurability 或 14-debate-unresolved，会误配 Theory Lens
      与 Tension 模板。
    proposed_change:
      action: conditionalize
      summary: 在 gap-deepening 或 incommensurability routing 增加分支：若对立主张出现在 enumerated Incompleteness gap 项内且收束语为 empirical
        research need / quantify impact，路由到 16-threefold-gap 变体 C，不激活 R3 mandatory Theory Lens。
    absolute_rule: false
    decisive_falsifier: false
    papers:
    - id: liu_shankar2015
      journal: MS
      evidence_anchor: 'Introduction P5-P6: media salience vs any-news; reputation liability vs buffer — each closes with
        empirical research need'
      evidence_quality: full_text_verified
    paper_count: 1
    journals:
    - MS
    journal_count: 1
    verified_paper_count: 1
    verified_journals:
    - MS
    verified_journal_count: 1
