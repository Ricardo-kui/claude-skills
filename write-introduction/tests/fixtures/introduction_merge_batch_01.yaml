# Batch 01 is intentionally limited to one independently reviewed, same-parent merge.
# It keeps the historical source ID resolvable while removing it from active selection.
actions:
  - action: MERGE
    source_asset_id: previews:findings-preview:vS
    target_asset_id: previews:findings-preview:vM
    capability_overlap: >-
      Both provide a compact empirical preview that confirms a named main effect and then
      states the directional pattern of multiple moderators without coefficients or
      post-hoc mechanism claims. The event-study setting, phenomenon label, number of
      moderators, and strengthen/weaken slot values are not separate generation capabilities.
