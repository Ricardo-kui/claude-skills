  usage_stats_schema:
    origin: Skill-SP 启发（Qwen skill-self-play），语义修正：语料是长期写作资产而非训练脚手架，故不设淘汰逻辑
    granularity: per design_type（对应 corpus/[设计类型].md 文件）
    rationale: 仅汇总指向具体设计类型变体的 corpus 质量信号；详细用户反馈、项目规则与旧建议覆盖关系以 references/feedback-registry.json 为准
    fields:
      revise: 用户对该设计类型产出的不满/需大改的批评次数（Claude 在 write-methods 会话中自动登记）
      reject: 产出被弃用/重写/推翻的次数（同上）
      last_critique: 最近一次批评日期 YYYY-MM-DD（null = 从未被批评）
      common_revise_reasons: 最近批评要点（去重，最多 8 条——精炼时的直接依据）
    signals:
      gap: slots_covered 缺口（静态，不依赖登记）→ 蒸馏优先（ADD 候选）
      critique_heavy: revise + reject >= 2 → 变体产出不可用，精炼优先（REPLACE/EXTEND 候选）
      quiet: revise + reject == 0 → 正常蒸馏，无额外优先级
    non_signals:
    - 不登记 accepted/validated（用户不报告满意，登记必然为零）
    - 不设 too_easy/淘汰（变体是长期资产；频繁使用且好用应提升路由权重，而非降级）
    canonical_feedback: references/feedback-registry.json
    record_path: 先按 references/feedback-protocol.md 登记详细反馈；只有明确指向某设计类型变体时，才由 distill-methods-exemplar 后续同步 revise/reject 聚合计数
