meta:
  last_updated: '2026-08-23'
  total_design_types: 22
  batches_processed: 20
  usage_stats_schema:
    origin: Skill-SP 启发（Qwen skill-self-play），语义修正：语料是长期写作资产而非训练脚手架，故不设淘汰逻辑
    granularity: per design_type（对应 econometric-models/[设计类型].md 文件）
    rationale: 仅汇总指向具体设计类型变体的 corpus 质量信号；详细用户反馈、项目规则与旧建议覆盖关系以 references/feedback-registry.json 为准
    fields:
      revise: 用户对该设计类型产出的不满/需大改的批评次数（Claude 在 write-methods 会话中自动登记）
      reject: 产出被弃用/重写/推翻的次数（同上）
      last_critique: 最近一次批评日期 YYYY-MM-DD（null = 从未被批评）
      common_revise_reasons: 最近批评要点（去重，最多 8 条——精炼时的直接依据）
    signals:
      gap: slots_covered 缺口（静态，不依赖登记）→ 蒸馏优先（ADD 候选）
      critique_heavy: revise + reject >= 2 → 变体产出不可用，精炼优先（REPLACE/EXTEND 候选）
      quiet: revise + reject == 0 → 正常蒸馏，无额外优先级
    non_signals:
    - 不登记 accepted/validated（用户不报告满意，登记必然为零）
    - 不设 too_easy/淘汰（变体是长期资产；频繁使用且好用应提升路由权重，而非降级）
    canonical_feedback: references/feedback-registry.json
    record_path: 先按 references/feedback-protocol.md 登记详细反馈；只有明确指向某设计类型变体时，才由 distill-methods-exemplar 后续同步 revise/reject 聚合计数
  source: corpus INDEX.md + product_recall_cross_validation + cutolo2024_jm_text_count + falchetti2022_smj_experiment + lashley_pollock2020_asq_qualitative_process
    + chung_low_rust_2022_jams_executive_confidence_myopia + ilicic_brennan_2026_jm_political_ideology_addictive_products
    + kim_lee_2026_putting_a_price_on_mission_smj + bamberger_homburg_wielgos_2021_jm_backfill + lee_wu_bednar_orsc_18968_distill
    + reinwald_kanitz_bamberger_backmann_hoegl_2026_orsc_distill + moon_tuli_mukherjee_2023_jm + schumacher_keck_tang_2020_smj
    + kashmiri_nicol_arora_2017_jams + bendig_hensellek_schulte_2024_etp + lee_park_2024_smj + hoffmann_cheong_phan_zurbruegg2024_jm_redistill
    + desjardine_li_shi_2025_amj_distill + ridge_hill_ingram_kolomeitsev_worrell_2024_amj_distill     + fini_jourdan_perkmann_2017_amj_distill
    + chen_ganesan_liu_2009_jm_distill
evidence:
  by_source_paper:
    lee_park_2024_smj:
      journal: Strategic Management Journal
      title: Giving up learning from failures? An examination of learning from one's own failures in the context of heart
        surgeons
      status: VERIFIED
      verification_basis: user_expert_audit
      design_types:
      - 面板数据-OLS
      - 非线性模型
      slots_covered:
      - M1
      - M2
      - M3
      - M4
      - M5
      - M6
      - M7
      - M8
      note: User-audited canonical exemplar for U/inverted-U Methods writing. Bounded outcome motivates fractional logit;
        the curve-support contract predeclares endpoint slopes plus an interior turning point, and turning-point-location
        moderation is adjudicated by condition-specific vertices and a direct Wald equality test. The formulas define the
        narrative estimand rather than create a software tutorial. Use turning point/vertex, not inflection point.
    bendig_hensellek_schulte_2024_etp:
      journal: Entrepreneurship Theory and Practice
      title: Beneficial, Harmful, or Both? Effects of Corporate Venture Capital and Alliance Activity on Product Recalls
      status: EMERGING (1p)
      design_types:
      - 面板数据-OLS
      - 非线性模型
      slots_covered:
      - M1
      - M2
      - M3
      - M4
      - M5
      - M7
      - M8
      - M9
      note: Binomial-logit GEE with exchangeable correlation and robust SE is justified by within-firm correlation, retention
        of all-zero panels, and heteroskedasticity. The curve test requires quadratic sign, opposite endpoint slopes, turning
        point, and Fieller CI. Lagging and untabulated industry-IV checks mitigate but do not resolve endogeneity.
    kashmiri_nicol_arora_2017_jams:
      journal: Journal of the Academy of Marketing Science
      title: 'Me, myself, and I: influence of CEO narcissism on firms'' innovation strategy and the likelihood of product-harm
        crises'
      status: EMERGING (1p)
      design_types:
      - 面板数据-OLS
      - 非线性模型
      - 文本构念测量
      micro_templates:
      - executive-confidence-operationalization
      - model-selection-comparison
      slots_covered:
      - M2
      - M3
      - M4
      - M7
      - M8
      note: Four-indicator archival CEO-narcissism composite with succession-year exclusion; regulatory product-harm indicator
        explicitly bounded away from recall timing/strategy/severity; one theory uses outcome-specific pooled OLS, RE negative
        binomial, fractional logit, and RE logit. Long-tenure sample restriction creates survivorship/tenure-selection risk,
        and null predictor regressions do not establish exogeneity.
    schumacher_keck_tang_2020_smj:
      journal: Strategic Management Journal
      title: 'Biased interpretation of performance feedback: The role of CEO overconfidence'
      status: EMERGING (1p)
      design_types:
      - 面板数据-OLS
      micro_templates:
      - executive-confidence-operationalization
      slots_covered:
      - M2
      - M4
      - M8
      note: Nonoverlapping first-three-year trait formation window and subsequent outcome window; media and option proxies
        provide method-heterogeneous convergence but do not establish construct purity or exogeneity.
    moon_tuli_mukherjee_2023_jm:
      journal: Journal of Marketing
      title: Does Disclosure of Advertising Spending Help Investors and Analysts?
      status: EMERGING (1p)
      design_types:
