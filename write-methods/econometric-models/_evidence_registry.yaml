      note: empirical strategy / strategic human capital；多阶段决策管道(attraction/selection/attrition)+revealed-preference
        WTP+embedded/peripheral CSR手工编码；2026-08-05 gap audit：Methods 无新增；Results 补
        stage-concentrated hetero + Cinelli-Hazlett（见 write-results OLS-FE 变体45–46）；待第二篇交叉验证
    ilicic_brennan_2026_jm:
      journal: Journal of Marketing
      title: Political Ideology Shapes Consumer Responses to Addictive Products
      status: EMERGING (1p)
      design_types:
      - 实验
      - 多研究
      slots_covered:
      - M5
      - M8
      - M9
      note: consumer psychology 机制证据组合（measurement of process + rival accounts battery；补充研究以
        moderation of process 操纵 agency）。主文 Study 4 为横截面测量且结果变量先于中介，反转中介顺序仅是竞争排序敏感性检查，不能确认时间或因果顺序；补充研究正文不可见，故因果收敛主张需保留审计边界。
    chung_low_rust_2022_jams:
