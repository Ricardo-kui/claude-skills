    ridge_hill_ingram_kolomeitsev_worrell_2024_amj:
      journal: Academy of Management Journal
      title: 'Avoidance and Aggression in Stakeholder Engagement: The Impact of CEO Paranoia and Paranoia-Relevant Cues'
      status: EMERGING (1p)
      verification_basis: distill-methods-exemplar_2026-08-12
      design_types:
      - 面板数据-OLS
      - 两阶段模型
      - 文本构念测量
      slots_covered:
      - M2
      - M4
      - M6
      - M8
      story_fidelity: section_variant
      note: From-scratch custom dictionary + nine-step validity chain (component→expert sort→deductive dictionary→student
        sort→PFA→nomological→stability) and earnings-call speaker-attribution pipeline (M2/M4). Endogeneity 'balancing act'
        diagnose-first narrative (RIR N-to-overturn → cure second → naïve/cured pairing) and 2SRI with validation-measures
        reused as instruments (M8). Temporal-spacing one-liner and dual-sided because controls (M2.5/M6). No firm FE (SIC/year
        dummies) under-defended and 2SRI exclusion only implicit — recorded as anti-pattern warnings.
    fini_jourdan_perkmann_2017_amj:
      journal: Academy of Management Journal
      title: 'Social Valuation across Multiple Audiences: The Interplay of Ability and Identity Judgments'
      status: EMERGING (1p)
      verification_basis: distill-methods-exemplar_2026-08-12
      design_types:
