      note: consumer psychology 机制证据组合（measurement of process + rival accounts battery；补充研究以 moderation of process 操纵 agency）。主文
        Study 4 为横截面测量且结果变量先于中介，反转中介顺序仅是竞争排序敏感性检查，不能确认时间或因果顺序；补充研究正文不可见，故因果收敛主张需保留审计边界。
