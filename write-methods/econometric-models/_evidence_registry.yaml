        ruling/classification ambiguity); zero-incident=proactive archival strategy dichotomy; Kenny mediation (probit+cross-section
        AR); Heckman strategy-switching with no-a-priori+main-table exclusion restrictions (λ=0 validates main cross-section).
        SKIP market-model formula and basic CAR cross-section. Anti-patterns: funnel without step Ns; Heckman/mediation only
        in Results.'
