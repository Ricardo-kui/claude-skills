      - M4
      - M7
      - M8
      story_fidelity: section_variant
      note: BLP random-coefficient demand + Kalman state-space for latent brand preference and time-varying ad/recall coefficients;
        GMM. Preliminary reduced-form bridges to structural model. Recall exogeneity via NHTSA mandate; price BLP-IV, advertising
        intercept/slope CF, cross-category media CF. Complements survival/time-to-recall recall corpus on demand-side dynamics.
    bamberger_homburg_wielgos_2021_wage_inequality_jm:
