      - M5
      - M7
      - M8
      - M9
      story_fidelity: section_variant
      note: 'Single-organization (Minerva) scientist panel 2001-2012; DV = peer grant award count (0-23); IV = cumulative
        industry contracts with squared term for inverted U; moderators = audience identity proximity + publication record.
        Identification stack: probit+IMR selection -> iterative Poisson GMM instrumenting three endogenous terms (peer eval,
        industry eval, industry eval^2) with 3 instruments + Hansen J -> CEM confirmatory replication -> explanatory sequential
        interviews. Writes M1 data-availability setting (面板数据-OLS 变体41), M5 moderator-dummy external validity chain via Tijssen
        U-I intensity (面板数据-OLS 变体42), M8 CEM confirmatory replication (PSM匹配面板 变体4), M9 explanatory sequential roadmap (多研究
        变体10); core GMM narrative registered under 非线性模型 变体16. Anti-patterns recorded: CEM strata without balance stats, three-threats
        merged statement, squared-term exclusion not separately argued.'
    chen_ganesan_liu_2009_jm:
      journal: Journal of Marketing
      title: Does a Firm's Product-Recall Strategy Affect Its Financial Value? An Examination of Monitoring Versus Initiating
        Recalls
      status: EMERGING (1p)
