      - M8
      note: peer-IV proximity gradient + multi-endogeneity correction ledger (binary choice, continuous spending, mediator,
        coverage selection)
    reinwald_kanitz_bamberger_backmann_hoegl_2026_orsc:
      journal: Organization Science
      title: 'The Elephant and Donkey in the Room: Time-Varying Effects of Political Dissimilarity on Social Interactions
        at Work During U.S. Elections'
      status: EMERGING (1p)
      design_types:
      - 多研究
      - 事件历史+事件研究
      slots_covered:
      - M2
      - M7
      - M8
      - M9
      note: Three-study constructive replication; event-centered DGCM separates pretrend, election transition, and postevent
        trend. Study 2 randomizes political dissimilarity but not election timing; Study 3 has one preevent observation and
        therefore cannot estimate a pretrend.
    lee_wu_bednar_orsc_18968:
      journal: Organization Science
      title: 'When the Headlines Fade, the Story Goes On: Investigating How Local Newspaper Decline Affects Firm CSR Engagement'
      status: EMERGING (1p)
      design_types:
      - 自然实验-DiD
      slots_covered:
      - M2
      - M7
      - M8
      note: County-level staggered newspaper declines mapped to headquartered firms; signed CSR strengths-minus-concerns motivates
        linear FE. TWFE+Bacon retained only as a legacy diagnostic, with modern staggered-DiD and HonestDiD requirements added
        as boundaries.
    hoffmann_cheong_phan_zurbruegg2024_jm:
      journal: Journal of Marketing
      title: So, Sue Me…If You Can! How Legal Changes Diminishing Managers' Risk of Being Held Liable by Shareholders Affect
        Firms' Likelihood to Recall Products
      status: EMERGING (1p)
      verification_basis: distill-methods-exemplar_redistill_2026-08-05
      design_types:
      - 自然实验-DiD
      - 非线性模型
      - 文本构念测量
      - 推断二元结果
      slots_covered:
      - M1
      - M2
      - M3
      - M5
      - M6
      - M7
      - M8
      story_fidelity: section_variant
      note: 'Staggered UD-law DiD + conditional logit with year/industry FE (not firm FE; collinearity from always-zero recall
        firms). Identification stack: model-free means, external manipulation check, Pre(-3/-2/-1) pretrends, 1000x state-reassignment
        placebo. Discretion subsample excludes injury/death recalls. Text moderator via Zachary et al. dictionary on 10-K.
        Prior slot variants incorrectly cited firm FE and incidental parameters — corrected in redistill.'
    liu_shankar2015:
      journal: Management Science
      title: The Dynamic Impact of Product-Harm Crises on Brand Preference and Advertising Effectiveness
      status: EMERGING (1p)
      verification_basis: distill-methods-exemplar_2026-08-05
      design_types:
