# ---------------------------------------------------------------------------
# Slot-Micro-Template Bindings
# ---------------------------------------------------------------------------
# 骨架-微模板显式映射表。
# 定义每个 M-slot 的关键句法位置应加载哪些微模板条目。
# write-methods 调用时，根据此映射表从 micro-templates/ 目录中选择性加载微模板。
#
# Version: 1.0.2 | Created: 2026-05-22 | Updated: 2026-07-08
#
# CORE 条目池冻结声明（2026-05-22）
# ————————————————————————————————————————————
# 当前 core 层级条目数：32（经 validate_bindings.py 全量验证）
# 冻结规则：
#   1. 新增 core 条目需先跑通 validate_bindings.py，确认 0 errors。
#   2. core 条目必须满足 frequency='高'、transferability='通用'、risk='安全'。
#   3. 新增 core 条目需经过人工审核：确认该微模板在 MVP30 语料库中出现
#      频次>=10/28，且不绑定特定设计类型。
#   4. 仅 extended/full 层级可自由追加；core 层级变更需更新 _meta.core_baseline。
# ————————————————————————————————————————————
# ---------------------------------------------------------------------------

_meta:
  name: slot-micro-template-bindings
  version: "1.0.2"
  created: "2026-05-22"
  updated: "2026-07-08"
  core_baseline:
    count: 32
    frozen_at: "2026-05-22"
    validation_script: "validate_bindings.py"
    rule: "新增 core 条目需先通过 validate_bindings.py 全量验证（0 errors），并经过人工审核确认跨设计类型通用性与来源频次。"

# ---------------------------------------------------------------------------
# 加载分级定义
# ---------------------------------------------------------------------------
load_tiers:
  core:      # 高频、跨设计类型通用、低风险——默认加载
    criteria: "frequency == '高' AND transferability == '通用' AND risk == '安全'"
    max_templates_per_position: 2
  extended:  # 中频或设计类型特定——用户要求扩展时加载
    criteria: "frequency IN ['高', '中'] AND risk != '高风险'"
    max_templates_per_position: 3
  full:      # 全部微模板——用户明确要求丰富表达时加载
    criteria: "ALL"
    max_templates_per_position: 5

# ---------------------------------------------------------------------------
# M1 — 研究情境 / 实证背景
# ---------------------------------------------------------------------------
M1:
  description: "论证 setting 合法性"
  persuasive_action: "合法性论证"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M1 — 研究情境合法性论证"
          entries:
            - label: "通用三段式"
              template: "[Empirical setting] provides an appropriate context for examining [theoretical relationship] for [N] reasons."
              tier: core
            - label: "DiD政策冲击式"
              template: "We examine [phenomenon] using [policy/event/institutional change] that altered [exposure] across [units] and time."
              tier: extended
              design_type_filter: ["自然实验-DiD"]
            - label: "实验声明式"
              template: "We test [theoretical claim] using a [laboratory/field/online] experiment."
              tier: extended
              design_type_filter: ["实验"]
    transition:
      required: false
      default_tier: core
      bindings:
        - file: "transitions.md"
          section: "理由枚举（Reason Enumeration）"
          entries:
            - label: "First/Second/Third"
              template: "First, [setting property] makes [mechanism] observable."
              tier: core

# ---------------------------------------------------------------------------
# M2 — 数据来源与样本漏斗
# ---------------------------------------------------------------------------
M2:
  description: "样本漏斗可审计性"
  persuasive_action: "可审计性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M2 — 样本漏斗可审计性"
          entries:
            - label: "通用起始式"
              template: "We began with [starting population] from [source] over [period]."
              tier: core
            - label: "多源匹配式"
              template: "The intersection of these datasets resulted in a sample of [N] [phenomenon] across [N] firms from [year_start] to [year_end]."
              tier: extended
    funnel_rhythm:
      required: true
      default_tier: core
      bindings:
        - file: "funnel-rhythm.md"
          section: "微模板：逐步排除"
          entries:
            - label: "通用排除式"
              template: "We excluded [cases] because [comparability/measurement/identification reason]."
              tier: core
            - label: "数字审计链"
              template: "Of the [N] initial [units], [N] were excluded due to [reason_1], [N] due to [reason_2], resulting in a final sample of [N]."
              tier: extended
    because_clause:
      required: true
      default_tier: core
      bindings:
        - file: "because-clauses.md"
          section: "3. 样本排除型（Sample Exclusion）"
          entries:
            - label: "排除理由"
              template: "We excluded [cases] because [comparability/measurement/identification reason]."
              tier: core

# ---------------------------------------------------------------------------
# M3 — 因变量
# ---------------------------------------------------------------------------
M3:
  description: "因变量操作化"
  persuasive_action: "对齐性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M3 — 因变量操作化"
          entries:
            - label: "通用DV声明"
              template: "Our dependent variable is [outcome construct], measured as [operational definition] using [source]."
              tier: core
    variable_operationalization:
      required: true
      default_tier: core
      bindings:
        - file: "variable-operationalization.md"
          section: "因变量（M3）"
          entries:
            - label: "构念效度"
              template: "This measure captures [construct] because [construct-validity logic]."
              tier: core
            - label: "方向解释"
              template: "Higher values indicate [interpretation direction]."
              tier: core
    because_clause:
      required: false
      default_tier: core
      bindings:
        - file: "because-clauses.md"
          section: "2. 构念效度型（Construct Validity）"
          entries:
            - label: "构念效度because"
              template: "This measure captures [construct] because [construct-validity logic]."
              tier: core
    causal_verb:
      required: false
      default_tier: core
      bindings:
        - file: "causal-hedging.md"
          section: "面板数据 / OLS / FE / HLM"
          entries:
            - label: "关联型"
              template: "associated with"
              tier: core
              note: "默认，适用于所有非实验设计"

# ---------------------------------------------------------------------------
# M4 — 自变量 / 核心预测变量
# ---------------------------------------------------------------------------
M4:
  description: "自变量操作化"
  persuasive_action: "对齐性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M4 — 自变量操作化"
          entries:
            - label: "通用IV声明"
              template: "Our focal independent variable, [predictor name], is measured as [operation] based on [source/timing]."
              tier: core
            - label: "处理变量声明"
              template: "The treatment indicator equals one for [unit-years/participants] exposed to [event/condition] and zero otherwise."
              tier: extended
              design_type_filter: ["自然实验-DiD"]
    variable_operationalization:
      required: true
      default_tier: core
      bindings:
        - file: "variable-operationalization.md"
          section: "自变量（M4）"
          entries:
            - label: "假设对齐"
              template: "This variable corresponds to Hypothesis [x] because it captures [mechanism]."
              tier: core
        - file: "executive-confidence-operationalization.md"
          section: "标准操作化句式"
          entries:
            - label: "期权 moneyness 操作化"
              template: "[Actor] confidence is measured as the average moneyness of the exercisable options held by the [actor] in [year t]."
              tier: extended
              design_type_filter: ["面板数据-OLS", "两阶段模型", "IV-2SLS"]
    because_clause:
      required: false
      default_tier: core
      bindings:
        - file: "because-clauses.md"
          section: "4. 机制解释型（Mechanism Linkage）"
          entries:
            - label: "机制映射"
              template: "...because it captures [mechanism], which links [IV] to [DV] through [process]."
              tier: core

# ---------------------------------------------------------------------------
# M5 — 调节/中介/机制变量
# ---------------------------------------------------------------------------
M5:
  description: "调节/中介/机制变量"
  persuasive_action: "对齐性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M5 — 调节/中介/机制变量"
          entries:
            - label: "通用调节声明"
              template: "To capture [boundary/mechanism], we measure [moderator/mediator] as [operation]."
              tier: core
    variable_operationalization:
      required: true
      default_tier: core
      bindings:
        - file: "variable-operationalization.md"
          section: "调节/中介变量（M5）"
          entries:
            - label: "交互项说明"
              template: "We interact [predictor] with [moderator] to test whether [relationship] is stronger/weaker under [condition]."
              tier: core

# ---------------------------------------------------------------------------
# M6 — 控制变量与竞争性解释
# ---------------------------------------------------------------------------
M6:
  description: "控制变量与竞争性解释"
  persuasive_action: "抗辩性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M6 — 控制变量与竞争性解释"
          entries:
            - label: "通用控制声明"
              template: "We include controls for [threat family] because [alternative explanation]."
              tier: core
            - label: "高密度控制声明"
              template: "We included a broad set of control variables that influence [DV] directly and those that help address alternative explanations ([methodology_citation])."
              tier: extended
    because_clause:
      required: true
      default_tier: core
      bindings:
        - file: "because-clauses.md"
          section: "1. 竞争性解释型（Rival Explanation）"
          entries:
            - label: "竞争性解释"
              template: "...because [rival theory] predicts that [alternative mechanism] drives [outcome]."
              tier: core
            - label: "遗漏变量"
              template: "...because [omitted variable] may confound the [IV-DV] relationship by [mechanism]."
              tier: core
            - label: "资源竞争"
              template: "...because [larger and older firms] may have more resources for both [IV] and [DV]."
              tier: core
    transition:
      required: true
      default_tier: core
      bindings:
        - file: "transitions.md"
          section: "层级递进（Level Progression）"
          entries:
            - label: "first层级"
              template: "We first included [level_1]_level factors..."
              tier: core
            - label: "also层级"
              template: "We also controlled for [level_2]_level characteristics..."
              tier: core
            - label: "lastly层级"
              template: "Lastly, we included firm and year fixed effects..."
              tier: core

# ---------------------------------------------------------------------------
# M7 — 模型规格与估计方法
# ---------------------------------------------------------------------------
M7:
  description: "模型规格与估计方法"
  persuasive_action: "可信性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M7 — 模型规格与估计方法"
          entries:
            - label: "通用估计器声明"
              template: "Because [dependent variable] is [continuous/binary/ordinal/count/censored/time-to-event], we estimate [model]."
              tier: core
            - label: "FE选择声明"
              template: "We employ [unit] fixed effects rather than random effects because the Hausman test rejects..."
              tier: extended
    because_clause:
      required: false
      default_tier: core
      bindings:
        - file: "because-clauses.md"
          section: "5. 估计器选择型（Estimator Justification）"
          entries:
            - label: "估计器选择"
              template: "Because [DV] is [continuous/binary/ordinal/count/censored/time-to-event], we use [model]."
              tier: core
    economic_significance:
      required: false
      default_tier: extended
      bindings:
        - file: "interquartile-economic-significance.md"
          section: "标准句式"
          entries:
            - label: "IQR 经济显著性"
              template: "An interquartile move in [IV] from the 25th percentile to the 75th percentile is associated with a [value] [unit] increase in [DV]."
              tier: extended
    causal_verb:
      required: false
      default_tier: core
      bindings:
        - file: "causal-hedging.md"
          section: "面板数据 / OLS / FE / HLM"
          entries:
            - label: "关联型"
              template: "associated with"
              tier: core

# ---------------------------------------------------------------------------
# M8 — 识别策略 / 效度 / 诊断检验
# ---------------------------------------------------------------------------
M8:
  description: "识别策略/效度/诊断检验"
  persuasive_action: "可信性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M8 — 识别策略/效度/诊断检验"
          entries:
            - label: "通用诊断声明"
              template: "To address concerns about [threat], we [design feature/test]."
              tier: core
            - label: "识别策略声明"
              template: "Our identification strategy relies on [source of variation]."
              tier: extended
              design_type_filter: ["自然实验-DiD"]
    identification_foreshadowing:
      required: true
      default_tier: core
      bindings:
        - file: "identification-foreshadowing.md"
          section: "自然实验 / DiD"
          entries:
            - label: "平行趋势预告"
              template: "The key identifying assumption is that [treated and control units] would have followed similar trends absent [treatment]. We assess this assumption in the Results section using [event-study/leads-lags] specifications."
              tier: core
            - label: "BadControl规避"
              template: "We first estimate a parsimonious specification because [controls] may be affected by [treatment]."
              tier: extended
        - file: "heckman-peer-prevalence-exclusion.md"
          section: "排他性限制论证"
          entries:
            - label: "Heckman 同行 prevalence 排除限制"
              template: "A valid exclusion restriction must influence selection into the sample but have no direct effect on the outcome. [Peer Prevalence] satisfies this condition for three reasons."
              tier: extended
              design_type_filter: ["两阶段模型"]
        - file: "alternative-dv-falsification.md"
          section: "标准句式"
          entries:
            - label: "替代 DV falsification"
              template: "An alternative way to establish causality is to provide a falsification test in which we examine how [alternative DV]—an outcome that is outside the decision-making domain of [actor]—is affected by [focal predictor]."
              tier: extended
    because_clause:
      required: false
      default_tier: core
      bindings:
        - file: "because-clauses.md"
          section: "6. 识别策略型（Identification Defense）"
          entries:
            - label: "外生性论证"
              template: "[Shock/event] creates variation in [treatment] that is plausibly exogenous to [outcome] because [reason]."
              tier: core
        - file: "identification-exogeneity.md"
          section: "类型 1：外生性来源声明句"
          entries:
            - label: "DWH + Gaussian copula 内生性叙事"
              template: "Therefore, to further address endogeneity concerns, we conduct the Durbin-Wu-Hausman (DWH) test and use the instrument-free Gaussian copula joint estimation method."
              tier: extended
              design_type_filter: ["面板数据-OLS", "IV-2SLS"]
    causal_verb:
      required: false
      default_tier: core
      bindings:
        - file: "causal-hedging.md"
          section: "自然实验 / DiD"
          entries:
            - label: "效应型"
              template: "effect of ... on ..."
              tier: core
              note: "仅在平行趋势/事件研究支持后可用"
    robustness_foreshadowing:
      required: false
      default_tier: extended
      bindings:
        - file: "robustness-foreshadowing.md"
          section: "标准预告句式"
          entries:
            - label: "稳健性总起"
              template: "To ensure that our findings are not driven by [specific modeling choice], we conduct a series of robustness checks."
              tier: extended

# ---------------------------------------------------------------------------
# M9 — 多研究 / 实验程序 / 质性编码
# ---------------------------------------------------------------------------
M9:
  description: "多研究过渡"
  persuasive_action: "导航性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M9 — 多研究过渡"
          entries:
            - label: "研究总览"
              template: "Study [x] tests [hypothesis/effect] using [sample/design]."
              tier: core
    transition:
      required: false
      default_tier: core
      bindings:
        - file: "transitions.md"
          section: "程序推进（Procedural Advance）"
          entries:
            - label: "研究衔接"
              template: "Although Study [x] addresses [issue], it cannot establish [remaining need]. Study [x+1] therefore [design upgrade]."
              tier: core

# ---------------------------------------------------------------------------
# M10 — Methods 到 Results 的过渡
# ---------------------------------------------------------------------------
M10:
  description: "Methods→Results 过渡"
  persuasive_action: "导航性"
  syntax_positions:
    opening_anchor:
      required: true
      default_tier: core
      bindings:
        - file: "opening-anchors.md"
          section: "M10 — Methods→Results 过渡"
          entries:
            - label: "结果预告"
              template: "The Results section first reports [main tests] and then examines [validity/robustness checks]."
              tier: core
    robustness_foreshadowing:
      required: false
      default_tier: extended
      bindings:
        - file: "robustness-foreshadowing.md"
          section: "M10 过渡段中的稳健性预告"
          entries:
            - label: "M10稳健性预告"
              template: "The Results section first reports [main tests] and then examines [validity/robustness checks]. Because [measure/design] raises [concern], we address this issue in supplemental analyses using [test]."
              tier: extended

# ---------------------------------------------------------------------------
# 全局约束
# ---------------------------------------------------------------------------
global_constraints:
  max_micro_templates_per_slot: 8      # 单个槽位最多加载的微模板条目数
  max_micro_template_files_per_call: 4  # 单次调用最多读取的微模板文件数
  default_tier: "core"                  # 默认加载分级
  design_type_override: true            # 允许设计类型过滤器覆盖默认分级
