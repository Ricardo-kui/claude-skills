      note: Prevents interaction significance from masking failure of one predicted pole.
    - id: csp_did_net_effect_then_heterogeneous_contingencies
      pattern: R2/R3 average net treatment effect → preview opposing contingencies → sequential interaction four-beats (direction→sig→1SD%→support)
        → R7 threat-section identification battery
      from_slot: R3
