      sources:
      - Castellaneta_Conti_Kacperczyk_2017_SMJ
    anti_patterns:
    - id: ap_did_significant_interaction_full_support
      pattern: Calling a sign-switch hypothesis fully supported solely because the interaction coefficient is significant
      severity: high
      affected_slots:
      - R4
      - R6
      source_count: 1
    - id: ap_did_bacon_as_bias_correction
      pattern: Presenting Goodman-Bacon decomposition as if it corrected heterogeneous cohort/time effects in TWFE
      severity: high
      affected_slots:
      - R7
      source_count: 1
    - id: ap_did_marginal_p_as_full_support
      pattern: Labeling a contingency hypothesis fully supported at p≈.06 without acknowledging marginal/.10 convention
      severity: medium
      affected_slots:
      - R3
      - R4
      source_count: 1
      sources:
      - Castellaneta_Conti_Kacperczyk_2017_SMJ
    - id: ap_did_placebo_null_as_hypothesis_support
      pattern: Treating null placebo (fake treatment timing) as evidence that substantive hypotheses are supported
      severity: high
      affected_slots:
      - R7
      source_count: 1
      sources:
      - Castellaneta_Conti_Kacperczyk_2017_SMJ
    honesty_boundaries:
    - id: hb_did_two_pole_prediction_audit
      boundary: If a hypothesis predicts opposite signs at high and low moderator values, each sign must be checked separately;
        a significant interaction alone supports only differential effects.
      allowed_language: partial support / supports the contingency but not the predicted low-condition sign
      affected_estimators:
      - DiD
      violation_count: 0
    - id: hb_did_legacy_twfe_diagnostic_only
      boundary: Bacon decomposition diagnoses comparison weights but does not repair TWFE bias under heterogeneous treatment
        effects; use a heterogeneity-robust staggered-DiD estimator and sensitivity analysis.
      allowed_language: diagnostic evidence / decomposition of conventional TWFE
      affected_estimators:
      - DiD
      violation_count: 0
    - id: hb_did_corroborative_not_mechanism_identification
      boundary: Associations between behavior, communication, and intermediary attention may corroborate premises but do not
        identify a causal mechanism without separate mediation identification.
      allowed_language: consistent with / corroborates selected premises / suggests
      affected_estimators:
      - DiD
      violation_count: 0
    - id: hb_did_placebo_null_identification_only
      boundary: Null results on lead/lag placebo treatments corroborate that findings are not chance/spurious timing; they
        do not constitute support for substantive hypotheses.
      allowed_language: reduces concerns that results arise by chance / consistent with exogenous timing
      affected_estimators:
      - DiD
      violation_count: 0
    - id: hb_did_threat_battery_not_parallel_trends_substitute
      boundary: A matching/political-economy/placebo threat battery does not substitute for event-study parallel-trends evidence
        when the design is classic unit×time DiD; if the design is holding-period treatment or similar, state why event-study
        is not applicable.
      allowed_language: design-appropriate identification checks / not a substitute for parallel trends when required
      affected_estimators:
      - DiD
      violation_count: 0
