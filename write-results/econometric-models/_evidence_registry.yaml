      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 建议纳入write-results R4模板，作为间接调节效应的标准报告范式。
    - id: csp_IV_2SLS_R5_660aee9f
      pattern: 经济显著性完全后置到Discussion，而非嵌入Results。作者在Results中只报告统计系数，在Discussion中通过back-of-the-envelope calculation将系数转化为具体政策/市场含义（04,367
        → 1 fewer recall → 2M savings）。
      from_slot: R5
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 这是一种R5后置策略，适用于系数单位为计数、需要额外假设才能转化为经济含义的设计（IV/计数模型）。
    - id: csp_IV_2SLS_R7_93f6f742
      pattern: IV论文的稳健性检验采用了罕见的exogenous event + DiD组合：以Flint水危机作为外生冲击，验证GM的lobbying增加与recall下降的双重差异。这不是主识别策略，而是作为external
        validity的增强检验。
      from_slot: R7
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 为IV设计提供了除GMM/非线性之外的外部效度检验新范式，可作为R8或R7的补充块。
    - id: csp_IV_2SLS_R2-R3_e317a29d
      pattern: Results部分以Table 4（IV 2SLS主效应）和Table 5（Moderation）两张表完成全部假设检验，无模型序列递增（Model 1→2→3）。导航语句极简：[Table X contains
        the results for IV 2SLS model]。这种极简导航适用于假设数量少（4个）、且每假设有独立表格的场景。
      from_slot: R2-R3
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 与OLS/FE论文的Model 1→2→3递增序列形成对比，可作为IV/特殊设计论文的R2变体。
    - id: csp_IV_2SLS_R2_06a8d2b4
      pattern: Heckman selection model中，第一阶段结果单独成表（Table 2），并在Results正文中详细报告第一阶段系数和显著性，而非仅在Appendix呈现。
