        - id: r4_dv_split_moderation_cross_column_comparison
          skeleton: In columns [c_a] and [c_b] of Table [z], we test Hypotheses [N-a] and [N-b] by dividing our dependent
            variable into [split A] (column [c_a]) and [split B] (column [c_b]). For Hypothesis [N-a], we predicted that the
