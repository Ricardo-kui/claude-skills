      note: Peer-effect/network-effect specific. Recommend review for corpus inclusion under peer-effect templates.
    - id: csp_IV_2SLS_R7_c9ea2981
      pattern: 'Narrative threat-table matrix (Table 6: Alternative Explanation | Tests and Results) complements traditional
        regression robustness table (Table 7).'
      from_slot: R7
      to_slot: ''
      paper_count: 1
