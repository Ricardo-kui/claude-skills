# Results Evidence Registry
# Schema: estimator-slot-skeleton v1.0.0
# 设计说明见 INDEX.md

meta:
  schema_version: 1.1.0
  registry_type: estimator-slot-skeleton
  last_updated: '2026-08-12'
  last_batch_id: batch_31_ridge_et_al_2024_amj
  batches_processed: 31
  total_papers_indexed: 32
  usage_stats_schema:
    origin: "Skill-SP 启发（Qwen skill-self-play），语义修正：语料是长期写作资产而非训练脚手架，故不设淘汰逻辑"
    granularity: "per estimator（对应 econometric-models/[结果类型].md 文件）"
    rationale: "用户不会报告满意，但会在对话中批评产出——批评是唯一可靠且零成本的使用反馈信号"
    fields:
      revise: 用户对该估计器产出的不满/需大改的批评次数（Claude 在 write-results 会话中自动登记）
      reject: 产出被弃用/重写/推翻的次数（同上）
      last_critique: 最近一次批评日期 YYYY-MM-DD（null = 从未被批评）
      common_revise_reasons: 最近批评要点（去重，最多 8 条——精炼时的直接依据）
    signals:
      gap: "slots 未覆盖缺口（静态，不依赖登记）→ 蒸馏优先（ADD 候选）"
      critique_heavy: "revise + reject >= 2 → 变体产出不可用，精炼优先（REPLACE/EXTEND 候选）"
      quiet: "revise + reject == 0 → 正常蒸馏，无额外优先级"
    non_signals:
      - "不登记 accepted（用户不报告满意，登记必然为零）"
      - "不设 too_easy/淘汰（变体是长期资产；频繁使用且好用应提升路由权重，而非降级）"
    record_path: "Claude 在 write-results 会话中捕获用户批评后自动登记（见 write-results SKILL.md 批评登记）；批量登记可用 python _update_registry.py --record-critique <critiques.yaml>（见 distill-results-exemplar SKILL.md Phase 4.5）"
  subfields:
  - strategy
  - ob_hr
  - om
  - marketing
  - finance
  - accounting
status_rules:
  EMERGING:
    paper_count_max: 2
    description: 单篇或两篇论文中出现，尚未形成稳定模式
  VERIFIED:
    paper_count_min: 3
    expert_audit_override: true
    description: 至少3篇论文复现，或经用户专家审计确认为典型范文；可作为可靠备选，并须记录 verification_basis
  ROBUST:
    paper_count_min: 5
    cross_subfields_min: 2
    description: 至少5篇论文复现，且跨>=2个子领域，可作为默认骨架
global_anti_patterns:
- id: ap_r3_coefficient_only
  pattern: R3 只报系数和p值，不翻译实质含义
  severity: high
  affected_slots:
  - R3
  affected_estimators:
  - all
  note: 记录为反模式，不提取为标准骨架
  source_count: 0
- id: ap_r7_table_listing
  pattern: 稳健性按 Table 3/4/5 罗列，无 threat 定位
  severity: medium
  affected_slots:
  - R7
  affected_estimators:
  - all
  note: 提取时降级为 table-based 变体，优先推荐 threat-based
  source_count: 0
- id: ap_interaction_main_effect_independent
  pattern: 交互显著后仍独立解释主效应
  severity: high
  affected_slots:
  - R3
  - R4
  affected_estimators:
  - all
  note: 必须在骨架中增加警告：交互显著后主效应不可独立解释
  source_count: 0
- id: ap_nonsignificant_skip
  pattern: 选择性跳过不显著假设
  severity: high
  affected_slots:
  - R6
  affected_estimators:
  - all
  note: 若原文如此，记录为反模式；write-results 默认要求报告所有假设
  source_count: 0
- id: ap_r7_selective_confirmatory_only
  pattern: 稳健性检验只报告 confirmatory 结果，隐藏 divergent 结果
  severity: high
  affected_slots:
  - R7
  affected_estimators:
  - all
  note: 当某个稳健性维度存在多个检验且部分confirm、部分disconfirm时，必须在正文和汇总表中同时报告。Yuan et al. 2026 JOM Section D。
  source_count: 0
- id: ap_preprocessing_opaque
  pattern: 预处理选择不透明，缺失数据处理/离群值阈值/变量转换策略不可追溯
  severity: medium
  affected_slots:
  - R7
  - M2
  affected_estimators:
  - all
  note: 缺失数据处理方法、离群值阈值、变量转换策略必须在Methods或R7中明确报告，不能仅以"standard practices"概括。Yuan et al. 2026 JOM REC B3.4。
  source_count: 0
- id: ap_covariate_no_theoretical_defense
  pattern: 协变量选择无理论辩护，增删控制变量仅基于统计显著性
  severity: medium
  affected_slots:
  - R7
  - M2
  affected_estimators:
  - OLS_FE
  - Logit_Probit_Ordered_Probit
  note: 控制变量的增删必须有理论依据（DAG/prior studies），不能仅基于"significant in one specification, dropped in another"。Yuan et al. 2026 JOM REC B3.3。
- id: ap_significance_rescue_control_deletion
  pattern: 焦点系数仅边际显著后，删除当期不显著控制变量并将 p<.05 宣称为更强假设支持
  severity: high
  affected_slots:
  - R3
  - R7
  affected_estimators:
  - OLS_FE
  - Logit_Probit_Ordered_Probit
  note: 控制集须由理论、设计或预先规则决定；替代控制集只能作为透明敏感性分析，不得升级完整规格的假设判定。
  source_count: 1
  sources:
  - Kashmiri_Nicol_Arora_2017_JAMS
global_honesty_boundaries:
- id: hb_causal_language_ols
  boundary: OLS/FE 论文不得使用 'effect of' / 'causes' / 'leads to'
  allowed_language: associated with / positively related to / consistent with
  affected_estimators:
  - OLS_FE
  note: 仅 DiD/IV/实验可使用因果语言，且需在 R2/R7 展示识别策略
  violation_count: 0
- id: hb_parallel_trend_non_did
  boundary: 非 DiD 设计不得提及 parallel trends
  affected_estimators:
  - OLS_FE
  - Logit_Probit_Ordered_Probit
  - IV_2SLS
  note: 平行趋势是 DiD 的专属识别假设
  violation_count: 0
- id: hb_logit_coefficient_magnitude
  boundary: Logit/Probit 不得直接解释系数大小
  required: 必须报告 AME / 边际效应 / 概率变化
  affected_estimators:
  - Logit_Probit_Ordered_Probit
  note: R3 四拍中拍3必须是边际效应，不是 β
  violation_count: 0
- id: hb_r7_no_selective_reporting
  boundary: 不得在稳健性检验中只报告一致的子集
  required: 当某个稳健性维度存在多个检验且部分confirm、部分disconfirm时，必须在正文和汇总表中同时报告所有检验结果
  affected_estimators:
  - all
  note: Divergent findings应框定为边界条件或测量敏感性，而非错误。Yuan et al. 2026 JOM Section D。
  violation_count: 0
- id: hb_preprocessing_transparency
  boundary: 预处理选择必须明确报告，不得隐藏为"standard practices"
  required: 缺失数据处理方法(listwise deletion/multiple imputation/FIML)、离群值阈值(1st/99th vs. 5th/95th percentile)、变量转换(log/sqrt/untransformed)必须在Methods或R7中明确报告
  affected_estimators:
  - all
  note: Yuan et al. 2026 JOM REC B3.4 — 预处理变异是最被低估但最容易实施的稳健性检验。
  violation_count: 0
estimators:
  OLS_FE:
    display_name: OLS / Fixed Effects
    usage_stats:
      revise: 0
      reject: 0
      last_critique: null
      common_revise_reasons: []
    forced_slots:
    - R1
    - R2
    - R3
    - R7
    high_risk_missing:
      R1: 缺诊断检验（VIF/multicollinearity）
      R3: 缺经济显著性（幅度解释）
      R7: 稳健性机械罗列而非按 threat 组织
    slots:
      R1:
        description: 描述性统计 / 诊断导向
        skeleton_variants:
        - id: r1_ols_standard
          skeleton: Table [x] presents descriptive statistics and correlations... The correlations are generally consistent...
            [Diagnostic] values were below [threshold], reducing concern about [routine issue].
          paper_count: 15
          status: ROBUST
          subfield_distribution:
            strategy: 5
            ob_hr: 4
            om: 3
            marketing: 2
            finance: 1
          sources:
          - Smith_2021_SMJ
          - Lee_2022_AMJ
          - Wang_2020_MSOM
          transferability: high
          paradigm_exclusivity: 通用，所有线性模型可用
          rhythm_tags:
          - table_presentation
          - diagnostic_reassurance
          - contextual_pattern
          notes: 15/28 篇 MVP30 范文使用
          corpus_path: econometric-models/OLS-FE.md
      R2:
        description: 模型序列 / 表格导航
        skeleton_variants:
        - id: r2_ols_model_sequence
          skeleton: Table [x] reports the results of our regression analyses. Model 1 includes [controls only]. Model 2 adds
            [predictor]. Model 3 further includes [moderator].
          paper_count: 12
          status: ROBUST
          subfield_distribution:
            strategy: 4
            ob_hr: 3
            om: 3
            marketing: 2
          sources: []
          transferability: high
          paradigm_exclusivity: 通用
          rhythm_tags:
          - incremental_model_building
          - table_navigation
          corpus_path: econometric-models/OLS-FE.md
        - id: r2_ols_model_free_quartile_opening
          skeleton: We first present model-free evidence regarding the relationship between [IV] and [DV]. In the [web appendix],
            we show scatter plots of [DV] against [IV] for [subgroup description]. In Fig. [X], we divide the sample into [four
            quartiles] based on [IV] and calculate the mean and median [DV] for each quartile. Consistent with Hypothesis [N],
            there is a monotonic [increase/decrease] in [DV] from the first quartile, where [IV] is lowest, to the fourth quartile,
            where [IV] is highest. The mean (median) [DV] is significantly different across the quartiles.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Chung_Low_Rust_2022_JAMS
          transferability: medium
          paradigm_exclusivity: OLS/FE 连续 IV 主效应预览
          rhythm_tags:
          - model_free_evidence
          - quartile_means
          - descriptive_preview
          corpus_path: econometric-models/OLS-FE.md
        - id: r2_ols_heckman_two_stage_table_navigation
          skeleton: Table [X] shows the results of the first-stage selection equation. Our exclusion restriction, [instrument],
            significantly and [positively/negatively] predicts [selection_DV] (β = [value], p < [threshold]), consistent with
            [theory]. Table [Y] reports the second-stage Heckman selection results. Column 1 tests Hypothesis [H1]. Column 2
            adds the two-way moderating relationships. Column 3 introduces the three-way interactions. Column 4 shows that the
            results are robust to the inclusion of [firm fixed effects].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Chung_Low_Rust_2022_JAMS
          transferability: medium
          paradigm_exclusivity: Heckman 选择模型 + 多假设表格导航
          rhythm_tags:
          - heckman_first_stage
          - column_navigation
          - selection_correction
          corpus_path: econometric-models/OLS-FE.md
      R3:
        description: 主假设检验（四拍节奏）
        skeleton_variants:
        - id: r3_ols_four_beat_standard
          skeleton: Hypothesis [x] predicted that [predictor] would be [positive/negative] related to [outcome]. Model [y]
            of Table [z] shows that the coefficient for [predictor] is [positive/negative] and statistically significant (β
            = [value], p < [threshold], 95% CI [[lower], [upper]]). Substantively, a [one-SD] increase in [predictor] is associated
            with a [Y-unit] [increase/decrease] in [outcome]. Thus, Hypothesis [x] is supported.
          paper_count: 15
          status: ROBUST
          subfield_distribution:
            strategy: 5
            ob_hr: 4
            om: 3
            marketing: 2
            finance: 1
          sources: []
          transferability: high
          paradigm_exclusivity: OLS/FE 专用，非线性模型需替换幅度解释
          rhythm_tags:
          - direction
          - significance
          - magnitude
          - support
          notes: 标准四拍，方向→显著性+系数→幅度→支持判断
          corpus_path: econometric-models/OLS-FE.md
        - id: r3_ols_four_beat_with_r2_embedded
          skeleton: Hypothesis [x] predicted... Model [y] shows... The R² increases from [value] to [value] when [predictor]
            is added, indicating that [predictor] explains an additional [value]% of the variance. Substantively... Thus,
            Hypothesis [x] is supported.
          paper_count: 3
          status: VERIFIED
          subfield_distribution:
            strategy: 2
            ob_hr: 1
          sources: []
          transferability: medium
          paradigm_exclusivity: OLS/FE 专用
          rhythm_tags:
          - direction
          - significance+r2
          - magnitude
          - support
          notes: 四拍变体：拍2嵌入 R² 变化解释
          corpus_path: econometric-models/OLS-FE.md
        - id: r3_ols_nonsignificant
          skeleton: Hypothesis [x] predicted that [predictor] would be [positive/negative] related to [outcome]. However,
            as shown in Model [y] of Table [z], the coefficient for [predictor] is [positive/negative] but not statistically
            significant (β = [value], p = [value]). Thus, Hypothesis [x] is not supported.
          paper_count: 4
          status: VERIFIED
          subfield_distribution:
            strategy: 2
            ob_hr: 1
            om: 1
          sources: []
          transferability: high
          paradigm_exclusivity: 通用
          rhythm_tags:
          - direction
          - nonsignificance
          - no_support
          notes: 非显著结果的三拍变体（缺幅度解释）
          corpus_path: econometric-models/OLS-FE.md
        - id: r3_ols_interquartile_magnitude
          skeleton: The coefficient for [IV] is [positive/negative] and statistically significant (β = [value], p < [threshold]).
            An interquartile move in [IV] from the 25th percentile to the 75th percentile is associated with a [N] [unit / percentage
            point] [increase/decrease] in [DV]. In untabulated tests, we also find support using [alternative sample], with similar
            economic significance.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Chung_Low_Rust_2022_JAMS
          transferability: medium
          paradigm_exclusivity: OLS/FE 经济显著性，偏态 IV 适用
          rhythm_tags:
          - interquartile_magnitude
          - economic_significance
          - alternative_sample
          corpus_path: econometric-models/OLS-FE.md
      R4:
        description: 交互效应 / 条件效应
        skeleton_variants:
        - id: r4_ols_three_way_marginal_effects_table
          skeleton: Model [N] of Table [X] shows the full specification including the triple interaction among [IV], [moderator_1],
            and [moderator_2]. The coefficient on the triple interaction term is [positive/negative] and significant (β = [value],
            p < [threshold]), consistent with Hypothesis [H_3way]. The marginal effects are reported in Panel [B/C] of Table [Y].
            They show the coefficient on [IV] (δ1) at [one SD below/above] the mean of [moderator_1] and [moderator_2]. As [moderator_1]
            increases, the [positive/negative] effect of [IV] on [DV] becomes [stronger/weaker]; this [amplification/attenuation]
            is [greater/smaller] when [moderator_2] is higher.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Chung_Low_Rust_2022_JAMS
          transferability: medium
          paradigm_exclusivity: 连续调节变量三向交互
          rhythm_tags:
          - three_way_interaction
          - marginal_effects_table
          - continuous_moderator
          corpus_path: econometric-models/OLS-FE.md
        - id: r4_continuous_moderator_dual_quantile_trajectory
          skeleton: Hypothesis [x] posits that [moderator] weakens the effect of [predictor] on [outcome]. The interaction
            term is [negative/positive] and significant (β = [value], p < [threshold]). In practical terms (Figure [Xa]),
            when [moderator] is low, increasing [predictor] from −1 SD to +1 SD leads to a [A]% increase in [outcome],
            but when [moderator] is high, the same increase yields only [B]% [or "virtually no effect"]. Figure [Xb] shows
            the marginal effect of [predictor] decreases steadily across percentiles of [moderator], falling from strongly
            positive at the 1st percentile to near zero [or slightly negative] at the 95th percentile.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Abdurakhmonov_Ingram_Ridge_2026_JOM
          transferability: high
          paradigm_exclusivity: 连续 DV 调节效应，OLS/FE/GEE/panel 均适用
          rhythm_tags:
          - interaction_significance
          - endpoint_sd_contrast_pct
          - percentile_marginal_effect_trajectory
          - shape_verbalization
          corpus_path: econometric-models/OLS-FE.md
        - id: r4_ols_threshold_group_coefficient_difference
          skeleton: Within the [boundary-present] subsample, the focal interaction changes to the predicted direction but is estimated imprecisely. This result alone does not establish a reversal. We therefore directly test whether the interaction coefficient differs across boundary groups; rejection of coefficient equality supports heterogeneity while leaving the within-boundary slope uncertain.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Schumacher_Keck_Tang_2020_SMJ
          transferability: high
          paradigm_exclusivity: split-sample OLS/FE interaction with theory-based external threshold
          rhythm_tags:
          - within_group_imprecision
          - direct_coefficient_difference
          - boundary_heterogeneity
          - honest_reversal_language
          corpus_path: econometric-models/OLS-FE.md
      R5:
        description: 经济 / 实质显著性
        skeleton_variants:
        - id: r5_ols_embedded_magnitude
          skeleton: A [one-SD] increase in [predictor] corresponds to a [value]% [increase/decrease] in [outcome], which represents
            approximately [contextual_comparison].
          paper_count: 8
          status: ROBUST
          subfield_distribution:
            strategy: 3
            ob_hr: 2
            om: 2
            finance: 1
          sources: []
          transferability: high
          paradigm_exclusivity: OLS/FE 专用
          rhythm_tags:
          - magnitude
          - benchmark
          - contextualization
          corpus_path: econometric-models/OLS-FE.md
        - id: r5_ols_external_evidence_practical_importance
          skeleton: A [one-SD] increase in [predictor] corresponds to a [value]% [increase/decrease] in [outcome]. Evidence
            suggests that even small changes in [outcome] can net significant benefits such as [external evidence]. Thus, the
            [value]% change we observe is likely to be particularly important in practice.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Ridge_et_al_2024_AMJ
          transferability: high
          paradigm_exclusivity: OLS/FE 幅度拍5 扩展——外部文献锚定实际重要性
          rhythm_tags:
          - magnitude
          - external_evidence
          - practical_importance
          notes: 先给幅度再追加拍5 实际重要性辩护；外部证据须已发表且场景对应
          corpus_path: econometric-models/OLS-FE.md
      R6:
        description: 非显著 / 混合 / 意外发现
        skeleton_variants: []
      R7:
        description: 稳健性 / 效度 / 敏感性检验
        skeleton_variants:
        - id: r7_ols_threat_based
          skeleton: One concern is that our findings depend on [specific threat]. To address this concern, we re-estimate
            our models using [method]. The results are substantively unchanged (Table [x]), reducing concerns that [threat]
            drives the findings.
          paper_count: 10
          status: ROBUST
          subfield_distribution:
            strategy: 4
            ob_hr: 3
            om: 2
            marketing: 1
          sources: []
          transferability: high
          paradigm_exclusivity: 通用，但因果设计需更具体
          rhythm_tags:
          - threat_positioning
          - test_action
          - unchanged_result
          - threat_reduction
          notes: 标准 threat-based 稳健性四拍
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_narrative_variant
          skeleton: We also examine whether [alternative explanation]. Specifically, we [method description]. Results reported
            in Table [x] show that [main finding] remains [robust/qualitatively similar].
          paper_count: 3
          status: VERIFIED
          subfield_distribution:
            strategy: 2
            om: 1
          sources: []
          transferability: medium
          paradigm_exclusivity: 通用
          rhythm_tags:
          - alternative_explanation
          - method
          - robustness_confirmation
          notes: 叙事型稳健性，弱化 threat 定位但仍明确
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_alternative_dv_falsification
          skeleton: An alternative way to establish causality is to provide a falsification test where we examine [alternative_DV],
            an outcome that is outside the decision-making domain of [focal_actor]. We use the [estimator] specification in [Table
            X], Column [N], except that we replace [DV] with [alternative_DV]. As expected, the [interactions/effects] involving
            [actor-specific variables] are insignificant, because [alternative_DV] is not within the decision-making domain of
            [focal_actor].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Chung_Low_Rust_2022_JAMS
          transferability: medium
          paradigm_exclusivity: 领域外 DV 证伪
          rhythm_tags:
          - falsification
          - alternative_outcome
          - domain_boundary
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_endogeneity_threat_table
          skeleton: Endogeneity is mainly caused by issues relating to omitted variables and simultaneity. We include [control_strategy]
            to rule out omitted variables and use [temporal_strategy] to ensure causal priority. We also use the [DWH test] with
            strong instruments and [cannot reject/reject] the null hypothesis that [IV] is exogenous. This conclusion is validated
            with the [instrument-free Gaussian copula estimation method]. We tabulate complementary tests in Table [X] to rule out
            [threat_1], [threat_2], [threat_3], and [threat_4]. The supporting evidence confirms that there is little reason to
            believe that endogeneity issues are solely driving the results.
          paper_count: 1
