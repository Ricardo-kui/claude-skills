        - id: r7_iv_weak_id_stock_yogo_critical_value
          skeleton: 'A commonly used means to examine IV relevance is to report a Cragg-Donald Wald F-statistic ([citations]),
            which is a weak identification test statistic, and compare it to the 10% critical value of Stock and Yogo (2005).
            The critical value we are required to use is [value], which comes from [table reference] as we have [one IV for
            one potentially exogenous regressor]. This means that, to have no more than 10% of the bias of the regression estimate
            come from our main [FE] analyses in Tables [x] and [y], our Cragg-Donald Wald F-statistic needs to be larger than
            [value]. The Cragg-Donald Wald F-statistic for the IV analysis is [value], which indicates that our IV is relevant
            and unlikely to be weak, at least from a statistical standpoint, similar to previous studies that have used this
            instrument ([citations]).'
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-28: 产品召回为主研究领域，单源足矣)"
