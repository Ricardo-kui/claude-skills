          corpus_path: econometric-models/计数模型.md
        - id: r8_quant_results_qual_mechanism_triangulation
          skeleton: 'Finally, we interviewed [informants] in order to further elucidate and interpret our results. We first
            focus on the main [effect]. Statements from our informants suggest that—without being specifically prompted—they
            considered both of our two postulated mechanisms as relevant. On the one hand, they considered [IV] as signaling
            generic ability, or, in the words of one respondent, [ability quote]. Simultaneously, informants suggested that
            high levels of [IV] were likely to trigger negative evaluations, highlighting [identity] concerns rather than
            imputed ability: [identity quote]. These respondents all reiterated that this negative effect would not apply
            to a normal or reasonable amount of [IV] but only when it became excessive; this provides support for our conjecture
            that lower and moderate levels have little or no negative effects. Overall, our interview evidence provides additional
            support for our hypothesis posing a [curvilinear] effect as a result of two interacting effects, a positive [ability]
            effect, and a negative [identity] effect.'
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Fini_Jourdan_Perkmann_2017_AMJ
          transferability: high
          paradigm_exclusivity: 跨估计器；量化 Results 内嵌访谈三角验证
          rhythm_tags:
          - mechanism_quote_cadence
          - reiterated_pattern
          - boundary_qualifier
          - explanatory_sequential
          notes: 访谈只 corroborate 机制解释不识别效应；显式标探索性（corpus 变体20）
          corpus_path: econometric-models/计数模型.md
        - id: r8_alternative_operationalization_tipping_point_dose_response
          skeleton: 'Next, we repeat the dichotomous analysis in Table [x], but this time we use the actual counts of [predictor]
            as predictor variables, and we use Wald χ² tests to explore coefficient differences. We create indicator variables
            for [one], [two], and [three or more] [predictor units], and treat [zero] as the reference category. We group the
            categories of [high categories] into the same statistical category because of the low number of observations in
            each of these groups. We include this additional model because research indicates that having just one [unit] may
            not be sufficient to change decision-making, but that a tipping point may be reached when multiple [units] are
            added ([citations]). Identifying such a tipping point is not practical using the [continuous] measure; hence, we
            use the discrete counts of [predictor] in this model. As shown in Table [y], we observe consistent results for
            [outcome A] in column [c], and the effect of [predictor] increases as each [unit] is added. Specifically, the coefficient
            for [one] (β = [value], p < [threshold]) is statistically different from and less than the coefficient for [two]
            (β = [value], p < [threshold]) and for [three or more] (β = [value], p < [threshold]). This suggests that it takes
            at least [two] [units] to influence [outcome B] and that adding a [third] moves such decisions along even faster.
            We explore possible reasons for this result in the discussion section.'
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-28: 产品召回为主研究领域，单源足矣)"
          subfield_distribution:
            strategy: 1
          sources:
