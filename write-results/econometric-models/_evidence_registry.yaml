        skeleton_variants:
        - id: f2_phase_opening
          skeleton: The [phase name] phase began around [time/event]. [Actors], motivated by [goal], responded by [action]. This
            established [new agenda/prototype], which was visible on the front stage through [practices].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Lashley_Pollock_2020_ASQ
          transferability: high
          paradigm_exclusivity: 定性过程研究专用
          rhythm_tags:
          - phase_trigger
          - front_stage_action
          corpus_path: econometric-models/定性过程研究.md
      F3:
        skeleton_variants:
        - id: f3_front_stage_backstage_contrast
          skeleton: On the front stage, the collective [action] to signal [value/identity]. While the collective publicly [front-stage
            action], individual organizations often [backstage action] to access [resource]. This created a tension between [collective
            goal] and [organizational survival need].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Lashley_Pollock_2020_ASQ
          transferability: high
          paradigm_exclusivity: 定性过程研究专用
          rhythm_tags:
          - front_stage
          - backstage
          - tension
          corpus_path: econometric-models/定性过程研究.md
      F4:
        skeleton_variants:
        - id: f4_side_stage_negotiation
          skeleton: These debates were side-stage because [why partially visible]. Public confrontations over [issue] revealed
            [fissures among actors], but they also allowed the collective to clarify [norm/expectation].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Lashley_Pollock_2020_ASQ
          transferability: high
          paradigm_exclusivity: 定性过程研究专用
          rhythm_tags:
          - side_stage
          - negotiation
          - norm_clarification
          corpus_path: econometric-models/定性过程研究.md
      F5:
        skeleton_variants: []
      F6:
        skeleton_variants:
        - id: f6_audience_specific_success
          skeleton: We assessed progress with [audience A], [audience B], and [audience C]. With [audience A], we see evidence
            of reduced [stigma/evaluation] in [indicator]. With [audience B], [indicator] suggests [partial/limited change].
            [Audience C] remains [unchanged/resistant]. Thus [outcome] is audience-specific and incomplete.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Lashley_Pollock_2020_ASQ
          transferability: high
          paradigm_exclusivity: 定性过程研究专用
          rhythm_tags:
          - audience_specific
          - bounded_claim
          - success_assessment
          corpus_path: econometric-models/定性过程研究.md
    cross_slot_patterns: []
