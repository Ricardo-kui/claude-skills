          corpus_path: econometric-models/计数模型.md
        - id: r6_count_null_sign_reversal_alternative
          skeleton: Hypothesis [x] predicted a [negative] relationship between [predictor] and [outcome]. The findings in Model
            [y] of Table [z] do not offer support for the hypothesis ([coefficient]; p = [value]). In fact, while not significantly
