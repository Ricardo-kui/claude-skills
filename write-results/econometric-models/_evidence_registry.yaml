          - partial_support
          notes: A significant interaction does not establish both predicted simple-effect signs.
          corpus_path: econometric-models/DiD.md
      R7:
        skeleton_variants:
        - id: r7_did_placebo_permutation
          skeleton: To further assess the robustness of our DiD estimates, we conduct [placebo tests / permutation tests /
            randomization inference]. The results, reported in Table [x], show that [description]. These findings reduce concerns
            that [specific threat].
          paper_count: 6
          status: VERIFIED
          subfield_distribution:
            strategy: 4
            om: 1
            finance: 1
          sources:
          - Lee_Wu_Bednar_ORSC_18968
          - Castellaneta_Conti_Kacperczyk_2017_SMJ
          transferability: high
