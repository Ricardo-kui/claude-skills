      R3:
        skeleton_variants: []
      R7:
        skeleton_variants:
        - id: r7_multistudy_cross_study_synthesis
          skeleton: >
            Across [number] studies, the findings converge on a consistent
            pattern: [summary of supported hypotheses]. This convergence is notable
            because the studies varied [dimensions: ideas, presentation modes, dependent
            variables, audiences]. Study [1] showed [result with audience A and DV1].
            Study [2] replicated the effect with [audience B and DV1]. Study [3] extended
            it to [DV2] and provided evidence for [mechanism]. Study [4] confirmed the
            pattern with [audience C and DV3]. Together, these results suggest that
            [theoretical claim] is robust across [boundary conditions], although [remaining
            limitation/boundary] warrants future research.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Falchetti_Cattani_Ferriani_2022_SMJ
          transferability: high
          paradigm_exclusivity: 多研究论文专用
          rhythm_tags:
          - convergence
          - variation_explicit
          - per_study_summary
          - bounded_claim
          notes: 多研究 Results 必须显式说明什么变了、什么一致、边界在哪里
          corpus_path: econometric-models/多研究.md
      R9:
        skeleton_variants:
        - id: r9_multistudy_opposing_paths_horizon_adjudication
          skeleton: >
            Study [1] separates opposing direct and stakeholder-mediated components; Study [2] tests which component persists across
            [short/long] outcome horizons, reports the total association separately, and preserves unresolved null/causal questions.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Bamberger_Homburg_Wielgos_2021_JM
          transferability: medium
          paradigm_exclusivity: 需要方向相反路径且含时间窗口扩展
          rhythm_tags:
          - decomposition
          - horizon_comparison
          - bounded_claim
          corpus_path: econometric-models/多研究.md
        - id: r9_multistudy_claim_level_evidence_ledger
          skeleton: >
            Summarize evidence by theoretical claim—direct interaction, mediator interaction, conditional indirect effect, duration, and subgroup asymmetry—rather than counting studies as supported or unsupported. Preserve nulls and attach a separate bounded conclusion to each claim.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            ob_hr: 1
          sources:
          - Reinwald_Kanitz_Bamberger_Backmann_Hoegl_2026_ORSC
          transferability: high
          paradigm_exclusivity: 多研究条件过程或证据层级不一致
          rhythm_tags:
          - claim_ledger
          - mixed_direct_effect
          - replicated_mechanism
          - duration_boundary
          corpus_path: econometric-models/多研究.md
        - id: r9_multistudy_limitation_repair_relay
          skeleton: >
            Close Study [N] by stating its bounded contribution, naming one concrete design limitation, and specifying how Study [N+1] changes the design to repair that limitation. At the start of Study [N+1], confirm the repair before adding the next theoretical task.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Ilicic_Brennan_2026_JM
          transferability: high
          paradigm_exclusivity: 多研究论文专用
          rhythm_tags:
          - limitation
          - design_repair
          - study_relay
          - progressive_validity
          notes: "The limitation must be real and the next study must actually repair it; do not use a cosmetic limitation merely to advertise another study."
          corpus_path: econometric-models/多研究.md
    cross_slot_patterns:
    - id: opposing_paths_horizon_adjudication
      status: EMERGING
      source_count: 1
      source_papers:
      - Bamberger_Homburg_Wielgos_2021_JM
      slots:
      - R3
      - R6
      - R9
      note: "Direct/indirect/total decomposition in Study 1 followed by short/long persistence comparison in Study 2."
    - id: claim_level_evidence_ledger
      status: EMERGING
      source_count: 1
      source_papers:
