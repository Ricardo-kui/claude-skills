          - treatment_effect
          - magnitude
          corpus_path: econometric-models/DiD.md
        - id: r3_did_net_effect_then_opposing_contingencies
          skeleton: Table [x] presents the main results. The impact of [treatment] is, overall, [positive/negative]. Based
            on [column], [treatment] [increases/decreases] [outcome] of the average [unit] by about [X]% (covariates at means).
            Whereas [treatment] might produce both positive and negative effects (see below), the [dominant] effect is on
            average stronger, generating a net [increase/decrease].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Castellaneta_Conti_Kacperczyk_2017_SMJ
          transferability: high
          paradigm_exclusivity: Quasi-experimental DiD with opposing contingency hypotheses
          rhythm_tags:
          - average_net_effect
          - opposing_contingencies_preview
          - climax_setup
          notes: Average net effect is narrative setup for bidirectional contingencies; not a third hypothesis.
          corpus_path: econometric-models/DiD.md
        - id: r3_did_interaction_fourbeat_onesd_pct
          skeleton: 'Hypothesis [x] predicted that [treatment] [increases/decreases] [outcome] when [moderator] is [high/low].
            [Column] of Table [x] supports Hypothesis [x]: the [treatment] × [moderator] interaction is [sign] ([p]). As [moderator]
            changes by one SD ([sd]), treatment [augments/reduces] [outcome] by about [Y]%.'
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Castellaneta_Conti_Kacperczyk_2017_SMJ
          transferability: high
          paradigm_exclusivity: DiD/OLS interaction in main table without interaction plot
          rhythm_tags:
          - direction
          - interaction_significance
          - onesd_percent_magnitude
          - support_judgment
          notes: Full four-beat without figure; use Lee two-pole variant if hypothesis predicts opposite simple-effect signs.
          corpus_path: econometric-models/DiD.md
      R4:
        skeleton_variants:
        - id: r4_did_interaction_two_pole_hypothesis_audit
          skeleton: The [treatment] × [moderator] interaction is [direction] and significant. We translate its magnitude and
            plot the treatment effect at both theoretically relevant moderator values. The [high] condition matches the predicted
            [sign], whereas the [low] condition is [observed sign] rather than [predicted sign]. Thus, the contingency receives
