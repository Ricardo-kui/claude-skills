          skeleton: Hypothesis [x] predicted a [negative/positive] relationship between [predictor] and [outcome]. The coefficient
            in Model [y] of Table [z] is [negative/positive] and statistically significant ([coefficient], p = [value]), supporting
            Hypothesis [x]. As [predictor] increases from the mean to one standard deviation above the mean, [outcome] decreases
            by approximately [value]% among [units] that engage in at least some [activity]. Evidence suggests that even small
            changes in [outcome] can net significant benefits such as [external evidence], so the [value]% change is likely
            to be particularly important in practice.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Ridge_et_al_2024_AMJ
          transferability: high
