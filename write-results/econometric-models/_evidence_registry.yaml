          corpus_path: econometric-models/DiD.md
        - id: r7_did_identification_threat_section_battery
          skeleton: 'Validity subsections by threat: Matching (CEM on ex-ante value/risk) → Political economy of [policy]
            (enactment predictors null) → Supply/demand of [units] (treatment uncorrelated with quantities) → Placebo ±[k]
            → Early vs late enactment equality test → Alternative measures. Each subsection names the threat, states the test,
            and concludes robustness/exogeneity.'
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Castellaneta_Conti_Kacperczyk_2017_SMJ
          transferability: high
