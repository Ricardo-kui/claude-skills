      note: Currently rare in corpus; adds a three-part R4 structure for IV papers with mediated moderation.
    - id: csp_IV_2SLS_R7_2e0be584
      pattern: Robustness organized by multiple distinct threats (carryover, simultaneity, exogenous event, nonlinear specification)
        rather than by table罗列.
      from_slot: R7
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: Exemplary threat-based organization for IV papers; each threat maps to a specific identification concern.
    - id: csp_IV_2SLS_R5_7dc67ad4
      pattern: Economic significance is embedded in the General Discussion rather than in a dedicated Results paragraph.
      from_slot: R5
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: JMR style allows R5 to be deferred to Discussion; not a missing slot but a journal-specific placement.
    - id: csp_IV_2SLS_R3_f9b3b5eb
      pattern: 2SLS instrument diagnostics (first-stage F-statistic and Hansen J) embedded within the main effect paragraph
        rather than in a separate first-stage paragraph or appendix.
      from_slot: R3
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: Currently corpus lacks this IV-specific compact rhythm. JMR/marketing style prefers integrated reporting. Recommend
        review for corpus inclusion.
    - id: csp_IV_2SLS_R4_7e7abdf5
      pattern: Subgroup coefficient comparison followed immediately by Wald test, forming a 'coefficient ranking → difference
        test → mechanism conclusion' three-beat rhythm instead of traditional simple slope decomposition.
      from_slot: R4
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: Peer-effect/network-effect specific. Recommend review for corpus inclusion under peer-effect templates.
    - id: csp_IV_2SLS_R7_c9ea2981
      pattern: 'Narrative threat-table matrix (Table 6: Alternative Explanation | Tests and Results) complements traditional
        regression robustness table (Table 7).'
      from_slot: R7
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: Useful for policy-oriented or managerial-audience papers. Recommend as optional variant in robustness templates.
    - id: csp_IV_2SLS_R7_7d6e4bd1
      pattern: Heterogeneity robustness reports conditional effects at mean, +1SD, +1.5SD, and +2SD to demonstrate effect
        persistence across most of the range.
      from_slot: R7
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: New sentence-level template for attenuation-within-range robustness. Recommend inclusion.
