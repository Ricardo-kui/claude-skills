          corpus_path: econometric-models/DiD.md
    cross_slot_patterns:
    - id: csp_did_conditional_effect_full_audit
      pattern: R4 significant interaction → R5 magnitude → conditional-effect plot at both poles → R6 support judgment against
        every directional clause
      from_slot: R4
      to_slot: R6
