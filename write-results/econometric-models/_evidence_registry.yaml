        - id: r7_composite_text_disaggregation
          skeleton: Because [text construct] is a composite of [component 1], [component 2], and [component 3], we examine
            whether the interaction with [baseline predictor] holds for each component separately. Replacing the composite
            with [component 1] leaves the interaction [direction/status], and the [component 2] interaction is also [direction/status].
            However, the [component 3] interaction is [not consistent/opposite/null]. This pattern suggests that the moderating
            effect operates through [facet captured by components 1 and 2] rather than [facet captured by component 3].
          paper_count: 1
