          rhythm_tags:
          - out_of_scope_extension
          - prediction_boundary_restated
          - hardest_case_test
          - concessive_structure
          notes: corpus 事件研究法 变体13（Results Table 2 P3 假设范围外延伸段）；范围外结果与理论冲突时须如实报告为边界发现，不得包装为强检验
          corpus_path: econometric-models/事件研究法.md
      R9:
        description: ''
        skeleton_variants:
        - id: r9_eventstudy_counterintuitive_stakeholder_coda
          skeleton: In contrast to previous studies that have focused on the positive aspects of [strategy] from a [audience_A]
            perspective ([citations]), our findings point to the potential drawback of [strategy] by examining [market_metric].
            Our results indicate that in [crisis_context], though overtly [socially_responsible_label] behavior by a firm
            may generate positive responses from [audience_A], it may be interpreted by the [audience_B] negatively. Therefore,
            firms need to be sensitive to how the [audience_B] might interpret their [proactive_actions].
          verbatim_anchor: In contrast to previous studies that have focused on the positive aspects of proactive recall strategies
            from a consumer's perspective ... it may be interpreted by the stock market negatively.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-29: 用户裁决产品召回主题全部蒸馏成果升 VERIFIED)"
          subfield_distribution:
            marketing: 1
          sources:
          - Chen_Ganesan_Liu_2009_JM
          - chenganesanliu2009
          transferability: high
          paradigm_exclusivity: 事件研究/市场反应论文，双受众解读冲突
          rhythm_tags:
          - stakeholder_contrast
