    - id: csp_IV_2SLS_R3_f9b3b5eb
      pattern: 2SLS instrument diagnostics (first-stage F-statistic and Hansen J) embedded within the main effect paragraph
        rather than in a separate first-stage paragraph or appendix.
      from_slot: R3
      to_slot: ''
      paper_count: 1
