        - id: r7_linear_2sls_nonlinear_main_model
          skeleton: 'Although Equation ([main]), which is used to examine support for Hypothesis [N], is a nonlinear [count
            model] regression, we use linear 2SLS for our IV analysis. We do so because nonlinear IV modeling approaches are
            nonstandardized and there is significantly less consistency in how to implement such models ([citation]) compared
            with linear 2SLS analyses. However, the linear 2SLS analysis leads to highly consistent results for both our [DV1]
            and [DV2] analyses, as described below. In column (1) of Table [z], we report how our control variables and [instrument]
            predict [endogenous predictor]. [Instrument] is highly predictive of [endogenous predictor], as shown not only
            by the significant coefficient for [instrument] (β = [value], p < [threshold]) predicting [endogenous predictor],
            but also due to the large [weak-id statistic] in column (1). In each of the next [six] columns of Table [z], we
            use the instrumented [endogenous predictor] in the second stage of the 2SLS regression as a predictor variable
            in our [DV1] and [DV2] analyses. We find nearly identical results when comparing columns [c2]-[c7] of Table [z]
            with columns [c3]-[c5] of Table [x] and columns [c3]-[c4] of Table [y]. The results in Table [z] indicate that
            [time-variant omitted variable bias] is unlikely creating significant endogeneity problems in our analysis.'
