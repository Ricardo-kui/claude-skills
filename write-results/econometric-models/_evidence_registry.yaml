        - id: r7_iv_exclusion_quantified_exposure_share
          skeleton: 'Although the exclusion criteria cannot be explicitly tested, we propose that [instrument] is unlikely
            to be directly correlated with our dependent variables. First, [instrument] has been used in prior [predictor]
            studies that predict similar dependent variables ([citations]). Second, a direct correlation between [instrument]
            and [outcome] is less likely due to the characteristics of the [source channels] that [generate the instrument].
            More specifically, the argument for nonexclusivity would be that [channel mechanism] not only influences [first-stage
            channel], but also influences how [actors] set [decision tone] and thereby predicts our [outcome] measures. Although
            we cannot completely rule out this possibility, we believe the risk of this is low based upon the small percentage
            of [source channels] that are [outcome-relevant domain]. In particular, there are [N_total] [source channels] across
            the time period of our panel. Of those, only [N_exposed] are [outcome-relevant entities], which is only [share]%
            of them. In other words, well over [100-share]% of the [source channels] are from [unrelated domains] in which
            [outcome] decisions as examined in our study are very uncommon.'
