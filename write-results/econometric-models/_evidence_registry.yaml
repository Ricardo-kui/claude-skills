          - test_action
          - unchanged_result
          - threat_reduction
          notes: 标准 threat-based 稳健性四拍
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_narrative_variant
          skeleton: We also examine whether [alternative explanation]. Specifically, we [method description]. Results reported
            in Table [x] show that [main finding] remains [robust/qualitatively similar].
          paper_count: 3
          status: VERIFIED
          subfield_distribution:
            strategy: 2
            om: 1
          sources: []
          transferability: medium
          paradigm_exclusivity: 通用
          rhythm_tags:
          - alternative_explanation
          - method
          - robustness_confirmation
          notes: 叙事型稳健性，弱化 threat 定位但仍明确
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_alternative_dv_falsification
          skeleton: An alternative way to establish causality is to provide a falsification test where we examine [alternative_DV],
            an outcome that is outside the decision-making domain of [focal_actor]. We use the [estimator] specification in
            [Table X], Column [N], except that we replace [DV] with [alternative_DV]. As expected, the [interactions/effects]
            involving [actor-specific variables] are insignificant, because [alternative_DV] is not within the decision-making
            domain of [focal_actor].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Chung_Low_Rust_2022_JAMS
          transferability: medium
          paradigm_exclusivity: 领域外 DV 证伪
          rhythm_tags:
          - falsification
          - alternative_outcome
          - domain_boundary
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_endogeneity_threat_table
          skeleton: Endogeneity is mainly caused by issues relating to omitted variables and simultaneity. We include [control_strategy]
            to rule out omitted variables and use [temporal_strategy] to ensure causal priority. We also use the [DWH test]
            with strong instruments and [cannot reject/reject] the null hypothesis that [IV] is exogenous. This conclusion
            is validated with the [instrument-free Gaussian copula estimation method]. We tabulate complementary tests in
            Table [X] to rule out [threat_1], [threat_2], [threat_3], and [threat_4]. The supporting evidence confirms that
            there is little reason to believe that endogeneity issues are solely driving the results.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Chung_Low_Rust_2022_JAMS
          transferability: medium
          paradigm_exclusivity: OLS/FE 内生性稳健性表叙事
          rhythm_tags:
          - endogeneity
          - dwh_test
          - gaussian_copula
          - threat_table
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_epistemic_map_specification_curve
          skeleton: To further assess the robustness of our findings to analyst degrees-of-freedom, we develop an epistemic
            map of the coefficient on [predictor] (King, Goldfarb, & Simcoe, 2021). We plot the coefficient and 95% CI across
            all combinations of [specification dimensions], yielding [N_total_models] specifications. Figure [X] shows that
            all [N_total_models] coefficients are [of predicted sign], and [N_significant] are significant at the [threshold]
            level. The coefficients cluster tightly around the main estimate (β ≈ [value]).
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Lee_Wang_2026_JOM
          transferability: high
          paradigm_exclusivity: 跨聚类/样本/控制集的 specification-choice 稳健性可视化（distinct from threat-based）
          rhythm_tags:
          - specification_curve
          - analyst_degrees_of_freedom
          - visual_robustness
          - sign_stability
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_ols_front_loaded_rir_naive_cure
          skeleton: 'A concern in testing how [characteristic] affects [outcome] is endogeneity, especially from nonrandom
            [selection]. First, we use robustness of inference to replacement (RIR): to alter our inferences for [outcome
            1], [N] observations would have to be replaced with observations for which there is an effect of zero, and for
            [outcome 2], [N] observations. Next, we pair ''naive'' analyses that do not use tools to ''cure'' endogeneity
            with analyses that attempt such a cure [e.g., two-stage residual inclusion], finding estimates are consistent
            across approaches.'
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Ridge_et_al_2024_AMJ
          transferability: high
          paradigm_exclusivity: OLS/FE 前端识别防御——RIR 替换计数 + naive-vs-cure 2SRI 配对
          rhythm_tags:
          - endogeneity
          - rir_replacement_count
          - naive_vs_cure
          - two_stage_residual_inclusion
          - front_loaded
          notes: 区别于变体15（RIR+Oster+CEM 三件套五威胁）——RIR 量化替换计数 + naive-vs-cure 双轨 + 前置到主结果之前
          corpus_path: econometric-models/OLS-FE.md
        - id: r7_three_threat_sectional_robustness
          skeleton: Our first robustness check addressed the possibility that [threat_1 (endogeneity or selectivity)] affected
            our results. [Treatment] may be conditional on [selection mechanism] ([citations]). To address this possibility,
            we re-estimated our models on the subsample of our data when [condition occurs]. Overall, the results do not
            suggest that [threat_1] biased our results (see Online Appendix [X]). Our second robustness check assessed the
            indirect paths from [treatment] to [outcomes] using [SEM/GSEM commands]. The [alternative] model differs from
            our [baseline] approach in that it allows for correlations among the error terms of our [equations]. The [alternative]
            results are largely similar to our reported results. Finally, to further investigate the construct validity of
            our [construct] variables, we re-estimated the models substituting the focal dependent variables with [alternative
            DV 1] and [alternative DV 2], respectively. As expected, we find that [treatment] significantly [affects] [alternative
            DV 1], especially when [moderator condition].
          paper_count: 1
          status: VERIFIED
          verification_basis: 'expert_audit_override (user 2026-08-29: 用户点名喜爱本篇，单源足矣)'
          subfield_distribution:
            strategy: 1
          sources:
          - post_2022_women_tmt_strategic_renewal
          transferability: high
          paradigm_exclusivity: 独立 Robustness Checks 小节（falling action）的三威胁小节化组织
          rhythm_tags:
          - threat_sectioning
          - selectivity_subsample
          - sem_alternative_estimator
          - alternative_dv_construct_validity
          notes: 'EXTEND r7_ols_threat_based（corpus OLS-FE.md 变体66）：按威胁逐小节推进（选择性/内生性→替代估计 SEM→构念效度
            替代 DV），每威胁以"结果不变"句收口；稳健性独立成节而非机械罗列 Table 3/4/5'
          corpus_path: econometric-models/OLS-FE.md
      R8:
        description: 补充 / 事后 / 机制分析
        skeleton_variants:
        - id: r8_ols_mediation_bk_bootstrap_pct_instrumented
          skeleton: To examine whether [mediator] transmits the effect of [predictor] on [outcome], we adopt two complementary
            approaches. First, following Baron & Kenny (1986), we estimate the a-path ([predictor]→[mediator]) and b-path
            ([mediator]→[outcome]|[predictor]). The product a×b ≈ [value] is the indirect effect, accounting for ~[%] of the
            total effect. Second, a non-parametric bootstrap with [N] replications yields an indirect effect of [value] (95%
            CI [[lower],[upper]], excluding zero). Because the mediator may be endogenous, [Model 2] instruments [mediator]
            with [instrument(s)].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Lee_Wang_2026_JOM
          transferability: high
          paradigm_exclusivity: 观察面板 OLS/FE 中介——Baron-Kenny + bootstrap CI + indirect-as-%-of-total + 工具变量中介
          rhythm_tags:
          - causal_steps_baron_kenny
          - bootstrap_ci
          - indirect_as_pct_of_total
          - instrumented_mediator
          corpus_path: econometric-models/OLS-FE.md
        - id: r8_ols_construct_validity_directed_triangulation
          skeleton: We evaluate three rival interpretations of [latent trait] through a nomological opposite-pattern test,
            a same-actor cross-context stability test, and a short-horizon temporal-stability test. Convergence strengthens
            the proposed interpretation but does not uniquely identify the latent construct.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Schumacher_Keck_Tang_2020_SMJ
          transferability: medium
          paradigm_exclusivity: archival latent-trait proxies in executive/actor panel studies
          rhythm_tags:
          - rival_interpretation
          - nomological_contrast
          - cross_context_stability
          - temporal_stability
          corpus_path: econometric-models/OLS-FE.md
        - id: r8_shared_mediator_outcome_branch_ledger
          skeleton: Report the shared a-path once, then audit each outcome branch separately with its direct relationship,
            estimated indirect effect and confidence interval, and hypothesis verdict. Preserve unsupported branches and narrow
            the mechanism claim to the outcomes for which the interval excludes zero.
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-29: 用户裁决产品召回主题全部蒸馏成果升 VERIFIED)"
          subfield_distribution:
            marketing: 1
          sources:
          - Kashmiri_Nicol_Arora_2017_JAMS
          transferability: high
          paradigm_exclusivity: Cross-estimator multi-outcome mediation; outcomes may be count, fractional, binary, or continuous
          rhythm_tags:
          - shared_a_path
          - branch_specific_indirect_effect
          - unsupported_path_preserved
          - mechanism_scope_narrowing
          notes: Direct support for an outcome does not rescue a failed mediation hypothesis. Prefer indirect-effect intervals
            to legacy Baron-Kenny condition counting.
          corpus_path: econometric-models/SEM-moderated-mediation.md
        - id: r8_ols_strategy_complete_mediation_kenny_signal
          skeleton: 'A question, then, is whether these [firm_characteristics] influence firms'' choice of [strategy]. If
            we obtain significant effects of [firm_characteristics] on strategy choice, it would indicate that [strategy],
            as a signal to the stock market, mediate the effects of [firm_characteristics] on [AR] ([Kenny citation]). We
            estimate a probit on Pr([strategy]). [Key_firm_char] is significantly [negative/positive], suggesting that [theory_buffer_claim].
            More important, [AR_table] and [probit_table] jointly show the mediation effects: (1) the direct impact of [strategy]
            on [AR] is significant, and (2) [firm_characteristics] that influence strategy choice, especially [key_firm_char],
            do not affect [AR] when [strategy] is included. Based on the steps that [Kenny et al.] outline, these effects
            indicate that [strategy] completely mediate the influences of [firm_characteristics] on [AR]. Therefore, the stock
            market consolidates the impact of various firm and product characteristics and reacts mainly to a firm''s [strategy]
            as a signal to evaluate the potential consequence of the crisis.'
          verbatim_anchor: Based on the steps that Kenny, Kashy, and Bolger (1998) outline, these effects indicate that product-recall
            strategies completely mediate the influences of firm characteristics on abnormal returns.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-29: 用户裁决产品召回主题全部蒸馏成果升 VERIFIED)"
          subfield_distribution:
            marketing: 1
          sources:
          - Chen_Ganesan_Liu_2009_JM
          - chenganesanliu2009
          transferability: medium
          paradigm_exclusivity: 截面 AR/CAR + 二元策略中介
          rhythm_tags:
          - mediation_question
          - probit_choice
          - kenny_joint_read
          - complete_mediation
          - signal_interpretation
          notes: 'LEGACY: 不得将 Baron–Kenny 条件计数升级为现代间接效应证据；须补 indirect-effect interval 或显式标 legacy。Kashmiri 诚实边界继续有效。'
          corpus_path: econometric-models/OLS-FE.md
        - id: r8_two_step_predicted_mediator_dual_path_convergence
          skeleton: Hypothesis [H6] anticipated that, following [treatment], [outcome_A] would [grow] via an [increase]
            in [mediator_A]. Supporting Hypothesis [H6] (Table [X], Model [N]), the estimated coefficient for the predicted
            shift in [mediator_A] (obtained from Model [M] in Table [Y]) is statistically significant (b = [value], p = [value]).
            To assess whether the shifts in [mediators] in fact mediate the relationships between [treatment] and [outcomes],
            we use the procedure described in [Preacher, Rucker, and Hayes (2007)]. Because we have moderated mediations,
            we use the predicted change in [mediator_A] and [mediator_B] from Models [M1] and [M2] for the [moderator_1]
            moderator (and from Models [M3] and [M4] for the [moderator_2] moderator) in the [outcome] models. Using bias-corrected
            confidence intervals for the two indirect effects, we find that the indirect effects of [treatment] (a) on [outcome_A],
            via a [rise] in [mediator_A], and (b) on [outcome_B], via a [drop] in [mediator_B], are statistically significant
            (z = [value], p = [value]; z = [value], p = [value], respectively) when [moderator condition]. Given the difficulties,
            statistically, in detecting moderated mediation in analyses relying on coarse-grained, secondary data, we interpret
            our pattern of findings as consistent with our theory that [treatment] affects [outcome], at least partially,
            via shifts in [mediators], conditional on [moderator_1] and [moderator_2].
          paper_count: 1
          status: VERIFIED
          verification_basis: 'expert_audit_override (user 2026-08-29: 用户点名喜爱本篇，单源足矣)'
          subfield_distribution:
            strategy: 1
          sources:
          - post_2022_women_tmt_strategic_renewal
          transferability: high
          paradigm_exclusivity: 面板 FD-OLS 两步预测中介（generated regressor）+ 双 moderator 条件间接效应 + 双路径汇合收束
          rhythm_tags:
          - path_bearing_attribution
          - predicted_value_traceability
          - moderator_model_mapping
          - dual_indirect_effect_ci
          - calibrated_claim_close
          notes: 'corpus SEM-moderated-mediation.md 变体8（ADD，承接 R3/R4 双路径铺垫、收敛全篇双路径回答）：区别于 r8_shared_mediator_outcome_branch_ledger
            （变体7，SEM 同时估计 + 共享 a-path 分支审计）——本变体中介由第一阶段模型拟合值操作化（两步法），双 moderator 条件间接效应
            以 Preacher-Hayes bias-corrected CI 并行报告，粗粒度二手数据功效受限时以"at least partially ... conditional on
            ..."校准收束；generated-regressor SE 须带诚实边界'
          corpus_path: econometric-models/SEM-moderated-mediation.md
