        - id: r7_iv_threat_based_robustness
          skeleton: '[Threat sentence]. A common approach to this problem is using two-stage least squares modeling ([citation]).
            Regarding [predictor_A], we used two instruments: [Instrument_1] and [Instrument_2]. [Instrument_1] ([citation])
            exploits the heterogeneous effect of a nationwide regulatory change or exogenous shock ([citation]; [citation]).
            Known also as a shift-share instrument, it acts as a difference-in-difference analysis, with the shock affecting
            the independent variable ([citation]). [Rationale for instrument validity]. Regarding [Instrument_2], our rationale
            is that it primarily determines [predictor] ([citation]). However, any effect on [outcome], if present, operates
            solely through [predictor]. With respect to [predictor_B], we used another two instruments: [Instrument_3] and
            [Instrument_4]. Both variables can largely influence [predictor_B]; however, their effects on [outcome], if present,
            are likely to operate exclusively through [predictor_B]. As reported in [Appendix Table], we used the Sargan-Hansen
            test to examine the validity of these instruments ([citation]). The test results suggest that our instruments
            are exogenous (Hansen’s J chi2([df]) = [value], p = [threshold]). Furthermore, the second-stage regression models
            produced results consistent with those of the main models.'
