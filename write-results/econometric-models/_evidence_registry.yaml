      verification_basis: "expert_audit_override (user 2026-08-29: 产品召回主题全库升 VERIFIED，判别口径=DV或IV含召回/产品伤害危机；Singh & Grewal 2023 JMR = Lobbying and Product Recalls, DV=recalls)"
      note: Currently rare in corpus; adds a three-part R4 structure for IV papers with mediated moderation.
    - id: csp_IV_2SLS_R7_2e0be584
      pattern: Robustness organized by multiple distinct threats (carryover, simultaneity, exogenous event, nonlinear specification)
        rather than by table罗列.
      from_slot: R7
      to_slot: ''
