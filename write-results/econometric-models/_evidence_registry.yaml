    - id: ap_qualitative_overclaim
      pattern: 将局部、受众区分的进展泛化为"去 stigma 已经成功"
      severity: high
      affected_slots:
      - F6
      source_count: 0
    honesty_boundaries:
    - id: hb_qualitative_no_causal_language
      boundary: 定性过程研究不得使用因果推断语言（causes/leads to/effect of）
      allowed_language: suggests / is consistent with / indicates / reflects
