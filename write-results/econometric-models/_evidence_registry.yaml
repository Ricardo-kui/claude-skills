          transferability: high
          paradigm_exclusivity: 计数模型专用，二值化复制→剂量化指示变量→Wald χ² 阈值发现
          rhythm_tags:
          - dose_response_indicators
          - wald_chi2_coefficient_difference
          - tipping_point_theory_refinement
          - category_collapsing_disclosure
          notes: 先二值化复制主结果再剂量化揭示阈值；阈值显式声明为连续测度做不到；低观测类合并须交代观测数依据；阈值只作理论精化不作主检验（corpus 变体27）
          corpus_path: econometric-models/计数模型.md
