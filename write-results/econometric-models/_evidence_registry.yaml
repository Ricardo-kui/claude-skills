        - id: r5_multiplicative_sd_percent_count_translation
          skeleton: 'To provide further insight into our results, we interpret the beta coefficients from the [model retaining
            all observations], as that model is inclusive of all [units] in the study and does not drop any observations.
            Beta coefficients for [count model] models are interpreted multiplicatively after exponentiation ([citation]).
            Thus, the [direction] beta coefficient for [predictor] in column [c] can be interpreted as the following: a one
            standard deviation increase in [predictor] is associated with a [X]% [increase/decrease] in [outcome] in a [unit]-[period],
            which corresponds to approximately [N] [additional/fewer] [outcome] per [unit] across the [T]-[period] panel.
            Similarly, we can interpret the [direction] coefficient in column [c] as a one standard deviation increase in
            [predictor] is associated with a [Y]% [reduction/increase], or approximately [M] [fewer/more] [outcome] across
            the panel. Collectively, using both [model A] and [model B], these results indicate robust support for Hypotheses
            [N1, N2, and N3]. More precisely, the relationships persist when analyzing only [within-unit effects in model
            A], or when pooling [within- and across-unit effects in model B].'
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-28: 产品召回为主研究领域，单源足矣)"
