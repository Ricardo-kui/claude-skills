          - placebo_outcome
          - reverse_causality
          notes: 前瞻式总起先列威胁清单，逐 threat 以收束句关闭（"help alleviate concerns" / "provides support for our contention"）（corpus 变体25）
          corpus_path: econometric-models/计数模型.md
      R8:
        description: 补充 / 事后 / 机制
        skeleton_variants:
        - id: r8_count_alt_operationalization_mechanism_adjudication
          skeleton: 'Furthermore, we explore whether [evaluators] consider [IV] relative to [benchmark] (i.e., as a proportion
            of [combined measure] rather than as an absolute value). Rather than a deviation from [identity], a relative measure
            may capture the [rival mechanism], suggesting a different mechanism from [focal mechanism]. To test this possibility,
            we compute further iterations of our models with an alternative specification of [IV], operationalized as [relative
            operationalization]. We find the level of significance of our explanatory variables to be lower or absent with
            this alternative specification. We interpret this finding as discounting the [rival mechanism] argument and further
            supporting the [focal mechanism]: [mechanism rationale].'
          paper_count: 1
