        - id: r3_count_cross_model_consistency
          skeleton: Results are similar across models. The main effect of [predictor] is consistently significant and [direction].
            As [predictor] increases, [units] are generally [less/more] likely to [outcome]. However, the interaction between
            [predictor] and [moderator] is consistently [direction] and significant, suggesting that [moderator] moderates
            the direct effect of [predictor]. When [field_condition], [units] become [more/less] likely to [outcome]. This
