          corpus_path: econometric-models/DiD.md
      R3:
        skeleton_variants:
        - id: r3_did_baseline_estimate
          skeleton: Model [y] provides the baseline DiD estimate. The coefficient on [treatment_dummy] is [positive/negative]
            and statistically significant (β = [value], p < [threshold], 95% CI [[lower], [upper]]), indicating that [treatment]
            [increases/decreases] [outcome] by approximately [value] [units/percent]. Thus, Hypothesis [x] is supported.
          paper_count: 6
          status: ROBUST
          subfield_distribution:
            strategy: 3
            om: 2
            finance: 1
          sources:
          - Lee_Wu_Bednar_ORSC_18968
          transferability: high
          paradigm_exclusivity: DiD 专用
          rhythm_tags:
