        - id: r7_ols_epistemic_map_specification_curve
          skeleton: To further assess the robustness of our findings to analyst degrees-of-freedom, we develop an epistemic
            map of the coefficient on [predictor] (King, Goldfarb, & Simcoe, 2021). We plot the coefficient and 95% CI across
            all combinations of [specification dimensions], yielding [N_total_models] specifications. Figure [X] shows that all
            [N_total_models] coefficients are [of predicted sign], and [N_significant] are significant at the [threshold] level.
            The coefficients cluster tightly around the main estimate (β ≈ [value]).
