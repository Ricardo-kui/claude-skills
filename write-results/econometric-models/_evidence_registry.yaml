  实验:
    display_name: 实验 (Experiment / ANOVA / Lab/Field)
    usage_stats:
      revise: 0
      reject: 0
      last_critique: null
      common_revise_reasons: []
    forced_slots:
    - R2
    - R3
    - R7
    high_risk_missing:
      R2: 缺排除标准 / 操纵检验
      R3: 只报 p 值不报告效应量 (Cohen's d / η²)
    slots:
      R2:
        skeleton_variants: []
      R3:
        skeleton_variants:
        - id: r3_experiment_anova_four_beat
          skeleton: Hypothesis [x] predicted that [condition A] would elicit higher
            [DV] than [condition B] among [audience]. We first checked for outliers
            using [rule] and [removed/retained] [number]. A one-way ANOVA revealed
            a significant effect of [IV] on [DV], F([df1], [df2]) = [value], p [relation]
            [threshold], η² = [value]. Participants in [condition A] reported higher
            [DV] (M = [value], SD = [value], 95% CI [[lower], [upper]]) than those
            in [condition B] (M = [value], SD = [value], 95% CI [[lower], [upper]]).
            These results support Hypothesis [x].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Falchetti_Cattani_Ferriani_2022_SMJ
          transferability: high
          paradigm_exclusivity: 实验/ANOVA 专用
          rhythm_tags:
          - outlier_check
          - f_statistic
          - eta_squared
          - means_ci
          - hypothesis_support
          notes: 实验 ANOVA 必须报告 η² 和条件均值/CI
          corpus_path: econometric-models/实验.md
        - id: r3_experiment_mediation_hayes
          skeleton: To examine whether [mediator] explains the effect of [IV] on [DV],
            we first tested whether [IV] influenced [mediator]. A one-way ANOVA showed
            that [condition A] led to [higher/lower] [mediator] (M = [value], SD =
            [value]) than [condition B] (M = [value], SD = [value]), F([df1], [df2])
            = [value], p [relation] [threshold]. We also tested [alternative mediator
            1] and [alternative mediator 2] and found no significant effect of [IV].
            We then estimated the indirect effect using Hayes's PROCESS model [4] with
            [number] bootstrap iterations. The indirect effect was b = [value], SE =
            [value], 95% CI [[lower], [upper]].
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Falchetti_Cattani_Ferriani_2022_SMJ
          transferability: high
          paradigm_exclusivity: 实验中介专用
          rhythm_tags:
          - mediator_anova
          - alternative_mediators
          - process_indirect_effect
          - bootstrap_ci
          notes: Hayes PROCESS + bootstrap CI 是实验中介报告标准
          corpus_path: econometric-models/实验.md
        - id: r3_event_conditional_indirect_direct_inconsistent
          skeleton: >
            Report [X × event → mediator], [mediator → outcome], and the bootstrapped conditional indirect effect separately before and after the event. Then report the direct interaction independently; if it is null or inconsistent across studies, conclude that the event-contingent mechanism replicated without claiming replication of the direct behavioral effect.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            ob_hr: 1
          sources:
          - Reinwald_Kanitz_Bamberger_Backmann_Hoegl_2026_ORSC
          transferability: high
          paradigm_exclusivity: 事件条件调节中介；实验/多层路径模型
          rhythm_tags:
          - mediator_interaction
          - conditional_indirect_ci
          - direct_effect_separation
          - bounded_claim
          notes: "Indirect effects may be estimable without a significant direct interaction, but they do not rescue the direct-effect hypothesis."
          corpus_path: econometric-models/SEM-moderated-mediation.md
      R4:
        skeleton_variants:
        - id: r4_experiment_three_condition_intervention_decomposition
          skeleton: >
            Report the omnibus [group × three-level intervention] interaction, then decompose it with prespecified contrasts in this order: group differences within each condition, intervention contrasts within the focal group, and the same contrasts within the comparison group. Conclude with the bounded claim about which group changed and where the baseline difference narrowed.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Ilicic_Brennan_2026_JM
          transferability: high
          paradigm_exclusivity: 三水平随机干预 × 连续或二元组别变量
          rhythm_tags:
          - omnibus_interaction
          - between_group_contrasts
          - within_group_contrasts
          - stable_comparison_group
          - bounded_claim
          notes: "A significant-vs-nonsignificant contrast is not a difference test; use the interaction or direct contrasts. A three-level treatment is not automatically a three-way interaction."
          corpus_path: econometric-models/实验.md
      R7:
        skeleton_variants: []
      R8:
        skeleton_variants:
        - id: r8_serial_mediation_competing_order_sensitivity
          skeleton: >
            Report the proposed serial indirect effect and its bootstrap CI, then estimate the reversed mediator sequence as a competing-order sensitivity check. If the competing CI includes zero, state that no clear evidence was detected for that sequence; do not claim that causal or temporal order has been established.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            marketing: 1
          sources:
          - Ilicic_Brennan_2026_JM
          transferability: high
          paradigm_exclusivity: measured serial mediation / PROCESS Model 6
          rhythm_tags:
          - serial_indirect_effect
          - competing_order
          - bootstrap_ci
          - causal_boundary
          notes: "Significant versus nonsignificant indirect paths need not differ. Cross-sectional path ordering, especially when Y is measured before the mediators, cannot establish causal sequence."
          corpus_path: econometric-models/SEM-moderated-mediation.md
    cross_slot_patterns: []
    anti_patterns: []
    honesty_boundaries: []
