        - id: r7_text_measure_robustness_bundle
          skeleton: We assess whether the findings depend on specific choices in measuring
            [text construct]. First, to address the concern that the results are sensitive
            to [dictionary/tool choice], we re-estimate the models using [alternative
            dictionary/tool]; the focal interactions remain [direction/status]. Second,
            to address [topic granularity/aggregation rule], we re-estimate using [alternative
            topic count/aggregation method]; the results are [consistent/qualified].
            Third, to address [component validity], we examine [components] separately
            and find that [pattern]. Together, these checks reduce concern that the
