      pattern: 子群分析中不仅报告分样本系数，还使用 Wald chi-square 检验直接比较系数差异，并进一步指出低 discretion 组中主效应完全消失（β≈0, p>0.10），从而将机制验证从‘差异显著’推进到‘效应由某子群完全解释’。
      from_slot: R4
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 这是一种比常规交互项更强的机制验证策略，值得在 om / ob_hr 领域推广。
    - id: csp_生存分析_R8_292a93a9
      pattern: 在生存分析/hazard模型中引入CEM匹配作为稳健性检验，而非PSM。作者明确对比了CEM与PSM的区别（King & Nielsen 2019），并基于四个理论驱动的协变量进行粗化匹配，报告ATE而非 hazard
        ratio。
      from_slot: R8
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 为 hazard / 事件历史类论文提供了样本选择稳健性的可迁移范式，尤其是当处理变量为 tenure 分段时。
    - id: csp_生存分析_R9_21eee76e
      pattern: 针对‘产品质量随 tenure 提升’这一替代解释，作者设计了三种 operational performance 测量（COGS变化、10-K文本运营改善词频、CEO运营背景），并以交互项形式逐一检验。所有交互项均不显著，从而保留原解释。
      from_slot: R9
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 这是处理‘潜在混淆机制’的系统性方法，适用于任何以 tenure / experience 为核心自变量的研究。
    - id: csp_生存分析_R2-R5_129c3ff2
      pattern: 全文结果部分采用‘假设驱动’的叙事结构：每个假设对应一个表格（Table 6/7/8），并在表格之间插入系数图（Figure 1a/b/c），形成‘表格+图形’的交替节奏，而非一次性堆砌所有回归结果。
      from_slot: R2-R5
      to_slot: ''
      paper_count: 1
      status: EMERGING
      note: 这种节奏适合假设数量较少（3个）且每个假设有明确机制的故事线，可作为 3-hypothesis 论文的参考模板。
