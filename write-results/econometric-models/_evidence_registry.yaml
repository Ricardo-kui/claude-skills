          skeleton: Before turning to the main results, Figure [x] shows the event-study estimates, which provide a test of
            the parallel trends assumption. The pre-treatment coefficients are small and statistically indistinguishable from
            zero, supporting the validity of our DiD design.
          paper_count: 6
          status: ROBUST
          subfield_distribution:
            strategy: 3
            om: 2
            finance: 1
          sources:
