      R5:
        skeleton_variants:
        - id: r5_count_moderation_translation
          skeleton: Because the interaction term is in log-count units, we translate it into predicted [outcome] differences.
            At the minimum observed value of [moderator], [high baseline group] is predicted to [experience] approximately
            [N] fewer [outcomes] than [low baseline group]. At the maximum observed value of [moderator], this gap narrows
