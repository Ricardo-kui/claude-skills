        - id: r7_theory_derived_posthoc
          skeleton: The theoretical logic motivating Hypothesis [x] suggests that [mechanism]. As a result, [behavioral_implication].
            [Previous_citation]. Thus, we conducted an analysis to determine whether [testable_derivation]. [Table_x] presents
            [estimator] models estimating [derived_DV]. The [direction] and significant [effect_type] suggests that [theoretical_conclusion].
