    slots:
      R2:
        description: ''
        skeleton_variants:
        - id: r2_eventstudy_test_statistic_triple_endorsement
          skeleton: 'To assess the significance of [excess returns] for each group, we used the following test statistic suggested
            by [author] ([year]): [formula], where [A_t] is the average cumulated [return measure] over the relevant observation
            period, and [S(A_t)] is the time-series standard deviation of [excess returns] over a [N]-day estimation period.
            When [assumptions hold], this statistic has a [distribution] under the null hypothesis. Moreover, simulation studies
            suggest that this test statistic is well-specified for samples of [N] or more and for observation periods of various
            lengths ([citations]). This estimation approach is used in most of the prior event studies of [the event] and has
            become a standard event methodology in the [field] literature ([citations]).'
          verbatim_anchor: Moreover, simulation studies suggest that this test statistic is well-specified for samples of 50
            or more and for observation periods of various lengths (Dodd and Warner, 1983; Brown and Warner, 1985).
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: 'expert_audit_override (user 2026-08-28: 单源足矣)'
          subfield_distribution:
            strategy: 1
          sources:
          - westphal_zajac_1998_symbolic_management
          transferability: high
          paradigm_exclusivity: 事件研究分组 AR/CAR 显著性检验统计量的方法选择声明
          rhythm_tags:
          - test_statistic_formula
          - triple_endorsement
          - simulation_well_specified
          - convention_precedent
          notes: corpus 事件研究法 变体9（Analysis §Stock Market Reactions）；原始出处→模拟证据适用域→惯例先例三重背书，公式逐符号给实质定义
          corpus_path: econometric-models/事件研究法.md
        - id: r2_grouped_car_column_navigation_adjudication
          skeleton: The results in column [1] indicate significantly positive [excess returns] for all [adopting units] across
            all [N] time intervals, providing consistent evidence for [a favorable market reaction] to [the event], but the
            results reported in columns [2] and [3] of table [x] support H[x], which predicted that [units] would experience
            [a positive reaction] to [the event], whether or not [the implementation condition]. [Excess returns] are significantly
            positive for [group A] and for [group B] across all [N] intervals examined.
          verbatim_anchor: Excess returns are significantly positive for substantive adopters and for symbolic adopters across
            all four intervals examined.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: 'expert_audit_override (user 2026-08-28: 单源足矣)'
          subfield_distribution:
            strategy: 1
          sources:
          - westphal_zajac_1998_symbolic_management
          transferability: high
          paradigm_exclusivity: 分组均值 CAR（非回归系数）为主检验的事件研究表格导航→假设裁决
          rhythm_tags:
          - column_navigation
          - baseline_vs_groups
          - hypothesis_adjudication
          - all_window_consistency
          notes: corpus 事件研究法 变体10（Results Table 2 P1）；column 1 是铺垫不是主检验；假设复述自带理论尾从句（whether or not implemented）
          corpus_path: econometric-models/事件研究法.md
      R3:
        description: ''
        skeleton_variants:
        - id: r3_eventstudy_subgroup_ar_multitest_contrast
          skeleton: Table [X], Panel A, shows that the average abnormal return for [strategy_A] is [signed_pct], which is
            consistently significant in the common t-test, the t-Patell test, and the t-BMP test. In contrast, none of the
            three tests are significant for [strategy_B]. We further compare the abnormal returns by conducting a two-sample
            t-test and a nonparametric Wilcoxon rank-sum test. As Table [X], Panel B, shows, [strategy_A] have significantly
            more negative abnormal returns than [strategy_B]. The difference is [signed_pct] (p < [threshold]). Overall, these
            results provide consistent evidence that [strategy_A] are associated with significantly more negative abnormal
            returns than [strategy_B]. On average, the abnormal return for [strategy_A] is approximately [N] percentage points
            lower than that for [strategy_B] (p < [threshold]). Thus, Hypothesis [H] is supported, suggesting that the stock
            market interprets [strategy_A] as a signal of [severe_loss_construct].
          verbatim_anchor: Therefore, significantly negative abnormal stock return is associated with proactive recalls but
            not with passive recalls. ... Thus, our hypothesis is supported, suggesting that the stock market interprets a
            proactive product-recall strategy as a signal of severe financial losses.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-29: 用户裁决产品召回主题全部蒸馏成果升 VERIFIED)"
          subfield_distribution:
            marketing: 1
          sources:
          - Chen_Ganesan_Liu_2009_JM
          - chenganesanliu2009
          transferability: high
          paradigm_exclusivity: 事件研究法分组 AR 主检验（非回归）
          rhythm_tags:
          - direction
          - multi_test_significance
          - between_group_contrast
          - magnitude_pp
          - support
          - signal_interpretation
          notes: 填补 Patell+分组 CAR 主检验缺口；对照策略 null 正面报告；百分点幅度嵌入 R3
          corpus_path: econometric-models/事件研究法.md
      R4:
        description: ''
        skeleton_variants:
        - id: r4_moderation_group_comparison_ttest_adjudication
          skeleton: '[H#] predicted that when [the event] is accompanied by [the moderator], it would engender a more favorable
            [response], irrespective of [the implementation condition]. Results on [the outcome] for cases of [the event] with
            and without [the moderator] provide strong and consistent evidence for H#: [events] providing [the moderator] elicit
            more positive [responses] than [events] without [the moderator], and this holds true for both [category A] and [category
            B]. T-tests indicated highly significant differences between [category A] with [the moderator] and [category A]
            without [the moderator] for each of the [N] [windows]; values ranged from [t1] to [t2].'
          verbatim_anchor: T-tests indicated highly significant differences between symbolic adoption with an agency explanation
            and symbolic adoption without an agency explanation for each of the four time windows; values ranged from 8.69 to
            11.98.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: 'expert_audit_override (user 2026-08-28: 单源足矣)'
          subfield_distribution:
            strategy: 1
          sources:
          - westphal_zajac_1998_symbolic_management
          transferability: high
          paradigm_exclusivity: 二分调节×二分处理的分组均值对比裁决（四格拆分的 Results 侧兑现）
          rhythm_tags:
          - direction_then_test
          - group_ttest
          - per_window_replication
          - range_reporting
          notes: corpus 事件研究法 变体11（Results Table 2 P2）；组间 t 检验须在 Methods 声明配套设计；区间式报告仅适用同向同显著多窗结果
          corpus_path: econometric-models/事件研究法.md
        - id: r4_main_effect_protection_after_interaction
          skeleton: 'The fact that [events] without [the moderator] show weaker positive [responses] should not be interpreted
            as suggesting that [the moderator] is more important than [the event] itself. [The event], whether [form A or form
            B], is a prerequisite to providing [the moderator], since [the moderator] points specifically to [the event] in
            claiming that [the theoretical claim]. Also, as [methodologist] ([year]: [pages]) noted in their discussion of main
            effects and interaction effects, knowing that a positive relationship between [X] and [Y] is greater in the presence
            of [W] does not ''diminish the utility of the information'' that there is an average main effect. The results show
            that [the event] leads to [the response] (H[x]) and that the presence of [the moderator] is a powerful moderator
            of that positive relationship.'
          verbatim_anchor: The fact that LTIP adoptions without an agency explanation show weaker positive excess returns should
            not be interpreted as suggesting that verbal explanations are more important than LTIP adoption.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: 'expert_audit_override (user 2026-08-28: 单源足矣)'
          subfield_distribution:
            strategy: 1
          sources:
          - westphal_zajac_1998_symbolic_management
          transferability: high
          paradigm_exclusivity: 调节变量与主效应逻辑绑定（披露依附于事件）的交互设计；预判"交互贬损主效应"误读的保护段
          rhythm_tags:
          - misreading_preempt
          - prerequisite_logic
          - methodologist_backing
          - dual_verdict_close
          notes: corpus 事件研究法 变体12（Results Table 2 P2 段内转折）；保护段仅在主效应构念定义性先于调节变量时合法，纯统计 main effect 不得借用
          corpus_path: econometric-models/事件研究法.md
      R7:
        description: ''
        skeleton_variants:
        - id: r7_eventstudy_heckman_null_lambda_unbiased_confirmation
          skeleton: If firm characteristics are unobservable to the researcher but affect both market outcomes and firm strategy,
            self-selection bias may arise in estimating the impact of [strategy] on [AR/CAR] ([citations]). We carry out the
            Heckman two-step estimation to show that the cross-sectional analysis is not subject to self-selection bias. The
            first stage is a probit on [strategy_choice]. For identification, we exclude [exclusion_vars] from the second-stage
            OLS because there is no a priori reason to believe that they significantly influence [AR/CAR], which is also confirmed
            by [prior_table]. As [Table], Model [N] shows, the coefficients of the self-selection parameters λ are not significantly
            different from zero for the [strategy_A] subsample and the [strategy_B] subsample. Therefore, the cross-sectional
            model yields an unbiased estimate of the effect of [strategy] (i.e., [strategy_A] remain associated with more
            negative [AR/CAR]). Together with the significance of [strategy] in [Eq.], the Heckman results further demonstrate
            that [strategy] are key influencers of abnormal stock returns, regardless of firm and product characteristics.
          verbatim_anchor: As Model 2 in Table 5 shows, this is indeed the case. The coefficients of the self-selection bias
            parameters βλ1 and βλ0 are not significantly different from zero for the proactive subsample and the passive subsample.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-29: 用户裁决产品召回主题全部蒸馏成果升 VERIFIED)"
          subfield_distribution:
            marketing: 1
          sources:
          - Chen_Ganesan_Liu_2009_JM
          - chenganesanliu2009
          transferability: medium
          paradigm_exclusivity: 事件研究→截面策略选择 + Heckman
          rhythm_tags:
          - threat_positioning
          - heckman_two_step
          - exclusion_restriction
          - null_lambda
          - unbiased_confirmation
          notes: null λ 不能证明无内生性；因果语言优先 associated with
          corpus_path: econometric-models/事件研究法.md
      R8:
        description: ''
        skeleton_variants:
        - id: r8_out_of_scope_pattern_strongest_test
          skeleton: Although our hypotheses were limited to [the focal condition], this pattern of results also applies to [the
            broader condition], which is also as we would expect. Our prediction is not that [the focal condition] will have
            a larger impact on [the outcome] than [the broader condition] but, rather, that they too can have a significant effect
            on [the outcome]. While the results show that [the moderator] also accentuates the market''s response to [the broader
            condition], the significant hypothesized effect of [the moderator] for [the hardest case]—[adopted but not implemented]—provides
            a particularly strong test of the consequences of [the focal claim].
          verbatim_anchor: the significant hypothesized effect of agency explanations for decoupled LTIPs—adopted but not implemented—provides
            a particularly strong test of the consequences of symbolic management.
          skeleton_level: paragraph
          paper_count: 1
          status: VERIFIED
          verification_basis: 'expert_audit_override (user 2026-08-28: 单源足矣)'
          subfield_distribution:
            strategy: 1
          sources:
          - westphal_zajac_1998_symbolic_management
