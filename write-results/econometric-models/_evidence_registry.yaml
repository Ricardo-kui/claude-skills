    - id: csp_IV_2SLS_R4_b8673d8b
      pattern: 首次在marketing顶刊中观察到indirect moderation（Van Kollenburg & Croon 2021）的完整实证报告范式：通过Equation 2→5的嵌套模型序列，区分Model A（partial
        indirect moderation）与Model B（full indirect moderation），并以β43是否显著为判定标准。该模式将统计检验与理论模型图（Figure 4）严格对应。
