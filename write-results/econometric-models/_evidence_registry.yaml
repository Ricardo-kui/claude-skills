        - id: r7_ols_front_loaded_rir_naive_cure
          skeleton: A concern in testing how [characteristic] affects [outcome] is endogeneity, especially from nonrandom
            [selection]. First, we use robustness of inference to replacement (RIR): to alter our inferences for [outcome 1],
            [N] observations would have to be replaced with observations for which there is an effect of zero, and for [outcome
            2], [N] observations. Next, we pair 'naive' analyses that do not use tools to 'cure' endogeneity with analyses
            that attempt such a cure [e.g., two-stage residual inclusion], finding estimates are consistent across approaches.
