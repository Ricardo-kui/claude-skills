          - placebo
          - early_late
          - alternative_measures
          corpus_path: econometric-models/DiD.md
        - id: r7_did_null_placebo_lead_lag_identification
          skeleton: To rule out chance significance, create placebo treatments [k] periods before and after the true change.
            Expect weaker/null effects. Neither the direct placebo impact nor interactions are significant ([appendix table]).
