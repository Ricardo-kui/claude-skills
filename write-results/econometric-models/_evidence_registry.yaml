          - facet_comparison
          notes: 复合文本指标必须分解以显示哪个 facet 驱动效应
          corpus_path: econometric-models/计数模型.md
        - id: r7_count_poisson_gmm_robustness_battery
          skeleton: We conduct further tests to check that our results are robust to changes in specifications. First, to
            confirm the validity of our [count-GMM] estimation, we follow [validity procedure/citation]. Second, to address
            standard error inefficiencies from the generated regressor ([name]) in the outcome equation, we re-estimate the
            models bootstrapping the standard errors [N] times with robust standard errors. Third, to account for overdispersion
            ([rough share]% of cases), we use a [negative binomial] estimator in lieu of [Poisson]. Fourth, to address selection
            into [endogenous behavior], we specify [N] alternative selection models using [fine-grained auxiliary data]. Fifth,
            we test alternative specifications of [IV and DV]. Sixth, because [external reference] is unavailable for years
            before [cutoff], we use an alternative measure of [construct] with a bounded denominator. Seventh, to address
            correlation among the moderators, we re-estimate the main models using a modified [orthogonalization] procedure.
            Finally, to check sensitivity to outliers, we run censoring analyses excluding values above [thresholds] and winsorizing
            with lower and upper cut-offs ([citation]). The results of these tests remain consistent with our hypothesized
            relationships.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Fini_Jourdan_Perkmann_2017_AMJ
          transferability: high
          paradigm_exclusivity: 计数模型专用，Poisson-GMM 威胁电池
          rhythm_tags:
          - generated_regressor
          - bootstrap_se
          - overdispersion
          - orthogonalization
          - winsorizing
          notes: 逐条 to address X 定位；区别于文本测量专属变体5/6 与通用枚举 OLS-FE 变体21（corpus 变体17）
          corpus_path: econometric-models/计数模型.md
        - id: r7_count_system_gmm_replication
          skeleton: Finally, in further analysis, we replicate our findings with a linear GMM estimation [citation], using
            the logarithmic transformation of the monetary amount of [outcome] as a dependent variable. Compared to our main
            specification, this procedure allows us to include individual fixed effects and thus control for (invariant) unobserved
            heterogeneity. The correlation between this continuous measure and the count measure used in our main models is
            just above [threshold]. We employ a system GMM estimator rather than a difference GMM estimator, as the former
            allows for more instruments. We treat [IV], its squared term, [lagged DV], and the interaction terms as endogenous;
            all remaining variables, except [time controls] and [group affiliation], are considered predetermined. Robust
            standard errors, clustered by [unit], are included in all specifications. We assess the validity of the GMM estimator
            and the selected instruments via serial correlation tests (AR(1) and AR(2)) and the Hansen test of overidentification
            restrictions. The results of the linear models are similar to the main specification, adding support to our hypotheses.
          paper_count: 1
          status: EMERGING
          subfield_distribution:
            strategy: 1
          sources:
          - Fini_Jourdan_Perkmann_2017_AMJ
          transferability: high
          paradigm_exclusivity: 计数模型专用，system GMM 替代估计器复制
          rhythm_tags:
          - continuous_dv_swap
          - endogeneity_classification
          - ar_hansen_diagnostics
          - cross_measure_correlation
          notes: 换连续 DV + system GMM + 内生性分类 + AR/Hansen；区别于 OLS-FE 变体39（3SLS）（corpus 变体21）
          corpus_path: econometric-models/计数模型.md
        - id: r7_four_threat_battery_mediation_psm_placebo_reverse
          skeleton: We conduct [N] additional analyses to more comprehensively explore our hypothesized relationships. These
            include a [mediation] test, a [sample selection] test, a regression using [placebo outcome] as the dependent variable,
            and a [reverse causality] test. First, we delve deeper into the mechanisms that may underlie the [predictor]-[outcome]
            relationship. [Mechanism A] would imply that [mediator A] mediates this relationship; however, this is not the
            case as [mediator A] is not a significant predictor of [outcome]. Next, we explore the alternative mechanism and
            test whether [mediator B] mediates the relationship... Taken together, this provides evidence that [mediator B]
            mediates the relationship between [predictor] and [outcome]. Our next robustness check addresses possible [sample
            selection bias] that may confound our analysis. To explore this possibility, we provide results of a [propensity
            score matching] model (Table [z]). The results show that the average treatment effect of [treatment] is [direction]
            and significant on [outcome A] and [outcome B], though the treatment effect is not significant at the p < [threshold]
            level for [outcome C]. These results help alleviate [sample selection bias] concerns related to the conclusions
            of our study. To ensure that our results are not contingent on our [dependent variable operationalization], we
            test our hypotheses using [placebo outcome] as the dependent variable. Because [structural constraint], there should
            be no reason to expect a significant relationship between [predictor] and [placebo outcome]. As expected, [predictor]
            does not have a significant relationship with [placebo outcome]. This provides support for our contention that
            [the focal mechanism is channel-specific]. In column [c] of Table [z], we report results of a regression analysis
            conducted to test reverse causality, as it is possible that [units] adjust their level of [predictor] after experiencing
            [outcome]. We use the subsequent period's [predictor] as the dependent variable and find no support for reverse
            causality, as [outcome experience] is not associated with future [predictor].
          paper_count: 1
          status: VERIFIED
          verification_basis: "expert_audit_override (user 2026-08-28: 产品召回为主研究领域，单源足矣)"
