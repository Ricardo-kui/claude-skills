schema_version: "0.1.0-pilot"
pilot_status: shadow_only
decision_node: results.R2.OLS_FE
description: >-
  Read-only sidecar index for testing targeted retrieval against the unchanged
  OLS-FE legacy corpus. This file does not authorize merging, deletion, status
  promotion, or default-path changes.

sources:
  legacy_corpus:
    file: econometric-models/OLS-FE.md
    sha256: 3b372d78cac2e824a20441a5c784e81d38f5c13edba5fef6b6e077334eae54ae
    expected_variant_headings: 46
  evidence_registry:
    file: econometric-models/_evidence_registry.yaml

selection_policy:
  hard_filter: requires_all
  ranking:
    - matched_required_features
    - matched_optional_features
    - evidence_status
    - asset_id
  include_fallback_when_top_k_allows: true
  default_top_k: 3
  note: >-
    Specific task fit outranks evidence status. EMERGING assets may be retrieved
    for an explicit matching task but are never marked default_eligible. When
    top_k is greater than one, reserve the final position for the ROBUST fallback.
  output_contract:
    - Map each hypothesis to the model or column where its focal term first enters.
    - Keep R2 as navigation; do not report support, coefficients, or significance beyond task-supplied first-stage facts.
    - Treat first-stage significance as relevance evidence only, not proof of exclusion validity or resolved endogeneity.
    - Do not infer the baseline fixed-effects structure, table layout, or diagnostic results when the task does not state them.
  feature_aliases:
    heckman: heckman_selection
    heckman_two_stage: heckman_selection
    heckman_procedure: heckman_selection
    heckman_correction: heckman_selection
    selection_correction: heckman_selection
    model_free_preview: model_free_evidence
    descriptive_quartile_preview: model_free_evidence
    polynomial_relationship: polynomial_model
    curvilinear_model: polynomial_model
    experimental_regression: experimental_design
    factorial_experiment: experimental_design
    binary_endogenous_variable: binary_endogenous_predictor
    residual_inclusion: control_function

assets:
  - asset_id: r2_ols_model_sequence
    asset_role: slot_core
    lifecycle: active
    evidence_status: ROBUST
    default_eligible: true
    fallback: true
    requires_all: []
    match_features:
      - standard_ols
      - hierarchical_models
      - table_navigation
    locator:
      type: registry_skeleton
      file: econometric-models/_evidence_registry.yaml
      estimator: OLS_FE
      slot: R2
      variant_id: r2_ols_model_sequence

  - asset_id: r2_ols_experimental_seven_model_hierarchy
