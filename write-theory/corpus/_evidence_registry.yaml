    description: "主效应机制由 push（主动施加）与 pull（被动迎合）两条独立通道构成，收敛于同一预测；可行性条件（不透明性/低检测风险）作为第三环；与 B2 判别：B2 要求不同预测，本模式双通道收敛用于加固"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "desjardine_li_shi_2025_amj"
    home_file: "subprotocols/hypothesis_derivation_patterns.md"
    note: "Dual-Channel Convergence。与 dual_mechanism_same_direction（两独立中介同向）判别：本模式是双通道（主动/被动）而非双中介；与 B2 双轨机制判别：收敛于同一预测而非不同预测。"
  why_not_reverse_boundary_declaration:
    description: "主效应假设后解释为何不预测相邻对象/方向——First（检测/暴露风险）→ Second（相对效应 + 单元内比较）→ 收束（双重逻辑合并），把效应的选择性理论化"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "desjardine_li_shi_2025_amj"
    home_file: "subprotocols/hypothesis_derivation_patterns.md"
    note: "Why-Not Reverse Boundary Declaration。与 E1 Step 6（排除反向交互）判别：Step 6 是'为何 Z 调节 X→Y'；本模式是'为何 X 不作用于相邻对象'。理由间张力须在收束句统一。"
  trait_activation_dual_manifestation_cue_switch:
    description: "特质 IV 有默认表现型（主效应）；特质相关 cue 激活对立表现型作用于同一 DV——cue 是'默认失效'证据，假设用 Mitigation via Manifestation-Switch 句式"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "ridge_hill_ingram_kolomeitsev_worrell_2024_amj"
    home_file: "variants/E_moderation.md"
    note: "E11。与 E7（宏观事件+时间持续性）/E9（角色侧镜像）/E8（双刃剑净效应不定）判别见正文。低-cue 态=主效应基线，moderation 只论 high 侧——对应 Cue-Activation Carve-Out（tfr_168）。"
  mitigation_via_manifestation_switch:
    description: "cue 不削弱基线机制，而是激活对立表现型（manifestation-switch），把负向关系缓解/覆盖——'mitigated as [cue] increases and prompts more [opposing manifestation] action'"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "ridge_hill_ingram_kolomeitsev_worrell_2024_amj"
    home_file: "sentences/moderation.md"
    note: "与 Buffering（同一机制削弱）判别：本句式是行为表现型切换。与 Zorn External Partial-Substitute（替代已丧失收益）判别：无 substitute 逻辑。"
  threat_processing_cascade:
    description: "5 拍认知处理链：hyper-vigilance 扫描 → self-as-target + sinister attribution 双偏差 → 结论跃迁 → 安全行为选择（连续谱一端）→ 收敛假设"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "ridge_hill_ingram_kolomeitsev_worrell_2024_amj"
    home_file: "sentences/mechanism_chain.md"
    note: "与两步链（标准）判别：本链是多拍认知序列；与 Wang 2024 对称三步链判别：后者是情绪特质三通道对称展开，本链是单线递进威胁处理。安全行为连续谱为 E11 埋钩。"
  per_stakeholder_paired_main_cue_moderation:
    description: "同一特质 IV 面对多个外部利益相关者，各产生'主效应（默认表现型）+ cue 切换（对立表现型）'配对；特质机制只推一次，各 stakeholder 应用+切换"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "ridge_hill_ingram_kolomeitsev_worrell_2024_amj"
    home_file: "subprotocols/hypothesis_organization_patterns.md"
    note: "Pattern 11。与 Triple Parallel Boundary（多个独立 moderator）/Common Trunk Parallel Branches（同一 DV 多机制）判别见正文。"
  invariant_discriminant_spine:
    description: "一条不变判别主轴贯穿所有相邻构念排除——主轴承担全部区分工作，相邻构念是对主轴的逐个检验"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "ridge_hill_ingram_kolomeitsev_worrell_2024_amj"
    home_file: "subprotocols/construct_differentiation_patterns.md"
    note: "与 Table-Based Construct Differentiation（多维并列对比）判别：本模式主轴恒定、逐个排除。主轴须落在可衔接理论后果的位置。"
  cue_activation_bilateral_carve_out:
    description: "硬约束 #11 条件化例外——cue/activation moderator 的 low 态=主效应已论证默认基线时，双边覆盖由（主效应基线）+（high 态机制论证）满足，不强制冗余 low 段"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "ridge_hill_ingram_kolomeitsev_worrell_2024_amj"
    home_file: "subprotocols/bilateral_argumentation_templates.md"
    note: "Cue-Activation Carve-Out。对照仍需双边：E1 Step5/7、Buffering、E9 镜像、Pattern 12 不对称。QC 不得按字面 C11 判此类结构不完整。"
  cross_audience_dual_signal_curvilinear_inference:
    description: "外部受众认可对焦点受众同时是能力线索与身份契合威胁；两信息推理速率不同，认可与焦点评价呈倒 U；调节按'改变身份惩罚'或'改变对外部信号依赖'分别映射到曲率与顶点"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "fini_jourdan_perkmann_2017_amj"
    home_file: "sentences/mechanism_chain.md"
    note: "REGISTRY SYNC（tfr_169）— 语料条目先于登记存在；本聚合条目补登记，不改语料文本。句级模板；架构级骨架见 curvilinear_additive_opposing_components。"
  curvilinear_additive_opposing_components:
    description: "倒 U 由两个同时单调、方向相反、斜率不同的分量相加生成（正线性 ability 分量 offset 由加速负 identity 分量）——曲线的必要性来自机制主导权变化而非阶段切换"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "fini_jourdan_perkmann_2017_amj"
    home_file: "subprotocols/hypothesis_derivation_patterns.md"
    note: "与 Two-Phase（Cui/Bendig/Anderson-Reeb，阶段主导切换）判别：本模式两分量同时存在、每点相加；与 Dual-Logic（不同 facet 两透镜）判别：同一信号的两信息读法。架构级；句级模板 tfr_169。"
  paired_geometric_hypotheses_per_moderator:
    description: "曲线基线 + 选择性组件调节 → 每调节产出配对几何假设：H[N]a 形状（flatten/steepen）+ H[N]b 顶点位置（turning point 沿 X 轴平移），各有直接检验（Haans, Pieters & He 2016）"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "fini_jourdan_perkmann_2017_amj"
    home_file: "variants/E_moderation.md"
    note: "E5 子变体。与 E5 单衰减假设（moderator 绑定整条曲线）判别：本模式只绑定一个分量，须先作不变性声明。"
  selective_component_invariance_declaration:
    description: "当 moderator 只绑定多分量效应的一个分量时，显式声明另一分量不变（理论范围声明而非统计交互预测），为双几何假设提供许可"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "fini_jourdan_perkmann_2017_amj"
    home_file: "sentences/moderation.md"
    note: "从 turning_point_delay_selective_prerequisite（bottleneck-switch 情境）推广为通用微动作；与 E5 整曲线调节（无不变性声明）判别。"
  dual_information_signal_source_dependent_alignment:
    description: "一个可观察信号携带两类信息（ability + identity conformance）；两类信息是否对齐取决于信号来源（endogenous 对齐 / exogenous 不对齐）——多受众估值机制的前提 taxonomy"
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "fini_jourdan_perkmann_2017_amj"
    home_file: "sentences/construct_definition.md"
    note: "T1 构念设置，与机制链句级模板 tfr_169 配套；与 construct_differentiation（两个构念区分）判别：本模式是一个构念的两种信息读法。"

  audience_foil_then_focal_signal_single_H:
    description: "文献默认受众 A 对行动 X 正向；用 A 作 foil 后转折到受众 B 的负面信号解读，收敛为单一比较主效应（不成对受众假设）"
    status: "VERIFIED"
