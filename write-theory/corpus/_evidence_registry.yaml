# Honesty boundaries extracted from corpus
honesty_boundaries:
  - id: hb_theory_no_causal_language_without_identification
    boundary: "OLS/FE 论文 Theory 段也不得使用 'effect of' / 'causes' / 'leads to' 除非识别策略已在 Theory 中铺垫"
    allowed_language: "associated with / positively related to / consistent with"
    affected_files:
      - "sentences/closure.md"
      - "sentences/mechanism_chain.md"
    source: "write-results _evidence_registry.yaml / global_honesty_boundaries"
  - id: hb_no_folk_wisdom_as_mechanism
    boundary: "机制链中禁止用谚语/常识替代理论文献支撑"
    example_violation: "shipilov_greve_rowley_2019 H1b/H2b based on 'complacency' folk proverb was empirically reversed"
    affected_files:
      - "sentences/mechanism_chain.md"
  - id: hb_no_ad_hoc_moderator
    boundary: "moderator 必须有理论来源，不能是 'we also examine...' 式事后添加"
    affected_files:
      - "sentences/moderation.md"
      - "variants/E_moderation.md"
  - id: hb_background_as_theory_no_forged_hypotheses
    boundary: "当范文/目标稿采用无正式编号假设的 Background-as-Theory（B8）时，不得为迎合默认输出合同伪造 H1–Hn；应输出阶段研究问题/empirical agenda，并标明诚实边界"
    allowed_language: "open empirical question / we examine whether / advantages are expected to attenuate when..."
    affected_files:
      - "subprotocols/hypothesis_derivation_patterns.md"
      - "variants/B_mechanism_elaboration.md"
      - "references/output-format.md"
    source: "Kim_Lee_2026_SMJ distill (2026-08-05c)"
  - id: hb_granger_causality_ceiling_for_panel_lag_designs
    boundary: "面板 + 滞后 + first-differencing 设计允许的最强措辞是 Granger causality，且必须显式命名（'interpreted as Granger causality'）；正文假设可用 'lead to' / 'impact'，但不得写 'cause' / 'causal effect' / 'causal impact'"
    allowed_language: "lead to / impact / interpreted as Granger causality"
    exemplar: "Kalaignanam_Kushwaha_Eilert_2013_JM — Methods 显式声明 'allows the results to be interpreted as Granger causality'；全文未出现 structural causality 措辞"
    affected_files:
      - "sentences/mechanism_chain.md"
      - "variants/B_mechanism_elaboration.md"
    source: "Kalaignanam_Kushwaha_Eilert_2013_JM distill (2026-08-06)"

