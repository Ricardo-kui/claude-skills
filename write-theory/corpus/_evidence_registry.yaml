# Theory Evidence Registry
# Schema: theory-fragment-registry v1.0.0
# Purpose: track which source papers have been distilled into which write-theory corpus files,
#          what theoretical fragments were extracted, and their validation status.

meta:
  schema_version: "1.0.0"
  registry_type: theory-fragment-registry
  last_updated: "2026-08-06"
  total_papers_indexed: 69
  batches_processed: 27
  auxiliary_sources_note: "Entries with source_tier: auxiliary are writing-craft books, not empirical papers. They register provenance and stay EMERGING until the pattern is cross-validated in empirical paper distills; they never count toward VERIFIED/ROBUST paper_count thresholds on their own."
  latest_batch_note: "2026-08-06h metadata: li_bapuji_talluri_singh_narayanan_2026_jscm renamed to li_bapuji_talluri_singh_narayanan_2026_jscm (year 2026). POM id unchanged: li_bapuji_talluri_singh_venkataraman_2026_pom."
  note: "Batch 2026-08-06e Li_2026_POM Theory + quality-fix — see latest_batch_note. Batch 2026-08-06d Haunschild_Rhee_2004_MS — see prior. Batch 2026-08-06c Thirumalai_Sinha_2011_MS. Batch 2026-08-06b Kalaignanam. Prior batches unchanged."
status_rules:
  EMERGING:
    paper_count_max: 2
    description: Single or two-paper pattern; transferable but not yet cross-validated
  VERIFIED:
    paper_count_min: 3
    description: Pattern replicated across 3+ papers within corpus
  ROBUST:
    paper_count_min: 5
    cross_subfields_min: 2
    description: Pattern replicated across 5+ papers and 2+ subfields; can be default recommendation

