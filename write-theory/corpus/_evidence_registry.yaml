    note: "Chen2009 single-sided dialectic. Contrast with standard G (Pontikes 2012 mirrored H-pairs, same DV, theory-based reconciliation). Different DV families are the point."
  audience_split_signal_interpretation_base_rate_deviance:
    description: "Signaling mechanism chain: information-asymmetry trunk, consensus-side recap, 'no other choice but to act' severity inference, base-rate deviance amplification backed by own data, single H1."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "chen_ganesan_liu_2009_jm"
    home_file: "sentences/mechanism_chain.md"
    note: "Sentence-level companion to tfr_159. Per-citation division of labor; 'supported in our data' requires descriptive stats already available; no negativity-bias crutch."

  ability_motivation_enablers_framework:
    description: "Anchor two moderators to the learning literature's ability-vs-motivation meta-consensus: structural asset as transfer enabler (ability side), perceptual asset as attention enabler (motivation side)."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "kalaignanam_kushwaha_eilert_2013_jm"
    home_file: "subprotocols/moderator_selection_frameworks.md"
    note: "Fifth framework in the file. Orthogonal dimensions; distinct from darby2026 info-asymmetry two-level (same concept across levels) and Singh-Grewal information/attention (complementary, not orthogonal)."
  equivocal_bilateral_nondirectional_moderation:
    description: "Two schools of thought on one moderator with balanced literature support, resolving into a single nondirectional H ('stronger or weaker'); Discussion must adjudicate the winning mechanism."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "kalaignanam_kushwaha_eilert_2013_jm"
    home_file: "sentences/moderation.md"
    note: "Boundary vs F: rivalry is intra-moderator (two schools), not inter-theory. First corpus entry of nondirectional hypothesis form."
  trivial_response_exclusion_temporal_mediation:
    description: "Exclude the phenomenon's mandated/trivial minimal response (limited scope) to foreground the broader discretionary mechanism; mediation chain X(t-1) → M(t) → Y(t+1) with theory-measures-model alignment declaration."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "kalaignanam_kushwaha_eilert_2013_jm"
    home_file: "sentences/mechanism_chain.md"
    note: "Distinct from Preemptive Competing Account Management (which targets readers' rival theoretical predictions at T2→T3); this targets the phenomenon's minimal response form within a hypothesis-derivation paragraph."
  temporal_dual_role_same_variable:
    description: "Same firm characteristic plays opposite-signed dual roles across time: ex ante antecedent of the event (driver, harmful) and ex post buffer of the event's consequences (moderator, beneficial); two roles enter separate hypotheses in separate models; Discussion trade-off integration is obligatory."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "thirumalai_sinha_2011_ms"
    home_file: "subprotocols/hypothesis_organization_patterns.md"
    note: "Distinct from B2 dual-track (two dimensions of one construct→same DV), dual-edged trunk (same-time signed enhancing/hindering contingencies), and F competing hypotheses (inter-theory rivalry adjudicated by data). No trade-off if both roles share the same sign."

  competing_theories_sectioned_horse_race:
    description: "Incommensurability R3 theory-section architecture: shared RQ + 'conflicting answers' opening → mirrored subsections each steelmanning one theory camp → sequential mutually-exclusive directional hypotheses (H[N] vs H[N+1]) on the same locked X/Y/unit/horizon/estimand → mechanism sub-hypothesis (H[N]A) supplies process evidence → empirics adjudicate → Discussion explains why the losing mechanism is weaker here."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "haunschild_rhee_2004_ms"
    home_file: "subprotocols/hypothesis_organization_patterns.md"
    note: "Distinct from audience-role dichotomy (both hold across audiences), symmetric opposing dual-track (two DV dimensions, both hold), Wowak lettered pair (shared hypothesis number, adjacent paragraphs), and kalaignanam2013 equivocal nondirectional (avoids adjudication). Mirrored verbatim closing sentence is the symmetry marker."

  sectioned_competing_hypotheses:
    description: "Sequential-number competing hypotheses (H2 vs H3) instead of lettered pair (H1a/H1b) when each rival camp requires its own full steelman subsection; mirrored closing formula marks the two subsections' symmetric structure."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "haunschild_rhee_2004_ms"
    home_file: "sentences/hypothesis_forms.md"
    note: "Selection rule added under 竞争假设: lettered pair = quick contest within one derivation unit; sectioned sequential = formal horse race with per-camp subsections (R3 discriminating test)."

  original_mini_analysis_premise_warrant:
    description: "Embed a small original descriptive analysis (counts + proportions + chi-square/t test) inside the Theory section to prove a load-bearing empirical premise in situ, rather than asserting it; must close with a recovery sentence tying the statistic back to the premise."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "haunschild_rhee_2004_ms"
    home_file: "subprotocols/evidence_patterns.md"
    note: "Press-coverage chi-square (368 ABI/INFORM articles, 47% involuntary vs 22% base rate) supports the salience premise of the attention camp. Max 1-2 per paper; descriptive only—must not blur theory/results genre boundary."

  named_case_objection_rebuttal:
    description: "Anticipate the reader's context-exception objection in their own voice ('One might think that...'), pivot ('This is not, however, always the case'), then rebut with a named, verifiable case; defensive counterpart to Case-as-Warrant's positive illustration."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "haunschild_rhee_2004_ms"
    home_file: "subprotocols/evidence_patterns.md"
    note: "Registered as 子型 C of case_as_warrant_for_mechanism. Firestone/Bridgestone-Ford Venezuela 1998 two-year delay rebuts 'no inertia for safety issues'. Case must be named, checkable, and directly on-point; return to derivation immediately."

  plain_language_prestatement_formal_hypothesis:
    description: "Two-step announcement for baseline hypotheses with well-documented mechanisms: plain-language proposition marked as 'starting hypothesis', then the formal HYPOTHESIS statement; spreads comprehension cost and separates baseline from novel hypotheses."
    status: "EMERGING"
    source_count: 1
    source_papers:
      - "haunschild_rhee_2004_ms"
    home_file: "sentences/hypothesis_forms.md"
    note: "Plain and formal statements must be logically equivalent. Forbidden for novel core hypotheses (dilutes derivation)."

