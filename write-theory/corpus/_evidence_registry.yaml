# -- THEORY ASSET GOVERNANCE START --
asset_governance:
  schema_version: 1
  policy:
    single_paper: reference_only
    default_action_order:
    - NONE
    - REUSE
    - EXTEND_SOURCE
    - ADD_REFERENCE
    - PROPOSE_VARIANT
    cross_family_merge: review_only
  default_architecture_record:
    role: generative_strategy
    lifecycle: active
    evidence_status: structural
    legacy_ids: []
    validation_history_additions: []
  default_pattern_record:
    role: reference_exemplar
    lifecycle: active
    legacy_ids: []
    validation_history_additions: []
    source_paper_additions: []
  default_legacy_record:
    role: reference_exemplar
    lifecycle: active
    evidence_status: UNREGISTERED
    legacy_ids: []
    validation_history_additions: []
    source_paper_additions: []
  asset_overrides: {}
  managed_references: {}
  representative_reference_menus: {}
  generation_guards:
    default:
      required:
      - "State one stable argument graph: construct -> premise -> why-chain -> boundary/level/time -> prediction."
      - "Name the actor-level conversion process; do not substitute labels or citations for the why-chain."
      - "Keep any unverified setting fact, mechanism, or sign as an explicit placeholder or uncertainty."
      - "Select one actor, one cue or constraint, one resulting action, and one diagnostic observation per reasoning branch; do not leave a menu of generic alternatives in final prose."
      - "Turn the contract into a continuous argument; do not reproduce its checklist vocabulary as the paragraph structure."
    D:
      required:
      - "For every proposed stage transition, name the actor, the transition condition, and the observable next state."
      - "Build each boundary as current actor/action -> transition condition -> pre-next-stage observable marker -> next actor/state -> failed-transition branch; do not use the next stage's first action as the marker."
      - "Specify who receives feedback, whether it reinforces, redirects, or terminates the process, and what could reveal that branch."
      - "Transport feedback through source -> carrier/channel -> translation/aggregation -> decision-capable recipient -> interpretation criterion -> branch -> observable trace."
      - "Use propositions or open process claims rather than a universal net-effect hypothesis unless the task independently warrants one."
      - "Use a transition marker observable before the final outcome; state the warrant that makes the marker evidence of movement rather than a relabeled stage outcome."
      - "Close the stage chain at the terminal process state named in the task or claim; chain further boundary crossings with their own markers when the immediate next state is only intermediate."
    E:
      required:
      - "Derive both boundary states separately: condition meaning -> actor interpretation/capacity -> named mechanism -> directional outcome."
      - "Place the boundary state before its condition-specific interpretation and mechanism in both graph and prose: boundary state as prior scope, X -> actor interpretation/capacity under that state -> mechanism -> Y; no directed edge may run from X to the boundary state."
      - "State why the low-condition logic is more than the absence of the high-condition logic."
      - "When directions oppose, make the conditional claim primary and do not add an unsupported unconditional main-effect hypothesis."
      - "If the derivation fixes the sign in each boundary state, state signed predictions per state; reserve comparative 'more positive/more negative' wording for theoretically unfixed per-state net signs."
    local_only:
      required:
      - "Return a local diagnostic: lock the immediate constructs, unit, time horizon, and unresolved routing decision."
      - "Classify each disputed element as construct, alternative operationalization, mechanism, measured mediator, contextual condition, or temporal stage; name the observation that could discriminate the live alternatives."
      prohibited:
      - "Numbered hypotheses or propositions."
      - "paper-state.yaml update, paper-level contribution claim, or corpus writeback."
    no_numbered_hypotheses:
      prohibited:
      - "Numbered hypotheses or propositions."
  reference_menu_cap: 5
  render_cap: 4
  section_render_cap: 8
  snapshot:
    architecture_assets: 7
    pattern_assets: 120
    inventory_sha256: ae7a54d43eb424b5934bcebce78b27855ebf03c8226772cf84d20ee4ecaeb3e7
# -- THEORY ASSET GOVERNANCE END --
