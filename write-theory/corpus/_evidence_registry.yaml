  haunschild_rhee_2004_ms:
    display_name: "Haunschild & Rhee (2004, MS)"
    journal: "Management Science"
    year: 2004
    subfield: "om"
    theory_build_type: "Incommensurability R1 (primary: X-side differentiation voluntary/involuntary) + R3-style discriminating test on classified X + R4 (secondary: generalism); Mechanism / Boundary"
    fragments:
      - fragment_id: tfr_165
        type: competing_theories_sectioned_horse_race
        title: "理论对垒分节赛马架构——镜像小节 × 序数互斥竞争假设（服务于 R1 分类后的裁决）"
        home_files:
          - "subprotocols/hypothesis_organization_patterns.md"
        makadok_dimension: "Mechanism"
        status: "EMERGING"
        note: "PRIMARY ROUTE CORRECTION (user 2026-08-06): resolution operator is R1 — classify umbrella X (recall experience) into voluntary vs involuntary by volition; rival camps make opposite predictions about which X member produces more learning. Sectioned horse race (H2/H3) is the staging device AFTER X classification, not a pure R3 coexistence schedule. Volition camp vs attention camp; H2A process evidence; empirics adjudicate (H2 wins). Fills corpus gap vs Lee-Park R3 coexistence exemplars. Distinct from pontikes2012 (both hold), zhao-ding dual-track, wowak lettered pair, kalaignanam nondirectional."
      - fragment_id: tfr_166
        type: sectioned_competing_hypotheses
        title: "分节编号竞争假设（H2/H3 序数互斥 vs Wowak H1a/H1b 字母对）"
        home_files:
          - "sentences/hypothesis_forms.md"
        makadok_dimension: "Mechanism"
        status: "EMERGING"
        note: "Sentence-level carrier of post-R1 adjudication: sequential numbers when each camp needs its own steelman subsection on a classified X member; lettered pair when contesting within one derivation unit. Mirrored closing sentence marks symmetry."
      - fragment_id: tfr_167
        type: original_mini_analysis_premise_warrant
        title: "原创小型分析作前提担保（理论节内嵌计数+χ²检验）"
        home_files:
          - "subprotocols/evidence_patterns.md"
        makadok_dimension: "Mechanism"
        status: "EMERGING"
        note: "Load-bearing premise 'involuntary recalls are more salient' defended in situ: 1998 NHTSA 235 recalls (22% involuntary) vs ABI/INFORM 368 press articles (47% involuntary), Pearson chi-square(1)=37.2067, p<0.001; recovery sentence ties coverage as cause and consequence of salience."
      - fragment_id: tfr_168
        type: named_case_objection_rebuttal
        title: "具名案例反驳预设异议（Case-as-Warrant 子型 C）"
        home_files:
          - "subprotocols/evidence_patterns.md"
        makadok_dimension: "Mechanism"
        status: "EMERGING"
        note: "'One might think that inertia would not be a problem in the product recall context... This is not, however, always the case. For example, [Firestone/Bridgestone—Ford Venezuela 1998, two-year delay].' Defensive counterexample (exception does not exist), distinct from positive mechanism warrant."
      - fragment_id: tfr_169
        type: plain_language_prestatement_formal_hypothesis
        title: "平语预告→正式假设双步式（starting hypothesis 标记基线地位）"
        home_files:
          - "sentences/hypothesis_forms.md"
        makadok_dimension: "Mechanism"
        status: "EMERGING"
        note: "'We therefore use as our starting hypothesis a basic learning effect: [plain English].' → HYPOTHESIS 1 [formal]. Only for baseline hypotheses whose mechanism is already well documented; forbidden for novel core hypotheses."

