defects:
  e-family-missing-dual-edged-signed-contingency-variant:
    classification: corpus_gap
    status: EMERGING
    risk: low
    current_rule: 调节效应型 E 族覆盖 E1–E7，含 E4 竞争响应裁决，但不覆盖双刃剑估值机制下异号增强/阻碍权变且无 unconditional 主效应假设的写法。
    rule_excerpt: E1-E7 协议：同层/跨层调节、嵌入边界、竞争裁决、曲线多调节、序列嵌套调节、宏观事件激活与持续性
    rule_locator: write-theory/corpus/_index.md variants table row for E_moderation.md (pre-writeback text)
    target: write-theory/corpus/variants/E_moderation.md
    diagnosis: Castellaneta et al. (2017) Theory 以 dual-blade trunk + enhancing/hindering 分节 + more positive/more negative
      假设组织贡献；E4 裁决的是竞争响应 repertoire，G 常写受众分侧主效应，Shen 双刃剑句式常收束到单侧 DV。缺少可迁移的 E8 section_variant 会导致 write-theory 把合法异号权变硬套成
      E1 stronger/weaker。
    proposed_change:
      action: add_branch
      summary: ADD E8 dual-edged signed enhancing/hindering contingencies + companion organization/sentence patterns; register
        EMERGING evidence.
    absolute_rule: false
    decisive_falsifier: false
    applicability:
      build_types:
      - 调节效应型
      hypothesis_families:
      - dual_edged_contingency
      - interaction_only_opposite_signed
      journals: []
      boundary: 仅当同一 X→Y 存在方向相反的机制刃、且正式假设为异号权变、可不设 unconditional 主效应 H 时适用；不替代 E4 或 G。
    papers:
    - id: Castellaneta_Conti_Kacperczyk_2017_SMJ
      journal: SMJ
      build_type: 调节效应型
      hypothesis_family: ''
      evidence_anchor: 'Theory: UTSA trade-secret definition → dual-blade trunk (rival vs buyer information) → Enhancing section
        H1 (mobility) → Hindering section H2 (resource-value uncertainty) + H3 (poor-investment/lemons risk); no unconditional
        main-effect H.'
      evidence_quality: full_text_verified
    paper_count: 1
    journals:
    - SMJ
    journal_count: 1
    verified_paper_count: 1
    verified_journals:
    - SMJ
    verified_journal_count: 1
    regression_cases:
      positive: []
      preservation: []
    resolution_history: []
    lifecycle: open
    first_seen: '2026-08-05'
    last_seen: '2026-08-05'
    auto_action:
      eligibility: optional_variant_only
      reason: Corpus changes do not alter core routing.
  e-subtype-selection-cues-not-in-primary-routing:
    classification: routing_defect
    status: EMERGING
    risk: medium
    current_rule: Gap×Boundary 一级路由只指向变体 E，不区分 E4 竞争响应裁决与双刃剑异号权变（E8）等子协议。
    rule_excerpt: Incompleteness|Inadequacy | Boundary | 调节/条件化 | E | （Castellaneta 主路由为 Incompleteness×Boundary；Inadequacy×Boundary
      行仅作对照）
    rule_locator: write-theory/corpus/meta/routing_table.md — 一级路由 Gap × 贡献杠杆表
    target: write-theory/corpus/meta/routing_table.md
    diagnosis: 一级路由正确选到 E，但缺少二级选择线索时，模型易默认 E1（先主效应再 stronger/weaker）。Castellaneta 类任务（Gap=Incompleteness，含轻度 Inadequacy undertone；非
      Inadequacy-primary）需要显式提示：若净效应 a priori 不定且权变异号、可无主效应 H → 调用 E8/E4 族而非 E1。勿因双刃对立误标为 Inadequacy。
    proposed_change:
      action: add_branch
      summary: 在 routing_table 的 E 族二级提示中增加：dual-edged/net-effect-ambiguous + opposite-signed contingencies → E8；competing
        responses adjudicated by W → E4。
    absolute_rule: false
    decisive_falsifier: false
    applicability:
      build_types:
      - 调节效应型
      hypothesis_families:
      - competing_baseline_moderation
      - interaction_only_opposite_signed
      journals: []
      boundary: 仅建议增加 E 族二级选择提示；不得把 E8 升为默认或改变 Gap×Makadok 一级映射。
    papers:
    - id: Castellaneta_Conti_Kacperczyk_2017_SMJ
