  moderation-missing-mitigation-manifestation-switch-mode:
    classification: corpus_gap
    status: EMERGING
    risk: low
    current_rule: moderation 句式集覆盖 buffering/enhancing/antagonistic/existence/competing，无"mitigation via manifestation-switch"（行为切换）模式。
    rule_excerpt: The [positive/negative] effect of [X] on [Y] is weakened when [Z] is [high/present] because [Z] reduces
      the [cost/risk/uncertainty/constraint] that underlies the [X]→[Y] mechanism.
    rule_locator: write-theory/corpus/sentences/moderation.md
    target: write-theory/corpus/sentences/moderation.md + write-theory/corpus/variants/E_moderation.md（假设模板按交互模式 table）
    diagnosis: Ridge et al. (2024) H3/H4 框架是 "positive interaction effect ... negative relationship is mitigated as [cue]
      increases and prompts more [aggressive] action"——cue 不削弱避免机制，而是激活对立行为表现型（manifestation-switch）。Buffering 是最近邻但编码不同理论引擎（弱化机制）。writer
      会把 switch-moderation 硬塞进 buffering，腐蚀 why-chain。
    proposed_change:
      action: add_branch
      summary: ADD 'Mitigation via Manifestation-Switch' 交互模式到 moderation.md（句+判别）与 E_moderation.md 假设模板表；判别于 Buffering（机制削弱）。
    absolute_rule: false
    decisive_falsifier: false
    applicability:
      build_types:
      - 调节效应型
      hypothesis_families:
      - trait_activation_cue_switch
      journals: []
